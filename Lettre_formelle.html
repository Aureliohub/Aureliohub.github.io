<!DOCTYPE html>
<html lang="fr-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lettre formelle</title>
<style>
  :root{
    --papier:#FFFFFF;
    --gris-fond:#F5F5F7;
    --encre:#1D1D1F;
    --gris:#6E6E73;
    --filet:#D2D2D7;
    --bleu:#0071E3;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;padding:0}
  body{
    background:var(--papier);color:var(--encre);font-family:var(--sans);
    font-size:17px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .page{
    height:100svh;max-width:1260px;margin:0 auto;padding:22px 22px 26px;
    display:flex;flex-direction:column;gap:18px;
  }

  header.tete{text-align:center;flex:none}
  header.tete h1{
    margin:0 0 10px;font-size:clamp(1.3rem,3vw,2.1rem);font-weight:600;
    line-height:1.15;letter-spacing:-.025em;
  }
  header.tete p{margin:0 auto;color:var(--gris);max-width:74ch;font-size:1rem}

  .contenu{flex:1;min-height:0;display:flex;flex-direction:column;gap:18px;align-items:center}
  .contenu .bloc{width:100%;max-width:calc((100% - 22px) / 2)}

  .bloc{
    background:var(--gris-fond);border-radius:18px;padding:20px 22px;
    display:flex;flex-direction:column;gap:14px;min-height:0;
  }
  .bloc.lettre{flex:1;min-height:0}
  .bloc.eval{flex:none}
  .entete{display:flex;align-items:center;gap:12px;flex:none}
  .entete .consigne{align-self:flex-start}
  .num{
    flex:none;display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:50%;background:var(--papier);color:var(--bleu);
    font-size:.82rem;font-weight:600;box-shadow:inset 0 0 0 1.5px var(--bleu);
  }
  .consigne{margin:0;font-size:.96rem}

  .pages{
    flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
    display:flex;flex-direction:column;gap:14px;padding-right:4px;
  }
  .feuille{flex:none;margin:0;display:flex;flex-direction:column;gap:6px}
  .feuille img{
    display:block;width:100%;height:auto;border-radius:12px;background:var(--papier);
    box-shadow:0 1px 2px rgba(0,0,0,.10);
  }
  .feuille figcaption{font-size:.82rem;color:var(--gris);text-align:center}

  .bouton{
    align-self:flex-start;display:inline-flex;align-items:center;gap:10px;flex:none;
    font:inherit;font-size:.95rem;font-weight:500;background:var(--bleu);color:#fff;
    border:none;border-radius:999px;padding:11px 22px;cursor:pointer;text-decoration:none;
  }
  .bouton:hover{background:#0077ED}
  .bouton:focus-visible{outline:2px solid var(--bleu);outline-offset:3px}
  .bouton svg{width:17px;height:17px}

  @media (max-width:1000px){
    body{overflow:auto}
    .page{height:auto;padding:20px 18px 44px}
    .contenu .bloc{max-width:none}
    .pages{overflow:visible}
  }
</style>
</head>
<body>
<div class="page">

  <header class="tete">
    <h1>Lettre formelle</h1>
  </header>

  <div class="contenu">

    <section class="bloc lettre">

        et en respectant les indications liées aux retours de ligne et tabulations figurant en page 2.</p>
