<!DOCTYPE html>
<html lang="fr-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --fond:#f8fafd; --panneau:#fff; --carte:#f0f4f9; --carte-survol:#e1e5ea;
    --texte:#1f1f1f; --gris:#444746; --gris-clair:#747775; --ligne:#c4c7c5;
    --survol:#e9eef6; --actif:#c2e7ff; --bleu:#0b57d0; --cible:#d3e3fd;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body {
    background:var(--fond); color:var(--texte);
    font-family:Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  button { font:inherit; color:inherit; }
  svg { flex-shrink:0; }

  /* ── En-tête ───────────────────────────────────── */
  .entete { height:64px; display:flex; align-items:center; gap:16px; padding:0 16px 0 20px; flex-shrink:0; }
  .logo { width:268px; display:flex; align-items:center; gap:10px; font-size:22px; color:var(--gris); }
  .recherche {
    flex:1; max-width:720px; height:48px; border-radius:24px; background:#e9eef6;
    display:flex; align-items:center; gap:12px; padding:0 16px;
  }
  .recherche:focus-within { background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .recherche input { flex:1; border:0; background:none; outline:none; font:inherit; font-size:16px; color:var(--texte); }

  /* ── Corps ─────────────────────────────────────── */
  .corps { flex:1; min-height:0; display:flex; }

  /* ── Barre latérale ────────────────────────────── */
  .lateral { width:300px; flex-shrink:0; padding:8px 12px 16px 12px; display:flex; flex-direction:column; overflow:hidden; }
  .nouveau {
    align-self:flex-start; display:flex; align-items:center; gap:12px; height:56px; padding:0 20px 0 16px;
    margin:0 0 16px 4px; flex-shrink:0; border:0; border-radius:16px; background:#fff; font-size:14px; font-weight:500;
    box-shadow:0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15); cursor:pointer;
  }
  .nouveau:hover { background:#f6f9fe; box-shadow:0 1px 3px rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15); }
  .arbre { flex:1 1 auto; min-height:0; overflow-y:auto; }
  .noeud {
    display:flex; align-items:center; gap:10px; min-height:32px; padding:4px 12px 4px 0;
    border-radius:16px; cursor:pointer; font-size:14px; color:var(--texte); user-select:none;
  }
  .noeud:hover { background:var(--survol); }
  .noeud.actif { background:var(--actif); font-weight:500; }
  .noeud.cible { background:var(--cible); box-shadow:inset 0 0 0 2px var(--bleu); }
  .caret {
    width:20px; height:20px; border:0; background:none; padding:0; display:flex; align-items:center; justify-content:center;
    cursor:pointer; border-radius:50%; color:var(--gris); transition:transform .15s;
  }
  .caret.ouvert { transform:rotate(90deg); }
  .caret.sans { visibility:hidden; }
  .noeud .nom { flex:1; min-width:0; line-height:18px; }
  .noeud.niv1 .nom { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .noeud.niv2 { font-size:13px; }
  .noeud.niv2 .nom { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .lien-arbre .fav { width:16px; height:16px; margin:0 1px; border-radius:3px; }
  .sous { display:none; }
  .sous.ouvert { display:block; }
  .sep { flex-shrink:0; height:1px; background:var(--ligne); opacity:.5; margin:12px 12px; }
  .outils { flex-shrink:0; display:flex; flex-direction:column; gap:2px; }
  .outils .noeud { padding-left:12px; }

  /* ── Panneau principal ─────────────────────────── */
  .panneau {
    flex:1; min-width:0; margin:0 16px 16px 0; background:var(--panneau); border-radius:16px;
    display:flex; flex-direction:column; overflow:hidden; position:relative;
  }
  .panneau.cible::after {
    content:""; position:absolute; inset:0; border-radius:16px; pointer-events:none;
    box-shadow:inset 0 0 0 3px var(--bleu); background:rgba(11,87,208,.04);
  }
  .barre { display:flex; align-items:center; gap:12px; padding:16px 20px 8px 24px; flex-shrink:0; }
  .fil { flex:1; min-width:0; display:flex; align-items:center; gap:4px; font-size:22px; }
  .fil .etape { padding:4px 8px; border-radius:18px; color:var(--gris); cursor:pointer; white-space:nowrap; }
  .fil .etape:hover { background:var(--survol); }
  .fil .etape.derniere { color:var(--texte); cursor:default; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .fil .etape.derniere:hover { background:none; }
  .fil .chevron { color:var(--gris); flex-shrink:0; }
  .vues { display:flex; border:1px solid var(--gris-clair); border-radius:20px; overflow:hidden; flex-shrink:0; }
  .vues button { width:52px; height:32px; border:0; background:none; display:flex; align-items:center; justify-content:center; gap:2px; cursor:pointer; }
  .vues button + button { border-left:1px solid var(--gris-clair); }
  .vues button.actif { background:var(--actif); }
  .contenu { flex:1; overflow-y:auto; padding:8px 20px 24px 24px; }
  .section { font-size:14px; font-weight:500; color:var(--texte); margin:16px 0 12px 4px; }
  .grille { display:grid; gap:16px; grid-template-columns:repeat(4, minmax(0, 1fr)); }
  @media (max-width:1000px) { .logo { width:auto; } .lateral { width:250px; } }

  /* Dossiers */
  .dossier {
    display:flex; align-items:center; gap:14px; height:56px; padding:0 16px; border-radius:12px;
    background:var(--carte); cursor:pointer; font-size:14px; font-weight:500; user-select:none;
  }
  .dossier:hover { background:var(--carte-survol); }
  .dossier.cible { background:var(--cible); box-shadow:inset 0 0 0 2px var(--bleu); }
  .dossier .nom { flex:1; min-width:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:18px; }
  .dossier .nb { font-size:12px; font-weight:400; color:var(--gris-clair); }

  /* Vignettes */
  .carte {
    background:var(--carte); border-radius:12px; padding:0 8px 8px; display:flex; flex-direction:column;
    cursor:pointer; text-decoration:none; color:inherit; user-select:none;
  }
  .carte:hover { background:var(--carte-survol); }
  .carte { position:relative; }
  .carte.traine { opacity:.4; }
  .carte.ins-avant::before, .carte.ins-apres::after {
    content:""; position:absolute; top:0; bottom:0; width:1px; background:var(--bleu); pointer-events:none;
  }
  .carte.ins-avant::before { left:-9px; }
  .carte.ins-apres::after { right:-9px; }
  .liste .carte.ins-avant::before, .liste .carte.ins-apres::after { left:0; right:0; width:auto; height:1px; }
  .liste .carte.ins-avant::before { top:-1px; bottom:auto; }
  .liste .carte.ins-apres::after { top:auto; bottom:-1px; }
  .carte .tete { height:52px; display:flex; align-items:center; gap:12px; padding:0 0 0 8px; }
  .carte .tete img.fav { width:20px; height:20px; border-radius:4px; }
  .carte .titre { flex:1; min-width:0; font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .points {
    width:36px; height:36px; border:0; border-radius:50%; background:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:var(--gris);
  }
  .points:hover { background:rgba(68,71,70,.12); }
  .apercu { position:relative; aspect-ratio:4 / 3; background:#fff; border-radius:8px; overflow:hidden; }
  .apercu img { width:100%; height:100%; object-fit:cover; object-position:top; display:block; }
  /* zoom sur la page du document : largeur et décalages posés en % de la largeur de la vignette */
  .apercu img.zoom { position:absolute; left:0; top:0; height:auto; max-width:none; object-fit:fill; }
  .apercu .attente {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; color:var(--gris-clair); text-align:center; padding:8px;
  }
  .carte .lieu { display:none; }

  /* Vue liste */
  .liste .grille { display:flex; flex-direction:column; gap:0; }
  .liste .dossier, .liste .carte {
    background:none; border-radius:0; height:48px; padding:0 8px; border-bottom:1px solid #e3e3e3; flex-direction:row; align-items:center;
  }
  .liste .dossier:hover, .liste .carte:hover { background:var(--survol); }
  .liste .carte .tete { flex:1; height:auto; padding:0; min-width:0; }
  .liste .carte .titre { font-weight:400; }
  .liste .carte .lieu { display:block; width:34%; font-size:13px; color:var(--gris); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 12px; }
  .liste .apercu { display:none; }

  .vide {
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    padding:56px 16px; color:var(--gris); font-size:15px; text-align:center;
  }
  .vide { padding-top:72px; }
  .vide strong { font-size:28px; font-weight:400; color:var(--texte); margin-top:16px; }
  .vide span { font-size:16px; }

  /* Menu contextuel */
  .menu {
    position:fixed; z-index:10; min-width:220px; padding:8px 0; background:#fff; border-radius:4px;
    box-shadow:0 2px 6px 2px rgba(60,64,67,.15), 0 1px 2px rgba(60,64,67,.3); display:none;
  }
  .menu.ouvert { display:block; }
  .menu button { display:flex; align-items:center; gap:16px; width:100%; height:36px; padding:0 16px; border:0; background:none; text-align:left; font-size:14px; cursor:pointer; }
  .menu button:hover { background:#f1f3f4; }
  .menu hr { border:0; border-top:1px solid #e3e3e3; margin:8px 0; }
  .menu .raccourci { margin-left:auto; padding-left:40px; font-size:13px; color:var(--gris); }
  #menu-nouveau, .menu-fichier { min-width:320px; border-radius:8px; }
  #menu-nouveau button, .menu-fichier button { height:48px; font-size:15px; }
  .menu-fichier { min-width:340px; }
  .menu-fichier .raccourci { font-size:14px; padding-left:24px; }
  .menu .fleche { margin-left:auto; display:flex; }
  .menu button.deploye { background:#e8eaed; }
  .sous-menu { z-index:11; min-width:260px; }
  .dialogue .qr { display:flex; justify-content:center; padding:8px 0; }
  .dialogue .qr svg { width:min(320px, 70vw); height:auto; }
  .dialogue dl { display:grid; grid-template-columns:auto 1fr; gap:10px 16px; margin:0; font-size:14px; }
  .dialogue dt { color:var(--gris); }
  .dialogue dd { margin:0; word-break:break-all; }
  .dialogue dd a { color:var(--bleu); }
  .menu button[hidden], .menu hr[hidden] { display:none; }
  .apercu-doc { position:absolute; inset:0; overflow:hidden; pointer-events:none; background:#fff; }
  .apercu .icone-type { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .visionneuse { position:fixed; inset:0; z-index:25; background:rgba(32,33,36,.92); display:none; flex-direction:column; }
  .visionneuse.ouvert { display:flex; }
  .vis-barre { height:64px; flex-shrink:0; display:flex; align-items:center; gap:12px; padding:0 12px; color:#fff; font-size:16px; }
  #vis-nom { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #vis-icone { display:flex; }
  .vis-bouton { width:44px; height:44px; border:0; border-radius:50%; background:none; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .vis-bouton:hover { background:rgba(255,255,255,.12); }
  .vis-corps { flex:1; min-height:0; overflow:auto; display:flex; justify-content:center; padding:0 24px 24px; }
  .vis-corps iframe { width:min(1100px, 100%); height:100%; border:0; background:#fff; border-radius:4px; }
  .vis-corps > img { max-width:100%; max-height:100%; object-fit:contain; align-self:center; }
  .vis-doc { width:100%; align-self:flex-start; }
  .vis-doc .docx-wrapper { background:transparent !important; padding:0 0 24px !important; }
  .vis-tableur { align-self:flex-start; background:#fff; border-radius:4px; max-width:100%; overflow:auto; }
  .vis-tableur table { border-collapse:collapse; font:13px Calibri, Arial, sans-serif; }
  .vis-tableur td { border:1px solid #e0e0e0; padding:3px 8px; white-space:nowrap; height:21px; }
  .vis-onglets { position:sticky; bottom:0; display:flex; gap:2px; background:#f1f3f4; border-top:1px solid #dadce0; padding:0 8px; }
  .vis-onglets button { border:0; background:none; padding:8px 14px; font-size:13px; cursor:pointer; border-bottom:3px solid transparent; }
  .vis-onglets button.actif { border-bottom-color:#188038; color:#188038; font-weight:500; background:#fff; }
  .vis-vide { align-self:center; background:#fff; border-radius:8px; padding:32px 40px; text-align:center; font-size:15px; color:var(--gris); display:flex; flex-direction:column; align-items:center; gap:16px; }
  .vis-vide button { border:0; border-radius:20px; background:var(--bleu); color:#fff; font-weight:500; padding:10px 20px; cursor:pointer; }
  .pastille { width:8px; height:8px; border-radius:50%; background:#e37400; margin-right:4px; display:none; }
  .pastille.visible { display:block; }
  .dialogue .alerte { display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:8px; background:#fce8e6; color:#8c1d18; font-size:14px; line-height:20px; margin:0 0 4px; }
  .dialogue .actions button.danger { background:#b3261e; color:#fff; }
  .dialogue .actions button.danger:hover { background:#8c1d18; }
  .noeud.traine, .dossier.traine { opacity:.4; }
  .noeud, .dossier { position:relative; }
  .noeud.ins-avant::before, .noeud.ins-apres::after, .dossier.ins-avant::before, .dossier.ins-apres::after {
    content:""; position:absolute; left:8px; right:8px; height:1px; background:var(--bleu); pointer-events:none;
  }
  .noeud.ins-avant::before, .liste .dossier.ins-avant::before { top:-1px; }
  .noeud.ins-apres::after, .liste .dossier.ins-apres::after { bottom:-1px; }
  .panneau:not(.liste) .dossier.ins-avant::before, .panneau:not(.liste) .dossier.ins-apres::after { top:0; bottom:0; left:auto; right:auto; width:1px; height:auto; }
  .panneau:not(.liste) .dossier.ins-avant::before { left:-9px; }
  .panneau:not(.liste) .dossier.ins-apres::after { right:-9px; }
  .toast {
    position:fixed; left:24px; bottom:24px; z-index:30; display:none; align-items:center; gap:24px;
    min-height:48px; padding:6px 8px 6px 16px; border-radius:4px; background:#303030; color:#fff; font-size:14px;
    box-shadow:0 3px 5px -1px rgba(0,0,0,.2), 0 6px 10px rgba(0,0,0,.14);
  }
  .toast.ouvert { display:flex; }
  .toast button { border:0; background:none; color:#a8c7fa; font-weight:500; font-size:14px; padding:8px 12px; border-radius:4px; cursor:pointer; }
  .toast button:hover { background:rgba(168,199,250,.12); }
  .toast button:empty { display:none; }
  .corbeille-tete { display:flex; align-items:center; justify-content:space-between; margin:8px 4px 4px; padding:10px 16px; border-radius:8px; background:#f0f4f9; font-size:14px; color:var(--gris); }
  .corbeille-tete button { border:0; background:none; color:var(--bleu); font-weight:500; font-size:14px; padding:8px 12px; border-radius:18px; cursor:pointer; }
  .corbeille-tete button:hover { background:#edf2fc; }
  .dossier .points { margin-right:-10px; }

  /* Fenêtres de dialogue */
  .scrim { position:fixed; inset:0; z-index:20; background:rgba(32,33,36,.45); display:none; align-items:center; justify-content:center; }
  .scrim.ouvert { display:flex; }
  .dialogue {
    width:min(440px, calc(100vw - 32px)); background:#fff; border-radius:28px; padding:24px;
    box-shadow:0 4px 8px 3px rgba(60,64,67,.15), 0 1px 3px rgba(60,64,67,.3);
  }
  .dialogue h2 { margin:0 0 16px; font-size:24px; font-weight:400; }
  .dialogue .info { margin:0 0 16px; font-size:14px; line-height:20px; color:var(--gris); }
  .dialogue input[type=text] {
    width:100%; height:48px; padding:0 14px; border:1px solid var(--gris-clair); border-radius:4px;
    font:inherit; font-size:16px; color:var(--texte);
  }
  .dialogue input[type=text]:focus { outline:2px solid var(--bleu); outline-offset:-1px; border-color:transparent; }
  .dialogue .choix { max-height:50vh; overflow-y:auto; border:1px solid #e3e3e3; border-radius:8px; padding:4px 0; }
  .dialogue .ligne { display:flex; align-items:center; gap:10px; padding:8px 12px; font-size:14px; cursor:pointer; }
  .dialogue .ligne:hover { background:var(--survol); }
  .dialogue .ligne .nb { margin-left:auto; font-size:12px; color:var(--gris-clair); }
  .dialogue .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:24px; }
  .dialogue .actions button {
    height:40px; padding:0 16px; border:0; border-radius:20px; background:none;
    color:var(--bleu); font-weight:500; font-size:14px; cursor:pointer;
  }
  .dialogue .actions button:hover { background:#edf2fc; }
</style>
</head>
<body>

<header class="entete">
  <div class="logo">
    <svg width="34" height="34" viewBox="0 0 24 24"><path fill="#92CDE2" stroke="rgba(0,0,0,.35)" stroke-width=".8" d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/><path fill="#1f1f1f" d="M10.6 14.4a2.4 2.4 0 0 1 0-3.4l1.6-1.6a2.4 2.4 0 0 1 3.4 3.4l-.8.8-1-1 .8-.8a1 1 0 0 0-1.4-1.4l-1.6 1.6a1 1 0 0 0 0 1.4z"/><path fill="#1f1f1f" d="M13.4 11.6a2.4 2.4 0 0 1 0 3.4l-1.6 1.6a2.4 2.4 0 0 1-3.4-3.4l.8-.8 1 1-.8.8a1 1 0 0 0 1.4 1.4l1.6-1.6a1 1 0 0 0 0-1.4z"/></svg>
    <span>Maths</span>
  </div>
  <label class="recherche">
    <svg width="22" height="22" viewBox="0 0 24 24"><path fill="#444746" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input id="recherche" type="search" placeholder="Rechercher dans les liens" autocomplete="off">
  </label>
</header>

<div class="corps">
  <nav class="lateral">
    <button class="nouveau" id="btn-nouveau">
      <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#1f1f1f" d="M20 13h-7v7h-2v-7H4v-2h7V4h2v7h7v2z"/></svg>
      Nouveau
    </button>
    <div class="arbre" id="arbre"></div>
    <div class="sep"></div>
    <div class="outils">
      <div class="noeud" id="btn-corbeille" data-dossier="corbeille">
        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#444746" d="M16 9v10H8V9h8m-1.5-6h-5l-1 1H5v2h14V4h-3.5l-1-1zM18 7H6v12c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7z"/></svg>
        <span class="nom">Corbeille</span>
      </div>
      <div class="noeud" id="btn-enregistrer" title="Télécharge un nouveau drive.html contenant vos vignettes, à déposer sur GitHub">
        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#444746" d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm2 16H5V5h11.17L19 7.83V19zm-7-7c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zM6 6h9v4H6z"/></svg>
        <span class="nom">Enregistrer drive.html</span><span class="pastille" id="pastille" title="Modifications pas encore enregistrées dans drive.html"></span>
      </div>
      <div class="noeud" id="btn-exporter">
        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#444746" d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67 2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/></svg>
        <span class="nom">Exporter les liens</span>
      </div>
      <input type="file" id="fichier-import" multiple hidden>
    </div>
  </nav>

  <main class="panneau" id="panneau">
    <div class="barre">
      <div class="fil" id="fil"></div>

// Zoom sur la page : on repère, dans la capture, la feuille blanche du document (sa largeur et son haut),
// et on agrandit l'image pour que cette largeur remplisse la vignette. Il faut pour cela lire les pixels,
// ce que le navigateur n'autorise que si le service de captures le permet ; sinon l'image reste telle quelle.
function cadrerSurPage(img, tentative = 0) {
  const essai = new Image();
  essai.crossOrigin = 'anonymous';
  essai.onload = () => {
    try {
      const W = essai.naturalWidth, H = essai.naturalHeight;
      // image provisoire du service : on réessaie un peu plus tard
      if (W === 400 && H === 300) { if (tentative < 8) setTimeout(() => cadrerSurPage(img, tentative + 1), 3000); return; }
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      const cx = cv.getContext('2d'); cx.drawImage(essai, 0, 0);
      const px = cx.getImageData(0, 0, W, H).data;
      const blanc = (x, y) => { const i = (y * W + x) * 4; return px[i] > 242 && px[i + 1] > 242 && px[i + 2] > 242; };
      // Bords de la feuille : depuis chaque bord de la capture, premier pixel blanc rencontré.
      // Le texte de la feuille ne gêne pas, puisqu'on s'arrête au premier blanc. Médiane sur plusieurs lignes.
      const g = [], d = [];
      for (let y = Math.round(H * 0.10); y < H * 0.45; y += Math.round(H * 0.025)) {
        if (blanc(1, y) || blanc(W - 2, y)) continue;            // ligne sans fond autour de la feuille
        let x1 = 0; while (x1 < W && !blanc(x1, y)) x1++;
        let x2 = W - 1; while (x2 > x1 && !blanc(x2, y)) x2--;
        if (x2 - x1 > W * 0.3) { g.push(x1); d.push(x2 + 1); }
      }
      if (g.length < 4) return;                                  // pas de feuille distincte : image laissée telle quelle
      const med = a => a.sort((p, q) => p - q)[a.length >> 1];
      const gauche = med(g), droite = med(d), large = droite - gauche;
      // Haut de la feuille : première ligne entièrement blanche entre ses bords (sous la barre d'outils)
      let haut = 0;
      for (let y = 0; y < H * 0.5; y++) {
        let ok = true;
        for (let x = gauche + 4; x < droite - 4; x += 4) if (!blanc(x, y)) { ok = false; break; }
        if (ok) { haut = y; break; }
      }
      img.classList.add('zoom');
      img.style.width = (W / large * 100) + '%';
      img.style.marginLeft = (-gauche / large * 100) + '%';
      img.style.marginTop = (-haut / large * 100) + '%';
    } catch (e) {}
  };
  // adresse distincte de celle de l'image affichée : sinon le navigateur reprend sa copie en cache,
  // obtenue sans autorisation de lecture, et l'analyse échoue
  essai.src = img.src + '&lecture=' + tentative;
}

// relancer = true : on demande au service de refaire la capture (requeue), puis on attend qu'elle soit prête.
function chargerApercu(apercu, url, relancer) {
  const img = apercu.querySelector('img');
  const attente = apercu.querySelector('.attente');
  const jeton = Date.now().toString(36);   // contourne le cache du navigateur pendant l'attente
  let attentes = 0, erreurs = 0;
  img.classList.remove('zoom'); img.removeAttribute('style');
  img.style.visibility = 'hidden';
  attente.style.display = 'flex'; attente.textContent = 'Capture en cours…';
  const suivant = () => setTimeout(() => { img.src = urlCapture(url, 't=' + jeton + '-' + (attentes + erreurs)); }, 3000);
  img.onload = () => {
    // le service renvoie d'abord une image provisoire de 400×300 pendant la capture
    if (img.naturalWidth === 400 && img.naturalHeight === 300) {
      if (++attentes < 15) suivant(); else attente.textContent = 'Aperçu indisponible';
    } else { img.style.visibility = 'visible'; attente.style.display = 'none'; cadrerSurPage(img); }
  };
  // une erreur passagère du service ne doit pas être définitive : quelques nouvelles tentatives
  img.onerror = () => { if (++erreurs < 5) suivant(); else attente.textContent = 'Aperçu indisponible'; };
  img.src = urlCapture(url, relancer ? 'requeue=true&t=' + jeton : '');
}

// ═══ AJOUT, DÉPLACEMENT ══════════════════════════════════════════════════
function lireDepot(dt) {
  let url = '', titre = '';
  const moz = dt.getData('text/x-moz-url');               // Firefox : URL \n titre
  if (moz) { [url, titre] = moz.split('\n'); }
  if (!url) {
    const liste = dt.getData('text/uri-list');
    url = (liste.split(/\r?\n/).find(l => l && !l.startsWith('#')) || '').trim();
  }
  if (!url) url = dt.getData('text/plain').trim();
  if (!titre) {                                          // Chrome / Edge : lien <a> dans text/html
    const html = dt.getData('text/html');
    if (html) {
      const d = new DOMParser().parseFromString(html, 'text/html');
      const lienA = d.querySelector('a');
      titre = (lienA ? lienA.textContent : d.body.textContent).trim();
    }
  }
  url = (url || '').trim();
  if (!/^https?:\/\//i.test(url)) return null;
  titre = (titre || '').trim();
  if (!titre || titre === url) titre = domaineDe(url);
  return { url, titre };
}

// Changer l'ordre : vignette glissée sur une autre vignette du dossier ouvert.
// Un trait bleu indique où elle s'insérera (avant ou après, selon le côté survolé).
function insertionSous(e) {
  if (!lienTraine || filtre || courant === CORBEILLE) return null;
  const carte = e.target.closest && e.target.closest('.carte');
  if (!carte || carte.dataset.lien === lienTraine) return null;
  const rc = carte.getBoundingClientRect();
  const apres = etat.vue === 'liste' ? e.clientY > rc.top + rc.height / 2 : e.clientX > rc.left + rc.width / 2;
  return { carte, cible:carte.dataset.lien, apres };
}
function reordonner(idLien, idCible, apres) {
  const l = etat.liens.find(x => x.id === idLien), c = etat.liens.find(x => x.id === idCible);
  if (!l || !c || l === c) return;
  etat.liens.splice(etat.liens.indexOf(l), 1);
  etat.liens.splice(etat.liens.indexOf(c) + (apres ? 1 : 0), 0, l);
  l.dossier = c.dossier;

}

function cibleSous(e) {
  const d = e.target.closest && e.target.closest('[data-dossier]');

function viseeDossier(e) {
  const el = e.target.closest && e.target.closest('[data-dossier]');

  if (cible === CORBEILLE) return { el, cible, mode:'dans' };
  // bord du dossier visé : insertion à côté de lui, s'il est permis de rejoindre son dossier parent
  const D = DOSSIERS[cible], rc = el.getBoundingClientRect();
  const horizontal = el.classList.contains('dossier') && etat.vue !== 'liste';
  const pos = horizontal ? (e.clientX - rc.left) / rc.width : (e.clientY - rc.top) / rc.height;
  if (D && !D.fixe && (pos < .25 || pos > .75) && peutRecevoir(dossierTraine, D.parent))
    return { el, cible, mode: pos < .25 ? 'avant' : 'apres' };
  return peutRecevoir(dossierTraine, cible) ? { el, cible, mode:'dans' } : null;
}
function reordonnerDossier(id, idCible, apres) {
  const d = etat.dossiers.find(x => x.id === id), c = etat.dossiers.find(x => x.id === idCible);
  if (!d || !c || !peutRecevoir(id, c.parent)) return;
  etat.dossiers.splice(etat.dossiers.indexOf(d), 1);
  etat.dossiers.splice(etat.dossiers.indexOf(c) + (apres ? 1 : 0), 0, d);
  d.parent = c.parent;
  indexer(); sauver(); render();
}
function nettoyerCibles() {
  document.querySelectorAll('.cible, .ins-avant, .ins-apres').forEach(x => x.classList.remove('cible', 'ins-avant', 'ins-apres'));
}

document.addEventListener('dragover', e => {
  e.preventDefault();
  nettoyerCibles();
  const ins = insertionSous(e);
  if (ins) { ins.carte.classList.add(ins.apres ? 'ins-apres' : 'ins-avant'); e.dataTransfer.dropEffect = 'move'; return; }
  if (dossierTraine) {
    const v = viseeDossier(e);
    e.dataTransfer.dropEffect = v ? 'move' : 'none';
    if (v) v.el.classList.add(v.mode === 'dans' ? 'cible' : v.mode === 'avant' ? 'ins-avant' : 'ins-apres');
    return;
  }
  const c = cibleSous(e);
  if (!c || (lienTraine && c.el === panneau) || (!lienTraine && c.dossier === CORBEILLE)) { e.dataTransfer.dropEffect = 'none'; return; }
  e.dataTransfer.dropEffect = lienTraine ? 'move' : 'copy';
  c.el.classList.add('cible');
});
document.addEventListener('dragleave', e => { if (!e.relatedTarget) nettoyerCibles(); });
document.addEventListener('drop', e => {
  e.preventDefault(); nettoyerCibles();
  const ins = insertionSous(e);
  if (ins) { reordonner(lienTraine, ins.cible, ins.apres); lienTraine = null; return; }
  if (dossierTraine) {
    const v = viseeDossier(e), id = dossierTraine;
    dossierTraine = null;
    if (!v) return;
    if (v.cible === CORBEILLE) supprimerDossier(id);
    else if (v.mode === 'dans') deplacerDossier(id, v.cible);
    else reordonnerDossier(id, v.cible, v.mode === 'apres');
    return;
  }
  const c = cibleSous(e);
  if (!c) return;
  const interne = lienTraine || e.dataTransfer.getData(TYPE_INTERNE);
  if (interne) { if (c.el !== panneau) deplacer(interne, c.dossier); lienTraine = null; return; }
  if (e.dataTransfer.files && e.dataTransfer.files.length) {
    if (c.dossier !== CORBEILLE) importerFichiers([...e.dataTransfer.files], c.dossier);
    return;
  }
  const lien = lireDepot(e.dataTransfer);
  if (lien && c.dossier !== CORBEILLE) ajouter(lien, c.dossier);
});

function peutRecevoir(idDossier, cible) {
  return !!DOSSIERS[cible] && cible !== CORBEILLE && !descendants(idDossier).includes(cible);
}
function deplacerDossier(idDossier, cible) {
  const d = etat.dossiers.find(x => x.id === idDossier);
  if (!d || !peutRecevoir(idDossier, cible) || d.parent === cible) return;

async function choisirDossierPour(d) {

  (function parcourir(id, prof) {
    if (id === d.id) return;                       // le dossier lui-même et son contenu ne sont pas proposés
    lignes.push({ id, prof }); enfants(id).forEach(k => parcourir(k, prof + 1));
  })(RACINE, 0);

  const cible = await ouvrirDialogue(`<h2>Déplacer « ${esc(d.nom)} »</h2>

    () => { const r = dialogue.querySelector('input[name=dlg-dossier]:checked'); return r ? r.value : null; });

// ── Supprimer un dossier personnel : message d'alerte, puis son contenu va à la corbeille
async function supprimerDossier(idDossier) {
  const d = etat.dossiers.find(x => x.id === idDossier);
  if (!d) return;
  const ids = new Set(descendants(d.id));
  const dedans = actifs().filter(l => ids.has(l.dossier)), n = dedans.length, nd = ids.size - 1;
  const contenu = [nd ? pluriel(nd, 'sous-dossier') : '', n ? pluriel(n, 'élément') : ''].filter(Boolean).join(' et ');
  // dossier vide : suppression directe ; sinon une simple confirmation
  if (contenu) {
    dialogue.dataset.ok = 'Supprimer';
    const ok = await ouvrirDialogue(`<h2>Supprimer « ${esc(d.nom)} » ?</h2>
      <p class="info">Ce dossier contient ${contenu}.${n ? ' ' + (n > 1 ? 'Les éléments seront placés' : 'L\'élément sera placé') + ' dans la corbeille.' : ''}</p>`, () => true);
    if (!ok) return;
  }
  etat.dossiers = etat.dossiers.filter(x => !ids.has(x.id));
  dedans.forEach(l => { l.corbeille = Date.now(); });
  if (ids.has(courant)) courant = d.parent;
  indexer(); sauver(); render();
  toast('Dossier « ' + d.nom + ' » supprimé' + (n ? ' ; son contenu est dans la corbeille' : ''));
}

    case 'copier-lien': versPressePapiers(l.url).then(ok => toast(ok ? 'Lien copié dans le presse-papiers' : 'La copie a été refusée par le navigateur')); break;
    case 'email':
      location.href = 'mailto:?subject=' + encodeURIComponent(l.titre) + '&body=' + encodeURIComponent(l.titre + '\n' + l.url);
      break;
    case 'qr': afficherQR(l); break;
    case 'deplacer': choisirDossier(l); break;
    case 'emplacement': aller(DOSSIERS[l.dossier] ? l.dossier : RACINE); break;
    case 'details': afficherDetails(l); break;

      if (l.fichier) {

async function versPressePapiers(texte) {
  try { await navigator.clipboard.writeText(texte); return true; }
  catch (e) {
    const z = document.createElement('textarea'); z.value = texte; z.style.position = 'fixed'; z.style.opacity = '0';
    document.body.appendChild(z); z.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {}
    z.remove(); return ok;
  }
}

// ── Télécharger : le document lui-même quand le site l'autorise (c'est le cas de GitHub Pages),
//    sinon il s'ouvre dans un nouvel onglet, d'où on peut l'enregistrer.
async function telecharger(l) {
  toast('Préparation du téléchargement…');
  try {
    const rep = await fetch(l.url);
    if (!rep.ok) throw new Error(rep.status);
    const blob = await rep.blob();
    let nom = decodeURIComponent(new URL(rep.url || l.url).pathname.split('/').pop() || '');
    if (!/\.[a-z0-9]{2,5}$/i.test(nom)) {
      const ext = { 'text/html':'html', 'application/pdf':'pdf', 'image/png':'png', 'image/jpeg':'jpg' }[(blob.type || '').split(';')[0]] || 'html';
      nom = (l.titre || domaineDe(l.url)).replace(/[\\/:*?"<>|]+/g, '-').slice(0, 80) + '.' + ext;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = nom;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('« ' + nom + ' » téléchargé');
  } catch (e) {
    window.open(l.url, '_blank', 'noopener');
    toast('Ce site ne permet pas le téléchargement direct : le document s\'ouvre dans un nouvel onglet');
  }
}

// ── Code QR : pour ouvrir le lien sur les téléphones des élèves
let qrPret = null;

document.getElementById('btn-enregistrer').onclick = async () => {
  // le fichier d'origine exact quand la page est en ligne ; sinon la copie prise au démarrage
  let source = SOURCE_INITIALE;
  if (/^https?:/.test(location.protocol)) {
    try { const rep = await fetch(location.href, { cache:'no-store' }); if (rep.ok) source = await rep.text(); } catch (e) {}
  }
  const version = Date.now();
  const json = JSON.stringify(Object.assign({ version }, contenuIntegrable())).replace(/</g, '\\u003c');
  const bloc = /<script id="donnees" type="application\/json">[\s\S]*?<\/script>/;
  if (!bloc.test(source)) { toast('Le fichier n\'a pas pu être préparé'); return; }
  source = source.replace(bloc, () => `<script id="donnees" type="application/json">${json}<\/script>`);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([source], { type:'text/html' }));
  a.download = 'drive.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  // ce navigateur considère désormais cette version comme la sienne
  etat.base = version; etat.signatureBase = signature(); sauver(); majPastille();
  const exclus = actifs().filter(l => l.fichier).length;

const pluriel = (n, mot) => n + ' ' + mot + (n > 1 ? 's' : '');

async function importerJson(texte) {
  try {
    const d = JSON.parse(texte);
    const liste = Array.isArray(d) ? d : (d.liens || []);
    let nd = 0, n = 0;
    (Array.isArray(d) ? [] : (d.dossiers || [])).forEach(x => {
      if (!x || !x.id || !x.nom || DOSSIERS[x.id]) return;
      etat.dossiers.push({ id:String(x.id), nom:String(x.nom), parent:x.parent || RACINE, couleur:x.couleur }); nd++;
    });
    indexer();
    for (const l of liste) {
      if (!l) continue;
      const dossier = DOSSIERS[l.dossier] ? l.dossier : RACINE;
      if (l.fichier && l.donnees) {
        if (actifs().some(x => x.fichier && x.fichier.nom === l.fichier.nom && x.fichier.taille === l.fichier.taille && x.dossier === dossier)) continue;
        const blob = await (await fetch(l.donnees)).blob();
        const cle = 'f' + nouvelId();
        await ecrireFichier(cle, blob);
        etat.liens.push({ id:nouvelId(), titre:l.titre || l.fichier.nom, dossier, ajoute:Date.now(), fichier:Object.assign({}, l.fichier, { cle }) }); n++;
        continue;
      }
      if (!/^https?:\/\//i.test(l.url)) continue;
      if (etat.liens.some(x => x.url === l.url && x.dossier === dossier)) continue;
      etat.liens.push({ id:nouvelId(), url:l.url, titre:l.titre || domaineDe(l.url), dossier }); n++;
    }
    sauver(); render();
    toast(pluriel(n, 'élément') + ' et ' + pluriel(nd, 'dossier') + ' importés');
  } catch (e) { alert('Ce fichier ne peut pas être lu.'); }
}

// Les fichiers sont gardés dans le navigateur (IndexedDB), qui accepte de gros volumes ;
// la liste, elle, reste avec les liens. Les aperçus calculés sont gardés à part.
let baseOuverte = null;
function base() {
  if (!baseOuverte) baseOuverte = new Promise((ok, ko) => {
    const rq = indexedDB.open('drive_maths', 1);
    rq.onupgradeneeded = () => { rq.result.createObjectStore('fichiers'); rq.result.createObjectStore('apercus'); };
    rq.onsuccess = () => ok(rq.result);
    rq.onerror = () => { baseOuverte = null; ko(rq.error); };
  });
  return baseOuverte;
}
async function stock(magasin, mode, faire) {
  const db = await base();
  return new Promise((ok, ko) => {
    const tx = db.transaction(magasin, mode), rq = faire(tx.objectStore(magasin));
    tx.oncomplete = () => ok(rq && rq.result);
    tx.onerror = tx.onabort = () => ko(tx.error);
  });
}
const lireFichier = cle => stock('fichiers', 'readonly', m => m.get(cle));
const ecrireFichier = (cle, blob) => stock('fichiers', 'readwrite', m => m.put(blob, cle));
const lireApercuStocke = cle => stock('apercus', 'readonly', m => m.get(cle));
const ecrireApercuStocke = (cle, v) => stock('apercus', 'readwrite', m => m.put(v, cle));
async function nettoyerFichiers() {   // efface les fichiers que plus aucun élément n'utilise
  try {
    const utiles = new Set(etat.liens.filter(l => l.fichier).map(l => l.fichier.cle));
    const cles = await stock('fichiers', 'readonly', m => m.getAllKeys());
    for (const c of cles) if (!utiles.has(c)) {
      await stock('fichiers', 'readwrite', m => m.delete(c));
      await stock('apercus', 'readwrite', m => m.delete(c));
      apercusEnMemoire.delete(c);
    }
  } catch (e) {}
}
const enDataURL = blob => new Promise(ok => { const f = new FileReader(); f.onload = () => ok(f.result); f.readAsDataURL(blob); });
const dossierCible = () => courant === CORBEILLE ? RACINE : courant;

function typeFichier(nom, mime) {
  const ext = (nom.split('.').pop() || '').toLowerCase();
  if (ext === 'pdf' || mime === 'application/pdf') return 'pdf';
  if (ext === 'docx') return 'docx';
  if (['doc', 'odt', 'rtf'].includes(ext)) return 'doc';
  if (['xlsx', 'xlsm', 'xls', 'ods', 'csv'].includes(ext)) return 'tableur';
  if (['pptx', 'ppt', 'odp'].includes(ext)) return 'pptx';
  if (/^image\//.test(mime || '') || ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext)) return 'image';
  return 'autre';
}
const NOMS_TYPE = { pdf:'Document PDF', docx:'Document Word', doc:'Document texte', tableur:'Classeur Excel', pptx:'Présentation', image:'Image', autre:'Fichier' };
const COULEURS_TYPE = { pdf:['#EA4335', 'PDF'], docx:['#4285F4', 'W'], doc:['#4285F4', 'W'], tableur:['#0F9D58', 'X'], pptx:['#F29900', 'P'], image:['#EA4335', ''], autre:['#5F6368', ''] };
function iconeType(t, sz = 20) {
  const [c, l] = COULEURS_TYPE[t] || COULEURS_TYPE.autre;
  const motif = t === 'image' ? '<path fill="#fff" d="M4.5 14.5l3.2-4 2.3 2.8 3-3.8 2.5 5z"/>'
    : t === 'autre' ? '<path fill="#fff" d="M6 4.5h5.5L14 7v8.5H6z" opacity=".95"/>'

  return `<svg class="fav" width="${sz}" height="${sz}" viewBox="0 0 20 20"><rect x="1" y="1" width="18" height="18" rx="3" fill="${c}"/>${motif}</svg>`;
}

async function importerFichiers(liste, dossier) {
  let n = 0, dernier = '';
  for (const f of liste) {
    // une sauvegarde de cette page ou un export de marque-pages garde son traitement propre
    if (/\.json$/i.test(f.name)) { await importerJson(await f.text()); continue; }
    if (/\.html?$/i.test(f.name)) {
      const t = await f.text();
      if (/NETSCAPE-Bookmark-file/i.test(t.slice(0, 400))) { await importerMarquePages(t); continue; }
    }
    const cle = 'f' + nouvelId();
    try { await ecrireFichier(cle, f); }
    catch (e) { toast('« ' + f.name + ' » n\'a pas pu être enregistré (espace insuffisant ?)'); continue; }
    etat.liens.push({ id:nouvelId(), titre:f.name, dossier, ajoute:Date.now(),
      fichier:{ cle, nom:f.name, type:typeFichier(f.name, f.type), mime:f.type || '', taille:f.size } });
    n++; dernier = f.name;
  }
  if (!n) return;
  sauver(); render();
  toast(n > 1 ? n + ' fichiers importés' : '« ' + dernier + ' » importé');
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
}

// ── Bibliothèques d'aperçu, chargées seulement quand un fichier de ce type est affiché
const scriptsCharges = {};
function script(src) {
  if (!scriptsCharges[src]) scriptsCharges[src] = new Promise((ok, ko) => {
    const sc = document.createElement('script'); sc.src = src;
    sc.onload = ok; sc.onerror = () => { delete scriptsCharges[src]; ko(); };
    document.head.appendChild(sc);
  });
  return scriptsCharges[src];
}
const LIB = {
  pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfWorker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  jszip: 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
  docx: 'https://cdn.jsdelivr.net/npm/docx-preview@0.3.7/dist/docx-preview.min.js',
  xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
};
async function chargerPdf() { await script(LIB.pdf); pdfjsLib.GlobalWorkerOptions.workerSrc = LIB.pdfWorker; return pdfjsLib; }
async function chargerDocx() { await script(LIB.jszip); await script(LIB.docx); return window.docx; }
async function chargerXlsx() { await script(LIB.xlsx); return window.XLSX; }

// Rendu d'un .docx dans un conteneur (images intégrées en base64 pour que l'aperçu survive au rechargement)
async function rendreDocx(blob, hote, enveloppe) {
  const docx = await chargerDocx();
  await docx.renderAsync(blob, hote, null, { inWrapper:enveloppe, ignoreLastRenderedPageBreak:true, breakPages:true,
    useBase64URL:true, renderHeaders:true, renderFooters:true, experimental:true });
}
// Première feuille d'un classeur, limitée au coin supérieur gauche
function tableHtml(XLSX, ws, lignes, colonnes) {
  const ref = ws['!ref'];
  if (!ref) return '<table><tr><td>&nbsp;</td></tr></table>';
  const z = XLSX.utils.decode_range(ref);
  if (lignes) z.e.r = Math.min(z.e.r, z.s.r + lignes - 1);
  if (colonnes) z.e.c = Math.min(z.e.c, z.s.c + colonnes - 1);
  ws['!ref'] = XLSX.utils.encode_range(z);
  // nombres décimaux à la suisse : virgule au lieu du point
  for (let R = z.s.r; R <= z.e.r; R++) for (let C = z.s.c; C <= z.e.c; C++) {
    const c = ws[XLSX.utils.encode_cell({ r:R, c:C })];
    if (c && c.t === 'n' && /^-?\d+\.\d+$/.test(c.w || '')) c.w = c.w.replace('.', ',');
  }
  const html = XLSX.utils.sheet_to_html(ws, { header:'', footer:'' });
  ws['!ref'] = ref;
  return html;
}
const STYLE_TABLEUR = '<style>table{border-collapse:collapse;font:13px Calibri,Arial,sans-serif;color:#000}td{border:1px solid #d9d9d9;padding:2px 6px;white-space:nowrap;height:20px;min-width:60px}</style>';

// Aperçu de la vignette : { img } (PDF, image) ou { html, largeur } (Word, Excel), calculé une fois puis gardé
async function creerApercu(f) {
  const blob = await lireFichier(f.cle);
  if (!blob) return null;
  if (f.type === 'pdf') {
    const pdfjs = await chargerPdf();
    const doc = await pdfjs.getDocument({ data:new Uint8Array(await blob.arrayBuffer()) }).promise;
    const page = await doc.getPage(1);
    const v1 = page.getViewport({ scale:1 }), vp = page.getViewport({ scale:800 / v1.width });
    const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
    await page.render({ canvasContext:cx, viewport:vp }).promise;
    doc.destroy();
    return { img:cv.toDataURL('image/jpeg', 0.85) };
  }
  if (f.type === 'image') {
    const url = URL.createObjectURL(blob);
    try {
      const im = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
      const k = Math.min(1, 800 / (im.naturalWidth || 800));
      const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round((im.naturalWidth || 800) * k)); cv.height = Math.max(1, Math.round((im.naturalHeight || 600) * k));
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      return { img:cv.toDataURL('image/jpeg', 0.85) };
    } finally { URL.revokeObjectURL(url); }
  }
  if (f.type === 'docx') {
    const hote = document.createElement('div');
    hote.style.cssText = 'position:fixed;left:-20000px;top:0;width:1000px;visibility:hidden';
    document.body.appendChild(hote);
    try {
      await rendreDocx(blob, hote, false);
      const page = hote.querySelector('section');
      if (!page) return null;
      const largeur = page.offsetWidth || 794;
      const styles = [...hote.querySelectorAll('style')].map(x => x.outerHTML).join('');
      return { html:styles + page.outerHTML, largeur };
    } finally { hote.remove(); }
  }
  if (f.type === 'tableur') {
    const XLSX = await chargerXlsx();
    const wb = XLSX.read(new Uint8Array(await blob.arrayBuffer()), { type:'array' });
    const html = STYLE_TABLEUR + tableHtml(XLSX, wb.Sheets[wb.SheetNames[0]], 40, 14);
    // largeur de référence : celle du tableau (au moins 420 px), pour qu'un petit tableau remplisse la vignette
    const hote = document.createElement('div');
    hote.style.cssText = 'position:fixed;left:-20000px;top:0;visibility:hidden';
    hote.innerHTML = html; document.body.appendChild(hote);
    const t = hote.querySelector('table'), largeur = Math.min(1200, Math.max(420, t ? t.offsetWidth + 8 : 800));
    hote.remove();
    return { html, largeur };
  }
  return null;
}
const apercusEnMemoire = new Map();
async function afficherApercuFichier(el, l, refaire) {
  const f = l.fichier;
  el.innerHTML = '<div class="attente">Aperçu en cours…</div>';
  let ap = null;
  if (!refaire) ap = apercusEnMemoire.get(f.cle) || await lireApercuStocke(f.cle).catch(() => null);
  if (!ap) {
    try { ap = await creerApercu(f); } catch (e) { ap = null; }
    if (ap) ecrireApercuStocke(f.cle, ap).catch(() => {});
  }
  if (ap) apercusEnMemoire.set(f.cle, ap);
  el.innerHTML = '';
  if (ap && ap.img) {
    const im = new Image(); im.alt = ''; im.src = ap.img; el.appendChild(im);
  } else if (ap && ap.html) {
    // le document est rendu à sa vraie largeur dans un espace isolé, puis réduit à la largeur de la vignette
    const hote = document.createElement('div'); hote.className = 'apercu-doc'; el.appendChild(hote);
    const ombre = hote.attachShadow({ mode:'open' });
    ombre.innerHTML = `<div class="echelle" style="width:${ap.largeur}px;transform-origin:0 0;background:#fff">${ap.html}</div>`;
    const echelle = ombre.querySelector('.echelle');
    const ajuster = () => { if (el.clientWidth) echelle.style.transform = `scale(${el.clientWidth / ap.largeur})`; };
    ajuster(); new ResizeObserver(ajuster).observe(el);
  } else {
    el.innerHTML = `<div class="icone-type">${iconeType(f.type, 64)}</div>`;
  }
}

async function telechargerFichier(l) {
  const blob = await lireFichier(l.fichier.cle).catch(() => null);
  if (!blob) { toast('Ce fichier n\'est plus disponible dans ce navigateur'); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = l.fichier.nom;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// ── Visionneuse plein écran, comme l'aperçu de Drive
const visionneuse = document.getElementById('visionneuse');
const visCorps = document.getElementById('vis-corps');
let visUrl = null, visLien = null;
function fermerVisionneuse() {
  visionneuse.classList.remove('ouvert'); visCorps.innerHTML = '';
  if (visUrl) { URL.revokeObjectURL(visUrl); visUrl = null; }
  visLien = null;
}
document.getElementById('vis-fermer').onclick = fermerVisionneuse;
document.getElementById('vis-telecharger').onclick = () => { if (visLien) telechargerFichier(visLien); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && visionneuse.classList.contains('ouvert')) fermerVisionneuse(); });

async function ouvrirVisionneuse(l) {
  fermerVisionneuse();
  visLien = l;
  const f = l.fichier;
  document.getElementById('vis-icone').innerHTML = iconeType(f.type, 24);
  document.getElementById('vis-nom').textContent = l.titre;
  visCorps.innerHTML = '<div class="vis-vide">Ouverture…</div>';
  visionneuse.classList.add('ouvert');
  const blob = await lireFichier(f.cle).catch(() => null);
  if (visLien !== l) return;
  if (!blob) { visCorps.innerHTML = '<div class="vis-vide">Ce fichier n\'est plus disponible dans ce navigateur.</div>'; return; }
  const sansApercu = () => {
    visCorps.innerHTML = `<div class="vis-vide">${iconeType(f.type, 56)}<span>Aucun aperçu disponible pour ce type de fichier.</span><button id="vis-dl">Télécharger</button></div>`;
    document.getElementById('vis-dl').onclick = () => telechargerFichier(l);
  };
  try {
    if (f.type === 'pdf') {
      visUrl = URL.createObjectURL(blob.type ? blob : new Blob([blob], { type:'application/pdf' }));
      visCorps.innerHTML = `<iframe src="${visUrl}" title="${esc(l.titre)}"></iframe>`;
    } else if (f.type === 'image') {
      visUrl = URL.createObjectURL(blob);
      visCorps.innerHTML = `<img src="${visUrl}" alt="">`;
    } else if (f.type === 'docx') {
      const hote = document.createElement('div'); hote.className = 'vis-doc';
      visCorps.innerHTML = ''; visCorps.appendChild(hote);
      await rendreDocx(blob, hote, true);
    } else if (f.type === 'tableur') {
      const XLSX = await chargerXlsx();
      const wb = XLSX.read(new Uint8Array(await blob.arrayBuffer()), { type:'array' });
      const zone = document.createElement('div'); zone.className = 'vis-tableur';
      const feuille = document.createElement('div');
      const onglets = document.createElement('div'); onglets.className = 'vis-onglets';
      const montrer = i => {
        feuille.innerHTML = tableHtml(XLSX, wb.Sheets[wb.SheetNames[i]], 2000, 100);
        onglets.querySelectorAll('button').forEach((b, k) => b.classList.toggle('actif', k === i));
      };
      wb.SheetNames.forEach((nom, i) => { const b = document.createElement('button'); b.textContent = nom; b.onclick = () => montrer(i); onglets.appendChild(b); });
      zone.append(feuille, onglets);
      visCorps.innerHTML = ''; visCorps.appendChild(zone);
      montrer(0);
    } else sansApercu();
  } catch (e) {
    if (visLien === l) sansApercu();
  }
}

// ── Import d'un dossier de marque-pages (fichier HTML exporté par Firefox, Chrome, Edge ou Safari)
async function aideImportDossier() {
  dialogue.dataset.ok = 'Choisir le fichier';
  const ok = await ouvrirDialogue(`<h2>Importer un dossier</h2>
    <p class="info">Le navigateur ne laisse pas glisser un dossier entier de marque-pages. Exportez d'abord vos marque-pages au format HTML :</p>
    <p class="info"><b>Firefox</b> : Marque-pages › Gérer les marque-pages › Importation et sauvegarde › Exporter des marque-pages au format HTML.<br>
    <b>Chrome</b> : Favoris › Gestionnaire de favoris › ⋮ › Exporter les favoris.</p>
    <p class="info">Choisissez ensuite ce fichier : vous pourrez sélectionner le dossier à reprendre dans « ${esc(DOSSIERS[courant].nom)} ».</p>`, () => true);
  if (ok) fichierImport.click();
}
function lireDL(dl, nom) {
  const n = { nom, liens:[], dossiers:[] };
  for (const dt of dl.children) {
    if (dt.tagName !== 'DT') continue;
    const h3 = dt.querySelector(':scope > h3');
    if (h3) {
      let sous = dt.querySelector(':scope > dl');
      if (!sous && dt.nextElementSibling && dt.nextElementSibling.tagName === 'DL') sous = dt.nextElementSibling;
      const nomSous = h3.textContent.trim() || 'Sans titre';
      n.dossiers.push(sous ? lireDL(sous, nomSous) : { nom:nomSous, liens:[], dossiers:[] });
      continue;
    }
    const a = dt.querySelector(':scope > a');
    const url = a ? (a.getAttribute('href') || '').trim() : '';
    if (/^https?:\/\//i.test(url)) n.liens.push({ url, titre:a.textContent.trim() || domaineDe(url) });
  }
  return n;
}
const totalMP = n => n.liens.length + n.dossiers.reduce((s, x) => s + totalMP(x), 0);
async function importerMarquePages(texte) {
  const doc = new DOMParser().parseFromString(texte, 'text/html');
  const dl = doc.querySelector('dl');
  const racineMP = dl && lireDL(dl, 'Tous les marque-pages');
  if (!racineMP || !totalMP(racineMP)) { alert('Aucun marque-page trouvé dans ce fichier.'); return; }
  const plats = [];
  (function parcourir(n, prof) { if (totalMP(n)) { plats.push({ n, prof }); n.dossiers.forEach(x => parcourir(x, prof + 1)); } })(racineMP, 0);
  const defaut = plats.length > 1 ? 1 : 0;
  dialogue.dataset.ok = 'Importer';
  const choix = await ouvrirDialogue(`<h2>Importer un dossier</h2>
    <p class="info">Dossier à importer dans « ${esc(DOSSIERS[courant].nom)} » (ses sous-dossiers sont repris) :</p>
    <div class="choix">${plats.map((p, i) => `<label class="ligne" style="padding-left:${12 + p.prof * 20}px">
      <input type="radio" name="dlg-mp" value="${i}" ${i === defaut ? 'checked' : ''}>${iconeDossier('#ffffff', 18)}
      <span>${esc(p.n.nom)}</span><span class="nb">${totalMP(p.n)}</span></label>`).join('')}</div>`,
    () => { const r = dialogue.querySelector('input[name=dlg-mp]:checked'); return r ? plats[+r.value].n : null; });
  if (!choix) return;
  (function creer(n, parent) {
    const id = 'p' + nouvelId();
    etat.dossiers.push({ id, nom:n.nom, parent });
    n.liens.forEach(l => etat.liens.push({ id:nouvelId(), url:l.url, titre:l.titre, dossier:id }));
    n.dossiers.filter(x => totalMP(x)).forEach(x => creer(x, id));
  })(choix, courant);
  if (courant !== RACINE && !etat.ouverts.includes(courant)) etat.ouverts.push(courant);
  indexer(); sauver(); render();
}
