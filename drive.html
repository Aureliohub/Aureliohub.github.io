<!DOCTYPE html>
<html lang="fr-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --fond:#f8fafd; --panneau:#fff; --carte:#f0f4f9; --carte-survol:#e1e5ea;
    --texte:#1f1f1f; --gris:#444746; --gris-clair:#747775; --ligne:#c4c7c5;
    --survol:#e9eef6; --actif:#c2e7ff; --bleu:#0b57d0; --cible:#d3e3fd;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body {
    background:var(--fond); color:var(--texte);
    font-family:Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  button { font:inherit; color:inherit; }
  svg { flex-shrink:0; }

  /* ── En-tête ───────────────────────────────────── */
  .entete { height:64px; display:flex; align-items:center; gap:16px; padding:0 16px 0 20px; flex-shrink:0; }
  .logo { width:268px; display:flex; align-items:center; gap:10px; font-size:22px; color:var(--gris); }
  .recherche {
    flex:1; max-width:720px; height:48px; border-radius:24px; background:#e9eef6;
    display:flex; align-items:center; gap:12px; padding:0 16px;
  }
  .recherche:focus-within { background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .recherche input { flex:1; border:0; background:none; outline:none; font:inherit; font-size:16px; color:var(--texte); }

  /* ── Corps ─────────────────────────────────────── */
  .corps { flex:1; min-height:0; display:flex; }

  /* ── Barre latérale ────────────────────────────── */
  .lateral { width:300px; flex-shrink:0; padding:8px 12px 16px 12px; display:flex; flex-direction:column; overflow-y:auto; }
  .nouveau {
    align-self:flex-start; display:flex; align-items:center; gap:12px; height:56px; padding:0 20px 0 16px;
    margin:0 0 16px 4px; border:0; border-radius:16px; background:#fff; font-size:14px; font-weight:500;
    box-shadow:0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15); cursor:pointer;
  }
  .nouveau:hover { background:#f6f9fe; box-shadow:0 1px 3px rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15); }
  .arbre { flex:1; }
  .noeud {
    display:flex; align-items:center; gap:10px; min-height:32px; padding:4px 12px 4px 0;
    border-radius:16px; cursor:pointer; font-size:14px; color:var(--texte); user-select:none;
  }
  .noeud:hover { background:var(--survol); }
  .noeud.actif { background:var(--actif); font-weight:500; }
  .noeud.cible { background:var(--cible); box-shadow:inset 0 0 0 2px var(--bleu); }
  .caret {
    width:20px; height:20px; border:0; background:none; padding:0; display:flex; align-items:center; justify-content:center;
    cursor:pointer; border-radius:50%; color:var(--gris); transition:transform .15s;
  }
  .caret.ouvert { transform:rotate(90deg); }
  .caret.sans { visibility:hidden; }
  .noeud .nom { flex:1; min-width:0; line-height:18px; }
  .noeud.niv1 .nom { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .noeud.niv2 { font-size:13px; }
  .noeud.niv2 .nom { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .lien-arbre .fav { width:16px; height:16px; margin:0 1px; border-radius:3px; }
  .sous { display:none; }
  .sous.ouvert { display:block; }
  .sep { height:1px; background:var(--ligne); opacity:.5; margin:12px 12px; }
  .outils { display:flex; flex-direction:column; gap:2px; }
  .outils .noeud { padding-left:12px; }

  /* ── Panneau principal ─────────────────────────── */
  .panneau {
    flex:1; min-width:0; margin:0 16px 16px 0; background:var(--panneau); border-radius:16px;
    display:flex; flex-direction:column; overflow:hidden; position:relative;
  }
  .panneau.cible::after {
    content:""; position:absolute; inset:0; border-radius:16px; pointer-events:none;
    box-shadow:inset 0 0 0 3px var(--bleu); background:rgba(11,87,208,.04);
  }
  .barre { display:flex; align-items:center; gap:12px; padding:16px 20px 8px 24px; flex-shrink:0; }
  .fil { flex:1; min-width:0; display:flex; align-items:center; gap:4px; font-size:22px; }
  .fil .etape { padding:4px 8px; border-radius:18px; color:var(--gris); cursor:pointer; white-space:nowrap; }
  .fil .etape:hover { background:var(--survol); }
  .fil .etape.derniere { color:var(--texte); cursor:default; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .fil .etape.derniere:hover { background:none; }
  .fil .chevron { color:var(--gris); flex-shrink:0; }
  .vues { display:flex; border:1px solid var(--gris-clair); border-radius:20px; overflow:hidden; flex-shrink:0; }
  .vues button { width:52px; height:32px; border:0; background:none; display:flex; align-items:center; justify-content:center; gap:2px; cursor:pointer; }
  .vues button + button { border-left:1px solid var(--gris-clair); }
  .vues button.actif { background:var(--actif); }
  .contenu { flex:1; overflow-y:auto; padding:8px 20px 24px 24px; }
  .section { font-size:14px; font-weight:500; color:var(--texte); margin:16px 0 12px 4px; }
  .grille { display:grid; gap:16px; grid-template-columns:repeat(4, minmax(0, 1fr)); }
  @media (max-width:1000px) { .logo { width:auto; } .lateral { width:250px; } }

  /* Dossiers */
  .dossier {
    display:flex; align-items:center; gap:14px; height:56px; padding:0 16px; border-radius:12px;
    background:var(--carte); cursor:pointer; font-size:14px; font-weight:500; user-select:none;
  }
  .dossier:hover { background:var(--carte-survol); }
  .dossier.cible { background:var(--cible); box-shadow:inset 0 0 0 2px var(--bleu); }
  .dossier .nom { flex:1; min-width:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:18px; }
  .dossier .nb { font-size:12px; font-weight:400; color:var(--gris-clair); }

  /* Vignettes */
  .carte {
    background:var(--carte); border-radius:12px; padding:0 8px 8px; display:flex; flex-direction:column;
    cursor:pointer; text-decoration:none; color:inherit; user-select:none;
  }
  .carte:hover { background:var(--carte-survol); }
  .carte .tete { height:52px; display:flex; align-items:center; gap:12px; padding:0 0 0 8px; }
  .carte .tete img.fav { width:20px; height:20px; border-radius:4px; }
  .carte .titre { flex:1; min-width:0; font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .points {
    width:36px; height:36px; border:0; border-radius:50%; background:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:var(--gris);
  }
  .points:hover { background:rgba(68,71,70,.12); }
  .apercu { position:relative; aspect-ratio:4 / 3; background:#fff; border-radius:8px; overflow:hidden; }
  .apercu img { width:100%; height:100%; object-fit:cover; object-position:top; display:block; }
  /* zoom sur la page du document : largeur et décalages posés en % de la largeur de la vignette */
  .apercu img.zoom { position:absolute; left:0; top:0; height:auto; max-width:none; object-fit:fill; }
  .apercu .attente {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; color:var(--gris-clair); text-align:center; padding:8px;
  }
  .carte .lieu { display:none; }

  /* Vue liste */
  .liste .grille { display:flex; flex-direction:column; gap:0; }
  .liste .dossier, .liste .carte {
    background:none; border-radius:0; height:48px; padding:0 8px; border-bottom:1px solid #e3e3e3; flex-direction:row; align-items:center;
  }
  .liste .dossier:hover, .liste .carte:hover { background:var(--survol); }
  .liste .carte .tete { flex:1; height:auto; padding:0; min-width:0; }
  .liste .carte .titre { font-weight:400; }
  .liste .carte .lieu { display:block; width:34%; font-size:13px; color:var(--gris); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 12px; }
  .liste .apercu { display:none; }

  .vide {
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    padding:56px 16px; color:var(--gris); font-size:15px; text-align:center;
  }
  .vide { padding-top:72px; }
  .vide strong { font-size:28px; font-weight:400; color:var(--texte); margin-top:16px; }
  .vide span { font-size:16px; }

  /* Menu contextuel */
  .menu {
    position:fixed; z-index:10; min-width:220px; padding:8px 0; background:#fff; border-radius:4px;
    box-shadow:0 2px 6px 2px rgba(60,64,67,.15), 0 1px 2px rgba(60,64,67,.3); display:none;
  }
  .menu.ouvert { display:block; }
  .menu button { display:flex; align-items:center; gap:16px; width:100%; height:36px; padding:0 16px; border:0; background:none; text-align:left; font-size:14px; cursor:pointer; }
  .menu button:hover { background:#f1f3f4; }
  .menu hr { border:0; border-top:1px solid #e3e3e3; margin:8px 0; }
  .menu .raccourci { margin-left:auto; padding-left:40px; font-size:13px; color:var(--gris); }
  #menu-nouveau { min-width:320px; border-radius:8px; }
  #menu-nouveau button { height:48px; font-size:15px; }
  .dossier .points { margin-right:-10px; }

  /* Fenêtres de dialogue */
  .scrim { position:fixed; inset:0; z-index:20; background:rgba(32,33,36,.45); display:none; align-items:center; justify-content:center; }
  .scrim.ouvert { display:flex; }
  .dialogue {
    width:min(440px, calc(100vw - 32px)); background:#fff; border-radius:28px; padding:24px;
    box-shadow:0 4px 8px 3px rgba(60,64,67,.15), 0 1px 3px rgba(60,64,67,.3);
  }
  .dialogue h2 { margin:0 0 16px; font-size:24px; font-weight:400; }
  .dialogue .info { margin:0 0 16px; font-size:14px; line-height:20px; color:var(--gris); }
  .dialogue input[type=text] {
    width:100%; height:48px; padding:0 14px; border:1px solid var(--gris-clair); border-radius:4px;
    font:inherit; font-size:16px; color:var(--texte);
  }
  .dialogue input[type=text]:focus { outline:2px solid var(--bleu); outline-offset:-1px; border-color:transparent; }
  .dialogue .choix { max-height:50vh; overflow-y:auto; border:1px solid #e3e3e3; border-radius:8px; padding:4px 0; }
  .dialogue .ligne { display:flex; align-items:center; gap:10px; padding:8px 12px; font-size:14px; cursor:pointer; }
  .dialogue .ligne:hover { background:var(--survol); }
  .dialogue .ligne .nb { margin-left:auto; font-size:12px; color:var(--gris-clair); }
  .dialogue .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:24px; }
  .dialogue .actions button {
    height:40px; padding:0 16px; border:0; border-radius:20px; background:none;
    color:var(--bleu); font-weight:500; font-size:14px; cursor:pointer;
  }
  .dialogue .actions button:hover { background:#edf2fc; }
</style>
</head>
<body>

<header class="entete">
  <div class="logo">
    <svg width="34" height="34" viewBox="0 0 24 24"><path fill="#92CDE2" stroke="rgba(0,0,0,.35)" stroke-width=".8" d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/><path fill="#1f1f1f" d="M10.6 14.4a2.4 2.4 0 0 1 0-3.4l1.6-1.6a2.4 2.4 0 0 1 3.4 3.4l-.8.8-1-1 .8-.8a1 1 0 0 0-1.4-1.4l-1.6 1.6a1 1 0 0 0 0 1.4z"/><path fill="#1f1f1f" d="M13.4 11.6a2.4 2.4 0 0 1 0 3.4l-1.6 1.6a2.4 2.4 0 0 1-3.4-3.4l.8-.8 1 1-.8.8a1 1 0 0 0 1.4 1.4l1.6-1.6a1 1 0 0 0 0-1.4z"/></svg>
    <span>Maths</span>
  </div>
  <label class="recherche">
    <svg width="22" height="22" viewBox="0 0 24 24"><path fill="#444746" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input id="recherche" type="search" placeholder="Rechercher dans les liens" autocomplete="off">
  </label>
</header>

<div class="corps">
  <nav class="lateral">
    <button class="nouveau" id="btn-nouveau">
      <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#1f1f1f" d="M20 13h-7v7h-2v-7H4v-2h7V4h2v7h7v2z"/></svg>
      Nouveau
    </button>
    <div class="arbre" id="arbre"></div>
    <div class="sep"></div>
    <div class="outils">
      <div class="noeud" id="btn-exporter">
        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#444746" d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67 2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/></svg>
        <span class="nom">Exporter les liens</span>
      </div>
      <input type="file" id="fichier-import" accept=".json,.html,.htm,application/json,text/html" hidden>
    </div>
  </nav>

  <main class="panneau" id="panneau">
    <div class="barre">
      <div class="fil" id="fil"></div>
      <div class="vues">
        <button id="vue-liste" title="Liste"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#1f1f1f" d="M3 5h18v2H3zm0 6h18v2H3zm0 6h18v2H3z"/></svg></button>
        <button id="vue-grille" title="Grille"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#1f1f1f" d="M3 3h8v8H3zm2 2v4h4V5zm8-2h8v8h-8zm2 2v4h4V5zM3 13h8v8H3zm2 2v4h4v-4zm8-2h8v8h-8zm2 2v4h4v-4z"/></svg></button>
      </div>
    </div>
    <div class="contenu" id="contenu"></div>
  </main>
</div>

<div class="menu" id="menu">
  <button data-action="ouvrir"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#444746" d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>Ouvrir dans un nouvel onglet</button>
  <button data-action="renommer"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#444746" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>Renommer</button>
  <button data-action="apercu"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#444746" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>Actualiser l'aperçu</button>
  <hr>
  <button data-action="supprimer"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#444746" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>Supprimer</button>
</div>

<div class="menu" id="menu-nouveau">
  <button data-nouveau="dossier"><svg width="24" height="24" viewBox="0 0 24 24"><path fill="#444746" d="M20 6h-8l-2-2H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm0 12H4V6h5.17l2 2H20v10zm-8-4h2v2h2v-2h2v-2h-2v-2h-2v2h-2z"/></svg>Nouveau dossier<span class="raccourci" data-touche="F"></span></button>
  <hr>
  <button data-nouveau="fichier"><svg width="24" height="24" viewBox="0 0 24 24"><path fill="#444746" d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11zM8 15.01l1.41 1.41L11 14.84V19h2v-4.16l1.59 1.59L16 15.01 12.01 11z"/></svg>Importer un fichier<span class="raccourci" data-touche="U"></span></button>
  <button data-nouveau="import-dossier"><svg width="24" height="24" viewBox="0 0 24 24"><path fill="#444746" d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V6h5.17l2 2H20v10zM9.41 14.42 11 12.84V17h2v-4.16l1.59 1.59L16 13.01 12.01 9 8 13.01l1.41 1.41z"/></svg>Importer un dossier<span class="raccourci" data-touche="I"></span></button>
</div>

<div class="menu" id="menu-dossier">
  <button data-action-dossier="renommer"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#444746" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>Renommer</button>
  <hr>
  <button data-action-dossier="supprimer"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#444746" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>Supprimer</button>
</div>

<div class="scrim" id="scrim"><div class="dialogue" id="dialogue"></div></div>

<script>
// ═══ DOSSIERS : domaines et sous-domaines EVA ═══════════════════════════
// Les libellés se modifient ici ; les liens sont rattachés à l'identifiant.
const DOMAINES = [
  { id:'nombres', nom:'Nombres et opérations', couleur:'#92CDE2', sous:[
    "Résoudre un problème « concret »",
    "Calculer avec des nombres décimaux (4 opérations)",
    "Calculer avec des nombres relatifs (4 opérations)",
    "Calculer avec des nombres rationnels (4 opérations)",
    "Calculer des puissances",
    "Calculer des racines",
    "Appliquer la hiérarchie des opérations",
    "Lire la valeur d'un nombre sur une droite graduée",
    "Estimer le résultat d'un calcul" ]},
  { id:'proportionnalite', nom:'Proportionnalité', couleur:'#F4AFC0', sous:[
    "Calculer une fraction ou un pourcentage de…",
    "Retrouver une grandeur dont on connaît un pourcentage",
    "Poser une proportion et la résoudre",
    "Résoudre un problème concret de proportionnalité" ]},
  { id:'algebre', nom:'Algèbre', couleur:'#F7DB7F', sous:[
    "Vérifier si un nombre est solution d'une équation",
    "Développer et réduire une expression algébrique",
    "Factoriser une expression algébrique",
    "Traduire un problème en langage algébrique",
    "Résoudre une équation",
    "Résoudre un problème à l'aide d'une équation" ]},
  { id:'grandeurs', nom:'Grandeurs et mesures · Pythagore', couleur:'#BCE29A', sous:[
    "Utiliser les formules de calcul de périmètres et d'aires",
    "Utiliser les formules de calcul de volumes",
    "Transformer les unités (longueur, aire, volume, capacité et temps)",
    "Utiliser le théorème de Pythagore" ]},
  { id:'espace', nom:'Espace', couleur:'#D4D4D4', sous:[
    "Connaître le vocabulaire relatif aux figures planes et aux solides",
    "Appliquer les propriétés des figures planes (triangles, cercles)",
    "Connaître l'utilisation des instruments de géométrie",
    "Identifier les développements de solides",
    "Repérer un point dans un système d'axes orthonormés",
    "Identifier les axes et le centre de symétrie d'une figure plane" ]}
];
const RACINE = 'racine';

const COULEUR_PERSO = '#FFFFFF';   // dossier créé directement dans « Mes liens »

// Index des dossiers : id → { nom, couleur, parent, fixe }
// Un dossier créé par l'utilisateur prend la couleur du domaine qui le contient.
let DOSSIERS = {};
function indexer() {
  DOSSIERS = { [RACINE]: { nom:'Mes liens', couleur:'#444746', parent:null, fixe:true } };
  DOMAINES.forEach(d => {
    DOSSIERS[d.id] = { nom:d.nom, couleur:d.couleur, parent:RACINE, fixe:true };
    d.sous.forEach((nom, i) => { DOSSIERS[d.id + '/' + (i + 1)] = { nom, couleur:d.couleur, parent:d.id, fixe:true }; });
  });
  let reste = etat.dossiers.slice(), avance = true;
  while (reste.length && avance) {
    avance = false;
    reste = reste.filter(d => {
      const p = DOSSIERS[d.parent];
      if (!p) return true;
      DOSSIERS[d.id] = { nom:d.nom, parent:d.parent, couleur: d.parent === RACINE ? COULEUR_PERSO : p.couleur, fixe:false };
      avance = true; return false;
    });
  }
  reste.forEach(d => { d.parent = RACINE; DOSSIERS[d.id] = { nom:d.nom, parent:RACINE, couleur:COULEUR_PERSO, fixe:false }; });
}
function enfants(id) {
  const d = DOMAINES.find(x => x.id === id);
  const fixes = id === RACINE ? DOMAINES.map(x => x.id) : d ? d.sous.map((_, i) => d.id + '/' + (i + 1)) : [];
  return fixes.concat(etat.dossiers.filter(x => x.parent === id).map(x => x.id));
}
function descendants(id) { return [id].concat(...enfants(id).map(descendants)); }

// Capture du haut de la page avec une fenêtre de 900 px de large : une page de document
// (fiche A4, PDF ouvert dans le navigateur) occupe ainsi toute la largeur de la vignette,
// au lieu d'apparaître en petit au milieu d'un écran large.
const CAPTURE = 'vpw=900&vph=1500&w=720&h=1200';
function urlCapture(url, extra) {
  return 'https://s0.wp.com/mshots/v1/' + encodeURIComponent(url) + '?' + CAPTURE + (extra ? '&' + extra : '');
}

function creerCarte(lien) {

  chargerApercu(a.querySelector('.apercu'), lien.url, false);
  return a;
}

// Zoom sur la page : on repère, dans la capture, la feuille blanche du document (sa largeur et son haut),
// et on agrandit l'image pour que cette largeur remplisse la vignette. Il faut pour cela lire les pixels,
// ce que le navigateur n'autorise que si le service de captures le permet ; sinon l'image reste telle quelle.
function cadrerSurPage(img) {
  const essai = new Image();
  essai.crossOrigin = 'anonymous';
  essai.onload = () => {
    try {
      const W = essai.naturalWidth, H = essai.naturalHeight;
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      const cx = cv.getContext('2d'); cx.drawImage(essai, 0, 0);
      const px = cx.getImageData(0, 0, W, H).data;
      const blanc = (x, y) => { const i = (y * W + x) * 4; return px[i] > 242 && px[i + 1] > 242 && px[i + 2] > 242; };
      // plus long segment blanc sur quelques lignes du haut de la capture
      const g = [], d = [];
      for (let y = Math.round(H * 0.08); y < H * 0.35; y += Math.round(H * 0.03)) {
        let meilleur = [0, 0], debut = -1;
        for (let x = 0; x <= W; x++) {
          if (x < W && blanc(x, y)) { if (debut < 0) debut = x; }
          else if (debut >= 0) { if (x - debut > meilleur[1] - meilleur[0]) meilleur = [debut, x]; debut = -1; }
        }
        g.push(meilleur[0]); d.push(meilleur[1]);
      }
      const med = a => a.sort((p, q) => p - q)[a.length >> 1];
      const gauche = med(g), droite = med(d), large = droite - gauche;
      if (large < W * 0.35 || large > W * 0.92) return;          // pas de feuille distincte : on ne touche à rien
      // haut de la feuille : première ligne blanche sur toute sa largeur
      let haut = 0;
      for (let y = 0; y < H * 0.5; y++) {
        let ok = true;
        for (let x = gauche + 3; x < droite - 3; x += 6) if (!blanc(x, y)) { ok = false; break; }
        if (ok) { haut = y; break; }
      }
      img.classList.add('zoom');
      img.style.width = (W / large * 100) + '%';
      img.style.marginLeft = (-gauche / large * 100) + '%';
      img.style.marginTop = (-haut / large * 100) + '%';
    } catch (e) {}
  };
  essai.src = img.src;
}

// relancer = true : on demande au service de refaire la capture (requeue), puis on attend qu'elle soit prête.
function chargerApercu(apercu, url, relancer) {
  const img = apercu.querySelector('img');
  const attente = apercu.querySelector('.attente');
  const jeton = Date.now().toString(36);   // contourne le cache du navigateur pendant l'attente
  let attentes = 0, erreurs = 0;
  img.classList.remove('zoom'); img.removeAttribute('style');
  img.style.visibility = 'hidden';
  attente.style.display = 'flex'; attente.textContent = 'Capture en cours…';
  const suivant = () => setTimeout(() => { img.src = urlCapture(url, 't=' + jeton + '-' + (attentes + erreurs)); }, 3000);
  img.onload = () => {
    // le service renvoie d'abord une image provisoire de 400×300 pendant la capture
    if (img.naturalWidth === 400 && img.naturalHeight === 300) {
      if (++attentes < 15) suivant(); else attente.textContent = 'Aperçu indisponible';
    } else { img.style.visibility = 'visible'; attente.style.display = 'none'; cadrerSurPage(img); }
  };
  // une erreur passagère du service ne doit pas être définitive : quelques nouvelles tentatives
  img.onerror = () => { if (++erreurs < 5) suivant(); else attente.textContent = 'Aperçu indisponible'; };
  img.src = urlCapture(url, relancer ? 'requeue=true&t=' + jeton : '');
}

// ═══ AJOUT, DÉPLACEMENT ══════════════════════════════════════════════════
function lireDepot(dt) {
  let url = '', titre = '';
  const moz = dt.getData('text/x-moz-url');               // Firefox : URL \n titre
  if (moz) { [url, titre] = moz.split('\n'); }
  if (!url) {
    const liste = dt.getData('text/uri-list');
    url = (liste.split(/\r?\n/).find(l => l && !l.startsWith('#')) || '').trim();
  }
  if (!url) url = dt.getData('text/plain').trim();
  if (!titre) {                                          // Chrome / Edge : lien <a> dans text/html
    const html = dt.getData('text/html');
    if (html) {
      const d = new DOMParser().parseFromString(html, 'text/html');
      const lienA = d.querySelector('a');
      titre = (lienA ? lienA.textContent : d.body.textContent).trim();
    }
  }
  url = (url || '').trim();
  if (!/^https?:\/\//i.test(url)) return null;
  titre = (titre || '').trim();
  if (!titre || titre === url) titre = domaineDe(url);
  return { url, titre };
}

function ajouter(lien, dossier) {
  etat.liens.push({ id:nouvelId(), url:lien.url, titre:lien.titre, dossier });
  sauver(); render();
}
function deplacer(idLien, dossier) {
  const l = etat.liens.find(x => x.id === idLien);
  if (l && l.dossier !== dossier) { l.dossier = dossier; sauver(); render(); }
}

const TYPE_INTERNE = 'application/x-lien-eva';
let lienTraine = null;

document.addEventListener('dragstart', e => {
  const c = e.target.closest && e.target.closest('.carte');
  if (!c) return;
  lienTraine = c.dataset.lien;
  e.dataTransfer.setData(TYPE_INTERNE, lienTraine);
  e.dataTransfer.effectAllowed = 'move';
});
document.addEventListener('dragend', () => { lienTraine = null; nettoyerCibles(); });

function cibleSous(e) {
  const d = e.target.closest && e.target.closest('[data-dossier]');
  if (d) return { el:d, dossier:d.dataset.dossier };
  if (panneau.contains(e.target) && !filtre) return { el:panneau, dossier:courant };
  return null;
}
function nettoyerCibles() { document.querySelectorAll('.cible').forEach(x => x.classList.remove('cible')); }

document.addEventListener('dragover', e => {
  e.preventDefault();
  const c = cibleSous(e);
  nettoyerCibles();
  if (!c || (lienTraine && c.el === panneau)) { e.dataTransfer.dropEffect = 'none'; return; }
  e.dataTransfer.dropEffect = lienTraine ? 'move' : 'copy';
  c.el.classList.add('cible');
});
document.addEventListener('dragleave', e => { if (!e.relatedTarget) nettoyerCibles(); });
document.addEventListener('drop', e => {
  e.preventDefault(); nettoyerCibles();
  const c = cibleSous(e);
  if (!c) return;
  const interne = lienTraine || e.dataTransfer.getData(TYPE_INTERNE);
  if (interne) { if (c.el !== panneau) deplacer(interne, c.dossier); lienTraine = null; return; }
  const lien = lireDepot(e.dataTransfer);
  if (lien) ajouter(lien, c.dossier);
});

const MAC = /Mac|iPhone|iPad/i.test(navigator.platform || navigator.userAgent);

let arme = 0;
document.addEventListener('keydown', e => {
  if (scrim.classList.contains('ouvert')) { if (e.key === 'Escape' && finDialogue) finDialogue(null); return; }
  if (e.key === 'Escape') { fermerMenus(); return; }
  if (e.target.matches && e.target.matches('input, textarea')) return;
  if (e.code === 'KeyC' && (MAC ? e.ctrlKey && !e.metaKey && !e.altKey : e.altKey && !e.ctrlKey && !e.metaKey)) {
    arme = Date.now(); e.preventDefault(); return;
  }
  if (arme && Date.now() - arme < 2000) {

const scrim = document.getElementById('scrim');
const dialogue = document.getElementById('dialogue');
let finDialogue = null;
function ouvrirDialogue(html, valider) {
  return new Promise(res => {
    dialogue.innerHTML = html + `<div class="actions"><button data-r="non">Annuler</button><button data-r="oui">${dialogue.dataset.ok || 'OK'}</button></div>`;
    scrim.classList.add('ouvert');
    finDialogue = v => { finDialogue = null; scrim.classList.remove('ouvert'); dialogue.innerHTML = ''; res(v); };
    dialogue.querySelector('[data-r=non]').onclick = () => finDialogue(null);
    dialogue.querySelector('[data-r=oui]').onclick = () => finDialogue(valider());
  });
}
scrim.addEventListener('mousedown', e => { if (e.target === scrim && finDialogue) finDialogue(null); });
function demanderNom(titre, valeur, ok) {
  dialogue.dataset.ok = ok;
  const p = ouvrirDialogue(`<h2>${esc(titre)}</h2><input type="text" id="dlg-champ" value="${esc(valeur)}" autocomplete="off">`,
    () => document.getElementById('dlg-champ').value.trim() || null);
  const champ = document.getElementById('dlg-champ');
  champ.focus(); champ.select();
  champ.addEventListener('keydown', e => { if (e.key === 'Enter') finDialogue(champ.value.trim() || null); });
  return p;
}

async function nouveauDossier() {

}
const menuDossier = document.getElementById('menu-dossier');
let dossierMenu = null;
menuDossier.addEventListener('click', async e => {
  const b = e.target.closest('[data-action-dossier]');
  if (!b) return;
  fermerMenus();
  const d = etat.dossiers.find(x => x.id === dossierMenu);
  if (!d) return;
  if (b.dataset.actionDossier === 'renommer') {
    const nom = await demanderNom('Renommer', d.nom, 'OK');
    if (nom) { d.nom = nom; indexer(); sauver(); render(); }
  } else {
    const ids = new Set(descendants(d.id));
    const n = etat.liens.filter(l => ids.has(l.dossier)).length;
    if (!confirm('Supprimer le dossier « ' + d.nom + ' »' + (n ? ' et ' + (n > 1 ? 'ses ' + n + ' liens' : 'son lien') : '') + ' ?')) return;
    etat.dossiers = etat.dossiers.filter(x => !ids.has(x.id));
    etat.liens = etat.liens.filter(l => !ids.has(l.dossier));
    if (ids.has(courant)) courant = d.parent;
    indexer(); sauver(); render();
  }
});

// ═══ MENU ⋮ ══════════════════════════════════════════════════════════════
const menu = document.getElementById('menu');
let lienMenu = null;
function fermerMenus() { document.querySelectorAll('.menu.ouvert').forEach(m => m.classList.remove('ouvert')); }
function ouvrirMenu(m, bouton, recouvrir) {
  fermerMenus();
  m.classList.add('ouvert');
  const r = bouton.getBoundingClientRect();
  const l = Math.min(r.left, innerWidth - m.offsetWidth - 8);
  let t = recouvrir ? r.top : r.bottom;
  if (t + m.offsetHeight > innerHeight - 8) t = r.top - m.offsetHeight;
  m.style.left = l + 'px'; m.style.top = Math.max(8, t) + 'px';
}
document.addEventListener('click', e => { if (!e.target.closest('.menu')) fermerMenus(); });
menu.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  menu.classList.remove('ouvert');
  const l = etat.liens.find(x => x.id === lienMenu);
  if (!l) return;
  switch (b.dataset.action) {
    case 'ouvrir': window.open(l.url, '_blank', 'noopener'); break;
    case 'renommer':
      demanderNom('Renommer', l.titre, 'OK').then(t => { if (t) { l.titre = t; sauver(); render(); } });
      break;
    case 'apercu': {
      const ap = document.querySelector(`.carte[data-lien="${l.id}"] .apercu`);
      if (ap) chargerApercu(ap, l.url, true);
      break;
    }
    case 'supprimer':
      if (confirm('Supprimer « ' + l.titre + ' » ?')) { etat.liens = etat.liens.filter(x => x !== l); sauver(); render(); }
      break;
  }
});

// ═══ EXPORT / IMPORT ═════════════════════════════════════════════════════
document.getElementById('btn-exporter').onclick = () => {
  const data = JSON.stringify({ format:'liens-eva', version:2,
    dossiers:etat.dossiers.map(({ id, nom, parent }) => ({ id, nom, parent })),
    liens:etat.liens.map(({ url, titre, dossier }) => ({ url, titre, dossier })) }, null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type:'application/json' }));
  a.download = 'liens_eva.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
const fichierImport = document.getElementById('fichier-import');
// Un seul sélecteur de fichier : un export de cette page (.json) ou des marque-pages exportés du navigateur (.html)
fichierImport.onchange = async () => {
  const f = fichierImport.files[0]; fichierImport.value = '';
  if (!f) return;
  const texte = await f.text();
  if (/^\s*[\[{]/.test(texte)) importerJson(texte);
  else importerMarquePages(texte);
};
const pluriel = (n, mot) => n + ' ' + mot + (n > 1 ? 's' : '');

function importerJson(texte) {
  try {
    const d = JSON.parse(texte);
    const liste = Array.isArray(d) ? d : (d.liens || []);
    let nd = 0, n = 0;
    (Array.isArray(d) ? [] : (d.dossiers || [])).forEach(x => {
      if (!x || !x.id || !x.nom || DOSSIERS[x.id]) return;
      etat.dossiers.push({ id:String(x.id), nom:String(x.nom), parent:x.parent || RACINE }); nd++;
    });
    indexer();
    liste.forEach(l => {
      if (!l || !/^https?:\/\//i.test(l.url)) return;
      const dossier = DOSSIERS[l.dossier] ? l.dossier : RACINE;
      if (etat.liens.some(x => x.url === l.url && x.dossier === dossier)) return;
      etat.liens.push({ id:nouvelId(), url:l.url, titre:l.titre || domaineDe(l.url), dossier }); n++;
    });
    sauver(); render();
    alert(pluriel(n, 'lien') + ' et ' + pluriel(nd, 'dossier') + ' importés.');
  } catch (e) { alert('Ce fichier ne peut pas être lu.'); }
}

// ── Import d'un dossier de marque-pages (fichier HTML exporté par Firefox, Chrome, Edge ou Safari)
async function aideImportDossier() {
  dialogue.dataset.ok = 'Choisir le fichier';
  const ok = await ouvrirDialogue(`<h2>Importer un dossier</h2>
    <p class="info">Le navigateur ne laisse pas glisser un dossier entier de marque-pages. Exportez d'abord vos marque-pages au format HTML :</p>
    <p class="info"><b>Firefox</b> : Marque-pages › Gérer les marque-pages › Importation et sauvegarde › Exporter des marque-pages au format HTML.<br>
    <b>Chrome</b> : Favoris › Gestionnaire de favoris › ⋮ › Exporter les favoris.</p>
    <p class="info">Choisissez ensuite ce fichier : vous pourrez sélectionner le dossier à reprendre dans « ${esc(DOSSIERS[courant].nom)} ».</p>`, () => true);
  if (ok) fichierImport.click();
}
function lireDL(dl, nom) {
  const n = { nom, liens:[], dossiers:[] };
  for (const dt of dl.children) {
    if (dt.tagName !== 'DT') continue;
    const h3 = dt.querySelector(':scope > h3');
    if (h3) {
      let sous = dt.querySelector(':scope > dl');
      if (!sous && dt.nextElementSibling && dt.nextElementSibling.tagName === 'DL') sous = dt.nextElementSibling;
      const nomSous = h3.textContent.trim() || 'Sans titre';
      n.dossiers.push(sous ? lireDL(sous, nomSous) : { nom:nomSous, liens:[], dossiers:[] });
      continue;
    }
    const a = dt.querySelector(':scope > a');
    const url = a ? (a.getAttribute('href') || '').trim() : '';
    if (/^https?:\/\//i.test(url)) n.liens.push({ url, titre:a.textContent.trim() || domaineDe(url) });
  }
  return n;
}
const totalMP = n => n.liens.length + n.dossiers.reduce((s, x) => s + totalMP(x), 0);
async function importerMarquePages(texte) {
  const doc = new DOMParser().parseFromString(texte, 'text/html');
  const dl = doc.querySelector('dl');
  const racineMP = dl && lireDL(dl, 'Tous les marque-pages');
  if (!racineMP || !totalMP(racineMP)) { alert('Aucun marque-page trouvé dans ce fichier.'); return; }
  const plats = [];
  (function parcourir(n, prof) { if (totalMP(n)) { plats.push({ n, prof }); n.dossiers.forEach(x => parcourir(x, prof + 1)); } })(racineMP, 0);
  const defaut = plats.length > 1 ? 1 : 0;
  dialogue.dataset.ok = 'Importer';
  const choix = await ouvrirDialogue(`<h2>Importer un dossier</h2>
    <p class="info">Dossier à importer dans « ${esc(DOSSIERS[courant].nom)} » (ses sous-dossiers sont repris) :</p>
    <div class="choix">${plats.map((p, i) => `<label class="ligne" style="padding-left:${12 + p.prof * 20}px">
      <input type="radio" name="dlg-mp" value="${i}" ${i === defaut ? 'checked' : ''}>${iconeDossier('#ffffff', 18)}
      <span>${esc(p.n.nom)}</span><span class="nb">${totalMP(p.n)}</span></label>`).join('')}</div>`,
    () => { const r = dialogue.querySelector('input[name=dlg-mp]:checked'); return r ? plats[+r.value].n : null; });
  if (!choix) return;
  (function creer(n, parent) {
    const id = 'p' + nouvelId();
    etat.dossiers.push({ id, nom:n.nom, parent });
    n.liens.forEach(l => etat.liens.push({ id:nouvelId(), url:l.url, titre:l.titre, dossier:id }));
    n.dossiers.filter(x => totalMP(x)).forEach(x => creer(x, id));
  })(choix, courant);
  if (courant !== RACINE && !etat.ouverts.includes(courant)) etat.ouverts.push(courant);
  indexer(); sauver(); render();
}

render();
</script>
