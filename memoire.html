<!doctype html>
<!--
  Note pour Claude : « Mémoire visuelle » (fichier autonome, images intégrées en WebP base64).
  Même coquille que quiz_triangle.html : plateau 900x560 mis à l'échelle de la fenêtre, bouton plein écran dans le cadre.
  Étapes : accueil (consigne) -> observation (20 objets mélangés, DUREE s, décompte) -> consigne
  d'écriture (sans son) -> correction (objets avec leur nom). Aucune connexion : écran de classe seul.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mémoire visuelle</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231f4fa8'/><path d='M4 16s4.5-8 12-8 12 8 12 8-4.5 8-12 8S4 16 4 16z' fill='%23fff'/><circle cx='16' cy='16' r='4.5' fill='%231f4fa8'/><circle cx='17.5' cy='14.5' r='1.4' fill='%23fff'/></svg>">
<style>
:root{--papier:#f5f5f1;--encre:#151a2e;--gris:#6d7382;--trait:#d9dbe1;--bleu-fonce:#1f4fa8;--rouge:#c0392b}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--papier);color:var(--encre);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:16px;padding:10px;height:100vh;overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;font-weight:700;font-size:15px;padding:10px 16px;border-radius:9px;cursor:pointer;border:1px solid #b9bec9;background:#fff;color:var(--encre);display:inline-flex;align-items:center;gap:8px}
button:focus-visible{outline:2px solid var(--bleu-fonce);outline-offset:2px}
button.primaire{background:var(--bleu-fonce);border-color:var(--bleu-fonce);color:#fff}
button svg{width:19px;height:19px;flex:none}
.scene{height:100%;display:flex;justify-content:center;align-items:center}
.boite{position:relative}
.plateau{position:absolute;left:0;top:0;width:900px;height:560px;transform-origin:top left}
.feuille{position:absolute;inset:0;background:#fff;border:1px solid var(--trait);border-radius:12px;overflow:hidden}
.ecran{position:absolute;inset:0}
.plein{position:absolute;right:14px;top:14px;z-index:30;width:34px;height:34px;padding:0;justify-content:center}
.plein .sortir{display:none}
body.pleinecran .plein .entrer{display:none}
body.pleinecran .plein .sortir{display:block}
.version{position:absolute;right:14px;bottom:8px;font-size:11px;color:#a3a8b3;letter-spacing:.06em;z-index:9}
.eyebrow{margin:0;font-size:14px;font-weight:700;letter-spacing:.16em;color:var(--gris);text-transform:uppercase}

/* accueil et fin */
.centre{position:absolute;left:90px;right:90px;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
.centre h1{margin:0;font-size:38px;line-height:1.25}
.centre .consigne{margin:0;font-size:30px;font-weight:700;line-height:1.35}
.centre .consigne b{color:var(--bleu-fonce)}
.centre .boutons{display:flex;gap:12px;margin-top:10px}
.centre .grosbouton{font-size:20px;padding:14px 26px}

/* observation */
.bandeau{position:absolute;left:28px;right:64px;top:16px;display:flex;align-items:center;gap:22px}
.bandeau .txt{flex:1;font-size:17px;font-weight:700;line-height:1.3}
.chrono{flex:none;width:118px;text-align:right}
.chrono .t{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.chrono .barre{height:7px;border-radius:4px;background:#e6e8ee;overflow:hidden;margin-top:6px}
.chrono .barre div{height:100%;width:100%;background:var(--bleu-fonce)}
.grille{position:absolute;left:24px;right:24px;top:84px;bottom:58px;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);grid-auto-flow:column;gap:4px 10px}
.objet{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.objet img{max-width:100%;max-height:100%;min-height:0;flex:1;object-fit:contain;mix-blend-mode:multiply}
.objet .nom{font-size:14px;font-weight:700;line-height:1.1;margin-top:2px;white-space:nowrap}
.grille.apparait .objet{animation:entree .5s cubic-bezier(.2,.8,.3,1) both}
@keyframes entree{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.outils{position:absolute;left:24px;bottom:12px;display:flex;gap:10px}
.outils button{width:40px;height:40px;padding:0;justify-content:center}
#btn-pause .lecture{display:none}
.enpause #btn-pause .pause{display:none}
.enpause #btn-pause .lecture{display:block}
.voile{position:absolute;left:24px;right:24px;top:84px;bottom:58px;display:flex;align-items:center;justify-content:center;background:rgba(253,253,251,.94);font-size:34px;font-weight:800;color:var(--gris)}
.bas{position:absolute;right:28px;bottom:12px;display:flex;gap:10px}
#grille-corr{top:62px;bottom:66px}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="boite" id="boite">
    <div class="plateau" id="stage">
      <div class="feuille">

        <!-- 1. accueil -->
        <div class="ecran" id="e-accueil">
          <div class="centre">
            <p class="eyebrow">Mémoire visuelle</p>
            <p class="consigne" id="consigne-accueil"></p>
            <div class="boutons">
              <button class="primaire grosbouton" id="btn-go">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg>Démarrer
              </button>
            </div>
          </div>
        </div>

        <!-- 2. observation -->
        <div class="ecran" id="e-obs" hidden>
          <div class="bandeau">
            <div class="txt" id="consigne-obs"></div>
            <div class="chrono" id="chrono"><div class="t" id="temps">2:00</div><div class="barre"><div id="barre"></div></div></div>
          </div>
          <div class="grille" id="grille"></div>
          <div class="voile" id="voile" hidden>En pause</div>
          <div class="outils">
            <button id="btn-pause" title="Pause / reprise (Espace)" aria-label="Pause ou reprise">
              <svg class="pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M9 6v12"/><path d="M15 6v12"/></svg>
              <svg class="lecture" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg>
            </button>
            <button id="btn-fin" title="Terminer maintenant" aria-label="Terminer maintenant">
              <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
          </div>
        </div>

        <!-- 3. signal : écrire -->
        <div class="ecran" id="e-fin" hidden>
          <div class="centre">
            <p class="consigne">Écrivez sur une feuille le nom de <b>tous les objets</b> dont vous vous souvenez.</p>
            <div class="boutons">
              <button id="btn-recommencer1">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.6h-4.6"/></svg>Recommencer
              </button>
              <button class="primaire" id="btn-correction">Afficher la correction</button>
            </div>
          </div>
        </div>

        <!-- 4. correction -->
        <div class="ecran" id="e-corr" hidden>
          <div class="bandeau"><div class="txt">Correction : les 20 objets</div></div>
          <div class="grille" id="grille-corr"></div>
          <div class="bas">
            <button id="btn-recommencer2">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.6h-4.6"/></svg>Recommencer
            </button>
          </div>
        </div>

        <button id="btn-plein" class="plein" title="Plein écran" aria-label="Plein écran">
          <svg class="entrer" viewBox="0 0 24 24" fill="none" stroke="#151a2e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 3H5.5A2.5 2.5 0 0 0 3 5.5V9"/><path d="M15 3h3.5A2.5 2.5 0 0 1 21 5.5V9"/>
            <path d="M9 21H5.5A2.5 2.5 0 0 1 3 18.5V15"/><path d="M15 21h3.5a2.5 2.5 0 0 0 2.5-2.5V15"/>
          </svg>
          <svg class="sortir" viewBox="0 0 24 24" fill="none" stroke="#151a2e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.5 9H9V3.5"/><path d="M20.5 9H15V3.5"/><path d="M3.5 15H9v5.5"/><path d="M20.5 15H15v5.5"/>
          </svg>
        </button>
        <div class="version">v11</div>
      </div>
    </div>
  </div>
</div>

  let OBJETS = FICHES[0], fiche = -1;
  const $ = id => document.getElementById(id);

  $("consigne-accueil").textContent = CONSIGNE;
  $("consigne-obs").textContent = CONSIGNE;

  /* --- mise à l'échelle et plein écran --- */
  function enPleinEcran(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function ajuster(){
    const dw = $("scene").clientWidth, dh = $("scene").clientHeight;
    if(dw <= 0 || dh <= 0) return;
    const k = Math.min(dw/900, dh/560);
    $("stage").style.transform = "scale(" + k + ")";
    $("boite").style.width = Math.round(900*k) + "px"; $("boite").style.height = Math.round(560*k) + "px";
  }
  window.addEventListener("resize", ajuster);
  $("btn-plein").addEventListener("click", function(){
    const d = document.documentElement;
    if(enPleinEcran()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (d.requestFullscreen || d.webkitRequestFullscreen).call(d);
    this.blur();
  });
  function majPlein(){ document.body.classList.toggle("pleinecran", enPleinEcran()); setTimeout(ajuster, 60); }
  document.addEventListener("fullscreenchange", majPlein);
  document.addEventListener("webkitfullscreenchange", majPlein);

  function montrer(id){ ["e-accueil","e-obs","e-fin","e-corr"].forEach(e => { $(e).hidden = e !== id; }); }

  /* --- grilles --- */
  let ordre = [];
  /* une colonne par famille : l'ordre des colonnes et l'ordre dans chaque colonne changent à chaque partie */
  /* tirage des fiches par cycles : les 3 fiches passent chacune une fois, dans un ordre aléatoire, avant qu'un
     nouveau cycle commence (jamais la même deux fois de suite, y compris d'un cycle au suivant).
     Le cycle est mémorisé dans le navigateur, il continue donc aussi après un rechargement de la page. */
  const brasser = t => { for(let i = t.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i + 1)); [t[i], t[j]] = [t[j], t[i]]; } return t; };
  const CLE = "memoire-visuelle:cycle";
  function lire(){ try{ return JSON.parse(localStorage.getItem(CLE) || "null"); }catch(e){ return null; } }
  function ecrire(v){ try{ localStorage.setItem(CLE, JSON.stringify(v)); }catch(e){} }
  let etat = lire() || {sac:[], dernier:-1};
  function tirerFiche(){
    let sac = (etat.sac || []).filter(f => f >= 0 && f < FICHES.length);
    if(!sac.length){
      sac = brasser(FICHES.map((x, k) => k));
      if(sac.length > 1 && sac[0] === etat.dernier) sac.push(sac.shift());   // pas de répétition entre deux cycles
    }
    fiche = sac.shift(); OBJETS = FICHES[fiche];
    etat = {sac, dernier:fiche}; ecrire(etat);
  }
  function melanger(){
    const fams = brasser([...new Set(OBJETS.map(o => o.fam))]);
    ordre = [].concat(...fams.map(f => brasser(OBJETS.map((o, i) => i).filter(i => OBJETS[i].fam === f))));
  }
  function remplir(grille, avecNoms){
    grille.innerHTML = "";
    ordre.forEach((n, i) => {
      const o = OBJETS[n], d = document.createElement("div");
      d.className = "objet"; d.style.animationDelay = (i*0.04) + "s";
      const im = document.createElement("img"); im.src = o.img; im.alt = avecNoms ? "" : "objet"; d.appendChild(im);
      if(avecNoms){ const s = document.createElement("div"); s.className = "nom"; s.textContent = o.nom; d.appendChild(s); }
      grille.appendChild(d);
    });
    grille.classList.remove("apparait"); void grille.offsetWidth; grille.classList.add("apparait");
  }

  /* --- chronomètre --- */
  let reste = DUREE*1000, dernier = 0, enMarche = false, raf = 0;
  const fmt = ms => { const s = Math.ceil(ms/1000); return Math.floor(s/60) + ":" + String(s % 60).padStart(2, "0"); };
  function majChrono(){
    $("temps").textContent = fmt(Math.max(0, reste));
    $("barre").style.width = (100*Math.max(0, reste)/(DUREE*1000)) + "%";
  }
  function tic(t){
    if(!enMarche) return;
    reste -= t - dernier; dernier = t;
    majChrono();
    if(reste <= 0) terminer(); else raf = requestAnimationFrame(tic);
  }
  function demarrer(){
    tirerFiche(); melanger(); remplir($("grille"), false);
    reste = DUREE*1000; majChrono();
    montrer("e-obs"); pause(false);
  }
  function pause(oui){
    enMarche = !oui; $("e-obs").classList.toggle("enpause", oui); $("voile").hidden = !oui;
    cancelAnimationFrame(raf);
    if(enMarche){ dernier = performance.now(); raf = requestAnimationFrame(tic); }
  }
  function terminer(){
    enMarche = false; cancelAnimationFrame(raf);
    montrer("e-fin");
  }

  $("btn-go").addEventListener("click", demarrer);
  $("btn-pause").addEventListener("click", function(){ pause(enMarche); this.blur(); });
  $("btn-fin").addEventListener("click", terminer);
  $("btn-correction").addEventListener("click", () => { remplir($("grille-corr"), true); montrer("e-corr"); });
  $("btn-recommencer1").addEventListener("click", () => montrer("e-accueil"));
  $("btn-recommencer2").addEventListener("click", () => montrer("e-accueil"));
  document.addEventListener("keydown", e => {
    if(e.key === " " && !$("e-obs").hidden){ e.preventDefault(); pause(enMarche); }
  });

  montrer("e-accueil"); ajuster();
})();
