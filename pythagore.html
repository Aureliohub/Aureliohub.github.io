<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Théorème de Pythagore</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#F7F6F2;--surface:#FFFFFF;--border:#E2E0D8;--text:#1E1D1A;
    --accent:#2D6BE4;--radius:14px;
    --c-purple:#534AB7;--c-purple-l:#a898ee;
  }
  html,body{height:100%;overflow:hidden;}
  body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:.75rem 1.25rem;display:flex;align-items:center;gap:12px;box-shadow:0 1px 8px rgba(0,0,0,.04);flex-shrink:0;}
  .header-icon{width:32px;height:32px;background:#EEF4FF;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .header-title{font-size:16px;font-weight:800;} .header-title span{color:var(--accent);}
  .back-btn{margin-left:auto;display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg);color:var(--muted);font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;text-decoration:none;cursor:pointer;transition:all .18s;white-space:nowrap;flex-shrink:0;}
  .back-btn:hover{background:var(--surface);color:var(--accent);border-color:var(--accent);}
  .back-btn .back-arrow{font-size:14px;line-height:1;}
  main{flex:1;padding:.75rem;display:flex;flex-direction:column;min-height:0;}
  .anim-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  .controls{display:flex;gap:8px;padding:.55rem .9rem;border-bottom:1px solid var(--border);background:#FAFAF8;flex-shrink:0;align-items:center;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:7px 16px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:700;border:1.5px solid;background:transparent;transition:all .18s;user-select:none;font-family:'Nunito',sans-serif;white-space:nowrap;}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  #canvas-wrap{flex:1;position:relative;min-height:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;cursor:default;display:block;touch-action:none;background:var(--bg);}

.pages{flex:1;position:relative;min-height:0;}
.page{display:none;position:absolute;inset:0;flex-direction:column;overflow:hidden;}
.page.active{display:flex;}
#page-ex{overflow-y:auto;}
.tabs{display:flex;gap:4px;background:var(--bg);border-bottom:1px solid var(--border);padding:.4rem .9rem 0;flex-shrink:0;}
.tab{padding:.45rem 1.1rem;border-radius:10px 10px 0 0;font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid transparent;border-bottom:none;color:var(--muted);background:transparent;font-family:'Nunito',sans-serif;transition:all .15s;}
.tab.active{background:var(--surface);border-color:var(--border);color:var(--accent);border-bottom:2px solid var(--surface);margin-bottom:-1px;}
.tab:hover:not(.active){color:var(--text);}
#btn-thm{position:relative;}
#btn-thm .tooltip{display:none;position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);background:#FFFFFF;color:#1E1D1A;border-radius:14px;padding:1rem 1.2rem;width:310px;font-size:13px;font-weight:600;line-height:1.7;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,0.13);border:1px solid #E2E0D8;pointer-events:none;z-index:200;white-space:normal;}
#btn-thm .tooltip::before{content:'';position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:7px solid transparent;border-bottom-color:#E2E0D8;}
#btn-thm .tooltip::after{content:'';position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:-1px;border:7px solid transparent;border-bottom-color:#FFFFFF;}
#btn-thm:hover .tooltip{display:block;}
.formula{font-size:16px;font-weight:800;color:#2D6BE4;margin-top:.6rem;letter-spacing:.03em;}
.ex-inner{max-width:720px;margin:0 auto;padding:.8rem .75rem 3rem;}
.progress-wrap{margin-bottom:1.2rem;}
.progress-label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;display:flex;justify-content:space-between;}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .4s ease;}
.level-sep{margin:1.2rem 0 .5rem;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;border-top:1px solid var(--border);padding-top:.9rem;}
.level-badge{display:inline-flex;align-items:center;font-size:11px;font-weight:800;padding:3px 10px;border-radius:10px;margin-bottom:.5rem;letter-spacing:.04em;text-transform:uppercase;}
.lv1{background:#E3F2FD;color:#1565C0;}.lv2{background:#F3E5F5;color:#6A1B9A;}.lv3{background:#E8F5E9;color:#2E7D32;}.lv4{background:#FFF3E0;color:#E65100;}
.ex-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1rem;margin-bottom:.7rem;}
.ex-card.locked{opacity:.35;pointer-events:none;user-select:none;}
.ex-num{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:.3rem;}
.ex-question{font-size:14px;font-weight:700;line-height:1.5;margin-bottom:0;}.ex-question em{color:var(--accent);font-style:normal;}
.tri-wrap{display:flex;justify-content:center;margin:0;padding:0;}svg.tri{overflow:hidden;display:block;}
.qcm-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.8rem;}
.qcm-btn{padding:.6rem .9rem;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);font-size:13px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;transition:all .15s;text-align:center;}
.qcm-btn:hover:not(:disabled){border-color:var(--accent);background:#EEF4FF;color:var(--accent);}
.qcm-btn.correct{border-color:#2E7D32;background:#E8F5E9;color:#2E7D32;}
.qcm-btn.wrong{border-color:#C62828;background:#FFEBEE;color:#C62828;}
.qcm-btn:disabled{cursor:default;}
.input-row{display:flex;gap:.5rem;align-items:center;margin-bottom:.8rem;margin-top:0;flex-wrap:wrap;}
.num-input{width:100px;padding:.5rem .7rem;border:1.5px solid var(--border);border-radius:10px;font-size:15px;font-weight:700;font-family:'Nunito',sans-serif;background:var(--bg);outline:none;transition:border .15s;}
.num-input:focus{border-color:var(--accent);}.num-input.correct{border-color:#2E7D32;background:#E8F5E9;}.num-input.wrong{border-color:#C62828;background:#FFEBEE;}
.input-label{font-size:13px;font-weight:600;color:var(--muted);}
.check-btn{padding:.5rem 1.1rem;border-radius:10px;background:var(--accent);color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;}
.check-btn:hover{opacity:.85;}.check-btn:disabled{opacity:.35;cursor:default;}
.hint-btn{font-size:12px;font-weight:700;color:var(--muted);border:none;background:none;cursor:pointer;font-family:'Nunito',sans-serif;text-decoration:underline;padding:0;margin-bottom:.2rem;display:block;}
.feedback{border-radius:10px;padding:.65rem .9rem;font-size:13px;font-weight:700;margin-bottom:.6rem;display:none;line-height:1.5;}
.feedback.show{display:block;}.feedback.ok{background:#E8F5E9;color:#2E7D32;border:1px solid #A5D6A7;}.feedback.ko{background:#FFEBEE;color:#C62828;border:1px solid #EF9A9A;}.feedback.hint{background:#FFF3E0;color:#E65100;border:1px solid #FFCC80;}
.detail{font-size:12px;font-weight:600;margin-top:.3rem;opacity:.85;}
.score-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2rem 1.5rem;text-align:center;display:none;margin-top:1rem;}
.score-card.show{display:block;}.score-big{font-size:44px;font-weight:800;color:var(--accent);margin:.5rem 0;}.score-msg{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:1.2rem;}
.restart-btn{padding:.65rem 1.6rem;border-radius:20px;background:var(--accent);color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;}

html,body{height:100%;overflow:hidden;display:flex;flex-direction:column;}

@media (max-width:480px){
  .qcm-grid{grid-template-columns:1fr;}
  .qcm-btn{padding:.5rem .7rem;font-size:12px;}
  .ex-inner{padding:.6rem .6rem 2rem;}
  .controls{padding:.4rem .6rem;gap:6px;}
  .btn{padding:6px 10px;font-size:12px;}
  header{padding:.5rem .8rem;}
  .header-title{font-size:14px;}
  .back-btn{padding:4px 10px;font-size:11px;gap:3px;}
  svg.tri{max-width:100%;height:auto;}
  .num-input{width:80px;font-size:14px;}
  .input-row{gap:.4rem;}
  .tab{padding:.4rem .7rem;font-size:12px;}
}
@media (max-width:360px){
  .qcm-grid{grid-template-columns:1fr;}
  .ex-card{padding:.7rem .7rem;}
  .btn{padding:5px 8px;font-size:11px;}
  /* Sur très petit écran, on masque le texte du bouton retour, on ne garde que la flèche */
  .back-btn{padding:4px 9px;font-size:13px;}
  .back-btn .back-label{display:none;}
}
@media (min-width:900px){
  .ex-inner{padding:1.5rem 2rem 3rem;}
  .ex-card{padding:1.4rem 1.8rem;}
}
</style>
</head>
<body>
<header>
  <div class="header-icon">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <polygon points="2,16 2,3 14,16" fill="#C7D8FA" stroke="#2D6BE4" stroke-width="1.5" stroke-linejoin="round"/>
      <rect x="2" y="12.5" width="3.5" height="3.5" fill="none" stroke="#2D6BE4" stroke-width="1.2"/>
    </svg>
  </div>
  <div class="header-title"><span>Théorème de Pythagore</span></div>
  <a href="index.html" class="back-btn" title="Retour à l'accueil"><span class="back-arrow">←</span><span class="back-label">Retour</span></a>
</header>
<div class="tabs">
  <button class="tab active" onclick="showPage('anim')">📐 Animation</button>
  <button class="tab" onclick="showPage('ex')">✏️ Exercices</button>
</div>
<div class="pages">
  <div class="page active" id="page-anim">
    <div class="controls">
      <button class="btn" id="btn-sq" style="color:var(--c-purple);border-color:var(--c-purple-l);" onclick="toggleSquares()">
        <span class="dot" id="btn-dot" style="background:var(--c-purple);"></span>Carrés des côtés
      </button>
      <button class="btn" id="btn-anim" style="color:var(--accent);border-color:var(--accent);display:none;" onclick="startAnim()">▶ Démontrer</button>
      <button class="btn" id="btn-reset" style="color:#666;border-color:#ccc;display:none;" onclick="resetAnim()">↺ Rejouer</button>
      <button class="btn" id="btn-thm" style="color:var(--accent);border-color:var(--accent);display:none;" onclick="resetAnim()">
        📐 Théorème
        <div class="tooltip" id="thm-tooltip">Dans un triangle rectangle, le carré du grand côté, l'<span style="color:#993C1D;font-weight:800">hypoténuse</span>, est égal à la somme des carrés des côtés de l'angle droit, les <span style="color:#534AB7;font-weight:800">cathètes</span>.<div class="formula">a<sup>2</sup> + b<sup>2</sup> = c<sup>2</sup></div><div id="thm-values" style="margin-top:.4rem;font-size:16px;font-weight:700;"></div></div>
      </button>
    </div>
    <div id="canvas-wrap"><canvas id="c"></canvas></div>
  </div>
  <div class="page" id="page-ex">
    <div class="ex-inner">
      <div class="progress-wrap">
        <div class="progress-label"><span id="prog-label">Exercice 1 sur 11</span><span id="prog-score">0 ✓</span></div>
        <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
      </div>
      <div id="exercises-wrap"></div>
      <div class="score-card" id="score-card">
        <div style="font-size:32px">🎉</div>
        <div class="score-big" id="final-score"></div>
        <div class="score-msg" id="final-msg"></div>
        <button class="restart-btn" onclick="restart()">Recommencer</button>
      </div>
    </div>
  </div>
</div>
<script>
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active',(i===0&&id==='anim')||(i===1&&id==='ex'));
  });
  if(id==='anim') requestAnimationFrame(()=>requestAnimationFrame(resize));
}

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const PX=37.8,R=6;
let CW=600,CH=480,sc=1,panX=0,panY=0,initialized=false;
let showSq=false;

const pu=PX;
let pts=[
  {x:-.5*pu,y:-2.8*pu,label:'A'},
  {x:-3*pu, y:0,       label:'B'},
  {x: 3*pu, y:0,       label:'C'}
];
let drag=null,panning=false,plx=0,ply=0;
let pinch=false,pDist=0,pSc=1,pMx=0,pMy=0,pPx=0,pPy=0,isDrag=false;

const SQC=[
  {f:'rgba(83,74,183,',  s:'rgba(83,74,183,0.35)', t:'#3C3489'},
  {f:'rgba(59,109,17,',  s:'rgba(59,109,17,0.35)', t:'#3B6D11'},
  {f:'rgba(153,60,29,',  s:'rgba(153,60,29,0.35)', t:'#712B13'}
];
const SIDES=[[0,1],[1,2],[2,0]];

// Anim state — no rotation
let phase=0,animT=0,raf=null,t0=null;
let hypIdx=-1,smallIdx=-1,bigIdx=-1;
let nSmall=0,nBig=0; // integer tile counts

function easeInOut(t){return t*t*(3-2*t);}

const GL=[PX/100,PX/10,PX,PX*10,PX*100],GO=[.2,.3,.4,.4,.4],GV=4;

/* ── RESIZE ── */
function resize(){
  const wrap=document.getElementById('canvas-wrap'),dpr=devicePixelRatio||1;
  CW=wrap.clientWidth;CH=wrap.clientHeight;
  canvas.width=CW*dpr;canvas.height=CH*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(!initialized){panX=CW/2;panY=CH/2;sc=1;initialized=true;}
  draw();
}
window.addEventListener('resize',()=>{if(document.getElementById('page-anim').classList.contains('active'))resize();});
requestAnimationFrame(()=>requestAnimationFrame(resize));

/* ── HELPERS ── */
function dist(a,b){return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2);}
function fmt(n,d){let s=n.toFixed(d);if(s.includes('.'))s=s.replace(/\.?0+$/,'');return s;}
function lenLabel(a,b){
  const cm=dist(a,b)/PX;
  const rounded=Math.round(cm);
  if(Math.abs(cm-rounded)<0.05)return rounded+' cm';
  return fmt(cm,2)+' cm';
}
function areaLabel(a,b){
  const cm=dist(a,b)/PX;
  const area=cm*cm;
  const rounded=Math.round(area);
  if(Math.abs(area-rounded)<0.08)return rounded+' cm²';
  return fmt(area,2)+' cm²';
}
function centroid(){return{x:(pts[0].x+pts[1].x+pts[2].x)/3,y:(pts[0].y+pts[1].y+pts[2].y)/3};}
function isRight(o,a,b){
  const oa={x:a.x-o.x,y:a.y-o.y},ob={x:b.x-o.x,y:b.y-o.y};
  const m=Math.sqrt(oa.x**2+oa.y**2)*Math.sqrt(ob.x**2+ob.y**2);
  return m>1&&Math.abs(oa.x*ob.x+oa.y*ob.y)/m<Math.sin(.3*Math.PI/180);
}
function getRightAngle(){
  if(isDrag)return null;
  const[A,B,C]=pts;
  if(isRight(A,B,C))return{vi:0,p1:1,p2:2,hyp:[1,2]};
  if(isRight(B,A,C))return{vi:1,p1:0,p2:2,hyp:[0,2]};
  if(isRight(C,A,B))return{vi:2,p1:0,p2:1,hyp:[0,1]};
  return null;
}

/* ── SNAP ── */
function snapStep(){for(let i=0;i<GL.length;i++)if(GL[i]*sc>=GV)return GL[i];return GL[GL.length-1];}
function snap(wx,wy){const s=snapStep();return{x:Math.round(wx/s)*s,y:Math.round(wy/s)*s};}

/* ── UI BUTTONS ── */
function hypIsInteger(ra){
  if(!ra)return false;
  const[h0,h1]=ra.hyp;
  const lenCm=dist(pts[h0],pts[h1])/PX;
  return Math.abs(lenCm-Math.round(lenCm))<0.05;
}

function updateButtons(){
  const ra=getRightAngle();
  const btnAnim=document.getElementById('btn-anim');
  const btnReset=document.getElementById('btn-reset');
  if(!showSq||!ra||!hypIsInteger(ra)){
    btnAnim.style.display='none';btnReset.style.display='none';return;
  }
  if(phase===0){
    btnAnim.style.display='';btnAnim.disabled=false;
    btnReset.style.display='none';
  } else if(phase>=2&&phase<4){
    btnAnim.style.display='';btnAnim.disabled=true;
    btnReset.style.display='none';
  } else if(phase===4){
    btnAnim.style.display='none';
    btnReset.style.display='';
  }
}

function toggleSquares(){
  showSq=!showSq;
  const btn=document.getElementById('btn-sq'),dot=document.getElementById('btn-dot');
  if(showSq){btn.style.background='var(--c-purple)';btn.style.color='#fff';btn.style.borderColor='var(--c-purple)';dot.style.background='#fff';}
  else{btn.style.background='transparent';btn.style.color='var(--c-purple)';btn.style.borderColor='var(--c-purple-l)';dot.style.background='var(--c-purple)';stopAnim();}
  draw();updateButtons();
}

/* ── ANIMATION ── */
function stopAnim(){
  if(raf){cancelAnimationFrame(raf);raf=null;}
  phase=0;animT=0;
}

function resetAnim(){
  stopAnim();
  draw();updateButtons();
}

function startAnim(){
  if(phase>0)return;
  const ra=getRightAngle();
  if(!ra)return;
  const[h0,h1]=ra.hyp;
  hypIdx=SIDES.findIndex(([i,j])=>(i===h0&&j===h1)||(i===h1&&j===h0));
  const legs=SIDES.map((_,k)=>k).filter(k=>k!==hypIdx);
  const d0=dist(pts[SIDES[legs[0]][0]],pts[SIDES[legs[0]][1]]);
  const d1=dist(pts[SIDES[legs[1]][0]],pts[SIDES[legs[1]][1]]);
  smallIdx=d0<=d1?legs[0]:legs[1];
  bigIdx  =d0<=d1?legs[1]:legs[0];
  // Integer tile counts
  nSmall=Math.round(dist(pts[SIDES[smallIdx][0]],pts[SIDES[smallIdx][1]])**2/PX**2);
  nBig  =Math.round(dist(pts[SIDES[bigIdx][0]],  pts[SIDES[bigIdx][1]])**2/PX**2);
  phase=2;t0=null;animT=0;
  updateButtons();
  raf=requestAnimationFrame(animLoop);
}

const TILE_DUR=0.10;   // seconds per tile (faster)
const TILE_DELAY=0.15; // delay between drain start and fill start

function animLoop(ts){
  if(!t0)t0=ts;
  const el=(ts-t0)/1000;
  const nTiles=phase===2?nSmall:nBig;
  const totalDur=nTiles*TILE_DUR+TILE_DELAY;
  animT=Math.min(el/Math.max(totalDur,0.1),1);
  draw();
  if(animT>=1){
    if(phase===2){phase=3;t0=null;animT=0;}
    else if(phase===3){phase=4;animT=1;draw();updateButtons();return;}
  }
  if(phase>=2&&phase<4)raf=requestAnimationFrame(animLoop);
}

/* ── GRID ── */
function drawGridLevel(step,op){
  if(op<=0)return;
  const x0=(-panX)/sc,y0=(-panY)/sc,x1=(CW-panX)/sc,y1=(CH-panY)/sc;
  const sx=Math.floor(x0/step)*step,sy=Math.floor(y0/step)*step;
  ctx.strokeStyle=`rgba(180,178,169,${op})`;ctx.lineWidth=.5/sc;
  ctx.beginPath();
  for(let x=sx;x<=x1+step;x+=step){ctx.moveTo(x,y0);ctx.lineTo(x,y1);}
  for(let y=sy;y<=y1+step;y+=step){ctx.moveTo(x0,y);ctx.lineTo(x1,y);}
  ctx.stroke();
}
function drawGrid(){
  GL.forEach((step,i)=>{
    const spx=step*sc;let op=0;
    if(spx<GV)op=0;else if(spx<GV*3)op=(spx-GV)/(GV*2)*GO[i];else op=GO[i];
    if(spx>600)op=Math.max(0,op*(1-(spx-600)/300));
    drawGridLevel(step,op);
  });
}

/* ── SQUARE GEOMETRY ── */
function sqGeom(i,j){
  const a=pts[i],b=pts[j],g=centroid(),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
  const dx=b.x-a.x,dy=b.y-a.y;
  let nx=-dy,ny=dx;
  if(nx*(g.x-mx)+ny*(g.y-my)>0){nx=-nx;ny=-ny;}
  const l=Math.sqrt(nx*nx+ny*ny);nx/=l;ny/=l;
  const s=dist(a,b);
  const s1={x:a.x+nx*s,y:a.y+ny*s},s2={x:b.x+nx*s,y:b.y+ny*s};
  return{a,b,s1,s2,side:s,cx:(a.x+b.x+s1.x+s2.x)/4,cy:(a.y+b.y+s1.y+s2.y)/4};
}

/* ── TILE ENGINE ── */
// Builds list of cells for a square: {row,col,cW,cH,isInt}
function buildCells(sideCm){
  const cells=[];
  let row=0;
  while(row<sideCm-1e-9){
    const cH=Math.min(1,sideCm-row);if(cH<1e-9)break;
    let col=0;
    while(col<sideCm-1e-9){
      const cW=Math.min(1,sideCm-col);if(cW<1e-9)break;
      cells.push({row,col,cW,cH,isInt:cW>1-1e-9&&cH>1-1e-9});
      col+=cW;
    }
    row+=cH;
  }
  return cells;
}

// Draw one tile always at FULL SIZE (scale=1), opacity controls pop-in
function drawTileInSq(g,ux,uy,vnx,vny,cell,opacity,ci){
  if(opacity<1e-9)return;
  const{row,col,cW,cH}=cell;
  // Full cell corners in local frame
  const u0=col*PX,   u1=(col+cW)*PX;
  const v0=row*PX,   v1=(row+cH)*PX;
  const wc=[
    {x:g.a.x+ux*u0+vnx*v0, y:g.a.y+uy*u0+vny*v0},
    {x:g.a.x+ux*u1+vnx*v0, y:g.a.y+uy*u1+vny*v0},
    {x:g.a.x+ux*u1+vnx*v1, y:g.a.y+uy*u1+vny*v1},
    {x:g.a.x+ux*u0+vnx*v1, y:g.a.y+uy*u0+vny*v1}
  ];
  ctx.beginPath();ctx.moveTo(wc[0].x,wc[0].y);
  wc.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.closePath();
  ctx.fillStyle=SQC[ci].f+opacity+')';ctx.fill();
  if(cell.isInt){
    ctx.strokeStyle=SQC[ci].f+'0.9)';ctx.lineWidth=.8/sc;ctx.stroke();
  }
}

function getUV(g){
  const side=g.side;
  const ux=(g.b.x-g.a.x)/side,uy=(g.b.y-g.a.y)/side;
  const vdx=g.s1.x-g.a.x,vdy=g.s1.y-g.a.y,vl=Math.sqrt(vdx*vdx+vdy*vdy);
  return{ux,uy,vnx:vdx/vl,vny:vdy/vl};
}

function clipToSq(g){
  ctx.beginPath();ctx.moveTo(g.a.x,g.a.y);ctx.lineTo(g.b.x,g.b.y);
  ctx.lineTo(g.s2.x,g.s2.y);ctx.lineTo(g.s1.x,g.s1.y);ctx.closePath();ctx.clip();
}

// Draw full square (normal state)
function drawSqFull(i,j,ci){
  const g=sqGeom(i,j);
  ctx.beginPath();ctx.moveTo(g.a.x,g.a.y);ctx.lineTo(g.b.x,g.b.y);ctx.lineTo(g.s2.x,g.s2.y);ctx.lineTo(g.s1.x,g.s1.y);ctx.closePath();
  ctx.fillStyle=SQC[ci].f+'0.18)';ctx.fill();ctx.strokeStyle=SQC[ci].s;ctx.lineWidth=1/sc;ctx.stroke();
  ctx.font=`700 ${12/sc}px 'Nunito',sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=SQC[ci].t;
  ctx.fillText(areaLabel(pts[i],pts[j]),g.cx,g.cy);
}

// Draw source square with nGone tiles removed, current tile (at index nGone) popping out at popFrac
function drawSqDrain(i,j,ci,nGone,popFrac){
  const g=sqGeom(i,j);
  // outline
  ctx.beginPath();ctx.moveTo(g.a.x,g.a.y);ctx.lineTo(g.b.x,g.b.y);ctx.lineTo(g.s2.x,g.s2.y);ctx.lineTo(g.s1.x,g.s1.y);ctx.closePath();
  ctx.fillStyle=SQC[ci].f+'0.06)';ctx.fill();ctx.strokeStyle=SQC[ci].s;ctx.lineWidth=1/sc;ctx.stroke();
  const{ux,uy,vnx,vny}=getUV(g);
  const sideCm=g.side/PX;
  const cells=buildCells(sideCm);
  ctx.save();clipToSq(g);
  let intIdx=0;
  for(const cell of cells){
    if(!cell.isInt)continue; // partial border cells stay hidden during drain
    const idx=intIdx++;
    if(idx<nGone)continue;
    if(idx===nGone){
      const op=(1-easeInOut(popFrac))*0.75;
      if(op>1e-9) drawTileInSq(g,ux,uy,vnx,vny,cell,op,ci);
    } else {
      drawTileInSq(g,ux,uy,vnx,vny,cell,0.75,ci);
    }
  }
  ctx.restore();
  ctx.font=`700 ${12/sc}px 'Nunito',sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=SQC[ci].t;
  ctx.fillText(areaLabel(pts[i],pts[j]),g.cx,g.cy);
}

// Fill hyp square: nStart = integer tile offset, nDone = complete tiles, popFrac = current tile opacity
function fillHypSq(nStart,nDone,popFrac,ci){
  if(nDone<=0&&popFrac<1e-9)return;
  const[hi,hj]=SIDES[hypIdx];
  const g=sqGeom(hi,hj);
  const{ux,uy,vnx,vny}=getUV(g);
  const cells=buildCells(g.side/PX);
  ctx.save();clipToSq(g);
  let intIdx=0;
  for(const cell of cells){
    if(!cell.isInt)continue; // skip partial border cells
    const idx=intIdx++;
    if(idx<nStart)continue;
    const local=idx-nStart;
    if(local<nDone){
      drawTileInSq(g,ux,uy,vnx,vny,cell,0.75,ci);
    } else if(local===nDone){
      const op=easeInOut(popFrac)*0.75;
      if(op>1e-9) drawTileInSq(g,ux,uy,vnx,vny,cell,op,ci);
      break;
    } else break;
  }
  ctx.restore();
}

// Draw hyp square: neutral background + empty cell grid
function drawHypBg(){
  const[hi,hj]=SIDES[hypIdx];
  const g=sqGeom(hi,hj);
  // Background
  ctx.beginPath();ctx.moveTo(g.a.x,g.a.y);ctx.lineTo(g.b.x,g.b.y);
  ctx.lineTo(g.s2.x,g.s2.y);ctx.lineTo(g.s1.x,g.s1.y);ctx.closePath();
  ctx.fillStyle='rgba(240,238,232,0.5)';ctx.fill();
  ctx.strokeStyle='rgba(80,80,80,0.5)';ctx.lineWidth=1.5/sc;ctx.stroke();
  // Draw empty cell outlines
  const{ux,uy,vnx,vny}=getUV(g);
  const cells=buildCells(g.side/PX);
  ctx.save();clipToSq(g);
  for(const cell of cells){
    if(!cell.isInt)continue;
    const{row,col,cW,cH}=cell;
    const u0=col*PX,u1=(col+cW)*PX,v0=row*PX,v1=(row+cH)*PX;
    const wc=[
      {x:g.a.x+ux*u0+vnx*v0,y:g.a.y+uy*u0+vny*v0},
      {x:g.a.x+ux*u1+vnx*v0,y:g.a.y+uy*u1+vny*v0},
      {x:g.a.x+ux*u1+vnx*v1,y:g.a.y+uy*u1+vny*v1},
      {x:g.a.x+ux*u0+vnx*v1,y:g.a.y+uy*u0+vny*v1}
    ];
    ctx.beginPath();ctx.moveTo(wc[0].x,wc[0].y);wc.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.closePath();
    ctx.strokeStyle='rgba(150,148,140,0.4)';ctx.lineWidth=0.5/sc;ctx.stroke();
  }
  ctx.restore();
  // Label
  const ci=hypIdx;
  ctx.font=`700 ${12/sc}px 'Nunito',sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=SQC[ci].t;
  ctx.fillText(areaLabel(pts[hi],pts[hj]),g.cx,g.cy);
}
function sameEdge(a,b,h0,h1){return(a===h0&&b===h1)||(a===h1&&b===h0);}
function drawSideLabel(a,b,label,isHyp){
  const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
  const g=centroid(),ix=g.x-mx,iy=g.y-my,il=Math.sqrt(ix*ix+iy*iy);
  if(il<1)return;
  const inX=ix/il,inY=iy/il;
  let ang=Math.atan2(b.y-a.y,b.x-a.x);if(ang>Math.PI/2||ang<-Math.PI/2)ang+=Math.PI;
  const fs=11/sc;
  ctx.save();ctx.translate(mx+inX*16/sc,my+inY*16/sc);ctx.rotate(ang);
  ctx.font=`600 ${fs}px 'Nunito',sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#1E1D1A';
  ctx.fillText(label,0,0);ctx.restore();
  if(isHyp){
    ctx.save();ctx.translate(mx-inX*22/sc,my-inY*22/sc);ctx.rotate(ang);
    ctx.font=`700 ${fs}px 'Nunito',sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#993C1D';
    ctx.fillText('hypoténuse',0,0);ctx.restore();
  }
}
function drawRAMark(vi,p1i,p2i){
  const v=pts[vi],p1=pts[p1i],p2=pts[p2i],sz=12/sc;
  const d1x=p1.x-v.x,d1y=p1.y-v.y,l1=Math.sqrt(d1x*d1x+d1y*d1y);
  const d2x=p2.x-v.x,d2y=p2.y-v.y,l2=Math.sqrt(d2x*d2x+d2y*d2y);
  if(l1<1||l2<1)return;
  const u1={x:d1x/l1*sz,y:d1y/l1*sz},u2={x:d2x/l2*sz,y:d2y/l2*sz};
  const co={x:v.x+u1.x+u2.x,y:v.y+u1.y+u2.y};
  ctx.beginPath();ctx.moveTo(v.x+u1.x,v.y+u1.y);ctx.lineTo(co.x,co.y);ctx.lineTo(v.x+u2.x,v.y+u2.y);
  ctx.strokeStyle='#1E1D1A';ctx.lineWidth=1.5/sc;ctx.stroke();
}

/* ── MAIN DRAW ── */
function draw(){
  ctx.clearRect(0,0,CW,CH);
  ctx.save();ctx.translate(panX,panY);ctx.scale(sc,sc);drawGrid();ctx.restore();
  ctx.save();ctx.translate(panX,panY);ctx.scale(sc,sc);

  const[A,B,C]=pts;
  const ra=getRightAngle();
  const h0=ra?ra.hyp[0]:null,h1=ra?ra.hyp[1]:null;

  if(showSq){
    if(phase===0||phase===1){
      SIDES.forEach(([i,j],ci)=>drawSqFull(i,j,ci));
    } else if(phase===2){
      const nTiles=nSmall;
      const totalDur=nTiles*TILE_DUR+TILE_DELAY;
      const elTime=animT*totalDur; // real elapsed seconds
      // Drain starts immediately
      const drainProgress=Math.min(elTime/Math.max(nTiles*TILE_DUR,0.01),1)*nTiles;
      // Fill starts TILE_DELAY later
      const fillProgress=Math.min(Math.max(elTime-TILE_DELAY,0)/Math.max(nTiles*TILE_DUR,0.01),1)*nTiles;
      const dDone=Math.floor(drainProgress), dFrac=drainProgress-dDone;
      const fDone=Math.floor(fillProgress),  fFrac=fillProgress-fDone;
      SIDES.forEach(([i,j],ci)=>{
        if(ci===hypIdx){
          drawHypBg();
          fillHypSq(0,fDone,fFrac,smallIdx);
        } else if(ci===smallIdx){
          drawSqDrain(i,j,ci,dDone,dFrac);
        } else {
          drawSqFull(i,j,ci);
        }
      });
    } else if(phase>=3){
      const t=phase===3?animT:1;
      const nTiles=nBig;
      const totalDur=nTiles*TILE_DUR+TILE_DELAY;
      const elTime=t*totalDur;
      const drainProgress=Math.min(elTime/Math.max(nTiles*TILE_DUR,0.01),1)*nTiles;
      const fillProgress=Math.min(Math.max(elTime-TILE_DELAY,0)/Math.max(nTiles*TILE_DUR,0.01),1)*nTiles;
      const dDone=Math.floor(drainProgress), dFrac=drainProgress-dDone;
      const fDone=Math.floor(fillProgress),  fFrac=fillProgress-fDone;
      SIDES.forEach(([i,j],ci)=>{
        if(ci===hypIdx){
          drawHypBg();
          fillHypSq(0,nSmall,0,smallIdx);
          fillHypSq(nSmall,fDone,fFrac,bigIdx);
        } else if(ci===smallIdx){
          drawSqDrain(i,j,ci,nSmall,0);
        } else if(ci===bigIdx){
          drawSqDrain(i,j,ci,dDone,dFrac);
        }
      });
    }
  }

  // Triangle
  ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.lineTo(C.x,C.y);ctx.closePath();
  ctx.fillStyle='rgba(226,224,216,0.6)';ctx.fill();ctx.strokeStyle='#1E1D1A';ctx.lineWidth=2/sc;ctx.stroke();

  drawSideLabel(A,B,lenLabel(A,B),ra&&sameEdge(0,1,h0,h1));
  drawSideLabel(B,C,lenLabel(B,C),ra&&sameEdge(1,2,h0,h1));
  drawSideLabel(C,A,lenLabel(C,A),ra&&sameEdge(2,0,h0,h1));
  if(ra)drawRAMark(ra.vi,ra.p1,ra.p2);

  pts.forEach(p=>{
    ctx.beginPath();ctx.arc(p.x,p.y,R/sc,0,Math.PI*2);
    ctx.fillStyle='#FFF';ctx.fill();ctx.strokeStyle='#1E1D1A';ctx.lineWidth=2/sc;ctx.stroke();
  });
  ctx.restore();
}

/* ── COORDS ── */
function c2w(cx,cy){return{x:(cx-panX)/sc,y:(cy-panY)/sc};}
function getCP(e){const r=canvas.getBoundingClientRect(),s=e.touches?e.touches[0]:e;return{x:(s.clientX-r.left)*CW/r.width,y:(s.clientY-r.top)*CH/r.height};}
function getWP(e){const c=getCP(e);return c2w(c.x,c.y);}
function findV(wp){return pts.find(p=>dist(p,wp)<R*3/sc);}

/* ── ZOOM ── */
function applyZoom(ns,px,py){ns=Math.max(.1,Math.min(30,ns));panX=px-(px-panX)*ns/sc;panY=py-(py-panY)*ns/sc;sc=ns;draw();}
canvas.addEventListener('wheel',e=>{e.preventDefault();const c=getCP(e);applyZoom(sc*(e.deltaY<0?1.05:1/1.05),c.x,c.y);},{passive:false});

/* ── VERTEX MOVE ── */
function moveV(wp){if(!drag)return;const s=snap(wp.x,wp.y);drag.x=s.x;drag.y=s.y;}
function grabV(wp){
  drag=findV(wp);
  if(drag){isDrag=true;stopAnim();draw();updateButtons();}
  return drag;
}
function releaseV(){
  if(!drag)return;
  const s=snap(drag.x,drag.y);drag.x=s.x;drag.y=s.y;
  isDrag=false;drag=null;
  draw();updateButtons();
}

/* ── TOUCH ── */
function td(e){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;return Math.sqrt(dx*dx+dy*dy);}
function tm(e){const r=canvas.getBoundingClientRect();return{x:((e.touches[0].clientX+e.touches[1].clientX)/2-r.left)*CW/r.width,y:((e.touches[0].clientY+e.touches[1].clientY)/2-r.top)*CH/r.height};}
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(e.touches.length===2){drag=null;isDrag=false;panning=false;pinch=true;pDist=td(e);pSc=sc;const m=tm(e);pMx=m.x;pMy=m.y;pPx=panX;pPy=panY;}
  else if(e.touches.length===1&&!pinch){const wp=getWP(e);if(!grabV(wp)){panning=true;const c=getCP(e);plx=c.x;ply=c.y;}}
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===2&&pinch){const raw=pSc*td(e)/pDist;const ns=Math.max(.1,Math.min(30,pSc+(raw-pSc)*.6));panX=pMx-(pMx-pPx)*ns/pSc;panY=pMy-(pMy-pPy)*ns/pSc;sc=ns;draw();}
  else if(e.touches.length===1){if(drag){moveV(getWP(e));draw();}else if(panning){const c=getCP(e);panX+=c.x-plx;panY+=c.y-ply;plx=c.x;ply=c.y;draw();}}
},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();if(e.touches.length<2)pinch=false;if(e.touches.length===0){if(drag){releaseV();}panning=false;}},{passive:false});

/* ── MOUSE ── */
canvas.addEventListener('mousedown',e=>{const wp=getWP(e);if(!grabV(wp)){panning=true;const c=getCP(e);plx=c.x;ply=c.y;}});
canvas.addEventListener('mousemove',e=>{
  const c=getCP(e),wp=c2w(c.x,c.y);
  if(drag){canvas.style.cursor='grabbing';moveV(wp);draw();updateButtons();}
  else if(panning){canvas.style.cursor='move';panX+=c.x-plx;panY+=c.y-ply;plx=c.x;ply=c.y;draw();}
  else canvas.style.cursor=findV(wp)?'grab':'default';
});
canvas.addEventListener('mouseup',()=>{if(drag){releaseV();}panning=false;canvas.style.cursor='default';draw();});
canvas.addEventListener('mouseleave',()=>{if(drag){releaseV();}panning=false;draw();});


function updateButtons(){
  const ra=getRightAngle(),btnA=document.getElementById('btn-anim'),btnR=document.getElementById('btn-reset'),btnT=document.getElementById('btn-thm');
  if(!showSq||!ra||!hypIsInteger(ra)){btnA.style.display='none';btnR.style.display='none';if(btnT)btnT.style.display='none';return;}
  if(phase===0){btnA.style.display='';btnA.disabled=false;btnR.style.display='none';if(btnT)btnT.style.display='none';}
  else if(phase>=2&&phase<4){btnA.style.display='';btnA.disabled=true;btnR.style.display='none';if(btnT)btnT.style.display='none';}
  else if(phase===4){
    btnA.style.display='none';btnR.style.display='none';if(btnT)btnT.style.display='';
    const[si,sj]=SIDES[smallIdx],[bi,bj]=SIDES[bigIdx],[hi,hj]=SIDES[hypIdx];
    const aVal=Math.round(dist(pts[si],pts[sj])**2/PX**2);
    const bVal=Math.round(dist(pts[bi],pts[bj])**2/PX**2);
    const cVal=Math.round(dist(pts[hi],pts[hj])**2/PX**2);
    const aCol=SQC[smallIdx].t,bCol=SQC[bigIdx].t,cCol=SQC[hypIdx].t;
    const aCm=fmt(dist(pts[si],pts[sj])/PX,0),bCm=fmt(dist(pts[bi],pts[bj])/PX,0),cCm=fmt(dist(pts[hi],pts[hj])/PX,0);
    const tv=document.getElementById('thm-values');
    if(tv)tv.innerHTML='<span style="color:'+aCol+'">'+aCm+'<sup>2</sup></span> + <span style="color:'+bCol+'">'+bCm+'<sup>2</sup></span> = <span style="color:'+cCol+'">'+cCm+'<sup>2</sup></span><br><span style="color:'+aCol+'">'+aVal+'</span> + <span style="color:'+bCol+'">'+bVal+'</span> = <span style="color:'+cCol+'">'+cVal+'</span>';
  }
}

  {level:2,type:'input',question:"Cath\u00e8tes de <em>5 cm</em> et <em>12 cm</em>. Calcule l'hypot\u00e9nuse.",svg:triS('5 cm','12 cm','?'),label:'Hypot\u00e9nuse =',unit:'cm',answer:13,tol:.05,ok:"Super ! \u221a(25 + 144) = \u221a169 = 13 cm. Triplet 5-12-13 !",ko:"5\u00b2 + 12\u00b2 = 25 + 144 = 169 \u2192 \u221a169 = ?",hint:"5\u00b2 + 12\u00b2 = 169 \u2192 c = \u221a169 = 13"},
  {level:3,type:'input',question:"Hypot\u00e9nuse <em>10 cm</em>, un cath\u00e8te <em>6 cm</em>. Calcule l'autre cath\u00e8te.",svg:triS('6 cm','?','10 cm'),label:'Cath\u00e8te =',unit:'cm',answer:8,tol:.05,ok:"Bravo ! b\u00b2 = 100 \u2212 36 = 64 \u2192 b = 8 cm.",ko:"b\u00b2 = c\u00b2 \u2212 a\u00b2 = 10\u00b2 \u2212 6\u00b2",hint:"b\u00b2 = 100 \u2212 36 = 64 \u2192 b = ?"},
  {level:3,type:'input',question:"Hypot\u00e9nuse <em>13 cm</em>, un cath\u00e8te <em>5 cm</em>. Calcule l'autre cath\u00e8te.",svg:triS('5 cm','?','13 cm'),label:'Cath\u00e8te =',unit:'cm',answer:12,tol:.05,ok:"Parfait ! b\u00b2 = 169 \u2212 25 = 144 \u2192 b = 12 cm.",ko:"b\u00b2 = 13\u00b2 \u2212 5\u00b2 = 169 \u2212 25 = 144 \u2192 \u221a144 = ?",hint:"b\u00b2 = 169 \u2212 25 = 144"},
  {level:4,type:'input',question:"Une \u00e9chelle de <em>5 m</em> est appuy\u00e9e contre un mur, son pied est \u00e0 <em>3 m</em> du mur. \u00c0 quelle hauteur touche-t-elle le mur ?",svg:ladderSvg(),label:'Hauteur =',unit:'m',answer:4,tol:.05,ok:"Correct ! h\u00b2 = 25 \u2212 9 = 16 \u2192 h = 4 m.",ko:"L'\u00e9chelle est l'hypot\u00e9nuse. h\u00b2 = 5\u00b2 \u2212 3\u00b2",hint:"h\u00b2 = 25 \u2212 9 = 16 \u2192 h = ?"},

];
let exScore=0,exDone=new Array(EX.length).fill(false);
function renderEx(){
  const wrap=document.getElementById('exercises-wrap');
  let h='';let lastLv=0;
  EX.forEach((ex,idx)=>{
    if(ex.level!==lastLv){h+='<div class="level-sep">'+LVL[ex.level]+'</div>';lastLv=ex.level;}
    const svg=ex.svg?'<div class="tri-wrap">'+ex.svg+'</div>':'';
    const hint=ex.hint?'<button class="hint-btn" onclick="showHint('+idx+')">Indice</button>':'';
    let inp='';
    if(ex.type==='qcm'){
      inp='<div class="qcm-grid">'+ex.choices.map((c,ci)=>'<button class="qcm-btn" id="q'+idx+'_'+ci+'" onclick="answerQ('+idx+','+ci+')">'+c+'</button>').join('')+'</div>';
    } else {
      inp='<div class="input-row"><span class="input-label">'+ex.label+'</span><input class="num-input" id="inp'+idx+'" type="number" step="0.01" placeholder="\u2026" onkeydown="if(event.key===\'Enter\')checkInp('+idx+')"><span class="input-label">'+ex.unit+'</span><button class="check-btn" id="chk'+idx+'" onclick="checkInp('+idx+')">V\u00e9rifier</button></div>';
    }
    h+='<div class="ex-card'+(idx>0?' locked':'')+'" id="ecard'+idx+'"><div class="ex-num">Exercice '+(idx+1)+' / '+EX.length+'</div><div class="level-badge '+LVC[ex.level]+'">'+LVL[ex.level]+'</div><div class="ex-question">'+ex.question+'</div>'+svg+hint+inp+'<div class="feedback" id="fb'+idx+'"></div></div>';
  });
  wrap.innerHTML=h;updateExProgress();
}
function showHint(idx){const fb=document.getElementById('fb'+idx);fb.className='feedback hint show';fb.innerHTML='💡 '+EX[idx].hint;}
function answerQ(idx,chosen){
  if(exDone[idx])return;exDone[idx]=true;
  const ex=EX[idx],ok=chosen===ex.answer;
  ex.choices.forEach((_,ci)=>{const b=document.getElementById('q'+idx+'_'+ci);b.disabled=true;if(ci===ex.answer)b.classList.add('correct');else if(ci===chosen)b.classList.add('wrong');});
  showFb(idx,ok,ex);if(ok)exScore++;updateExProgress();unlockNext(idx);
}
function checkInp(idx){
  if(exDone[idx])return;
  const ex=EX[idx],inp=document.getElementById('inp'+idx),val=parseFloat(inp.value.replace(',','.'));
  if(isNaN(val))return;exDone[idx]=true;
  const ok=Math.abs(val-ex.answer)<=ex.tol;
  inp.classList.add(ok?'correct':'wrong');document.getElementById('chk'+idx).disabled=true;inp.disabled=true;
  showFb(idx,ok,ex);if(ok)exScore++;updateExProgress();unlockNext(idx);
}
function showFb(idx,ok,ex){
  const fb=document.getElementById('fb'+idx);
  fb.className='feedback show '+(ok?'ok':'ko');
  fb.innerHTML=(ok?'✅ ':'❌ ')+(ok?ex.ok:ex.ko);
  if(ex.hint&&!ok)fb.innerHTML+='<div class="detail">Indice : '+ex.hint+'</div>';
}
function unlockNext(idx){
  const next=idx+1;
  if(next<EX.length){
    document.getElementById('ecard'+next).classList.remove('locked');
    setTimeout(()=>document.getElementById('ecard'+next).scrollIntoView({behavior:'smooth',block:'center'}),300);
  } else {setTimeout(showExScore,600);}
}
function updateExProgress(){
  const done=exDone.filter(Boolean).length;
  document.getElementById('prog-label').textContent='Exercice '+Math.min(done+1,EX.length)+' sur '+EX.length;
  document.getElementById('prog-score').textContent=exScore+' \u2713';
  document.getElementById('prog-fill').style.width=(done/EX.length*100)+'%';
}
function showExScore(){
  const card=document.getElementById('score-card');card.className='score-card show';card.scrollIntoView({behavior:'smooth'});
  document.getElementById('final-score').textContent=exScore+' / '+EX.length;
  const p=Math.round(exScore/EX.length*100);
  const msgs=[[100,'Parfait ! Tu ma\u00eetrises le th\u00e9or\u00e8me de Pythagore \uD83C\uDFC6'],[80,'Tr\u00e8s bien ! Encore quelques r\u00e9visions \uD83C\uDF89'],[50,"Pas mal ! Continue \u00e0 t'entra\u00eener \uD83D\uDCCF"],[0,'Continue \u2014 relis bien la formule a\u00b2 + b\u00b2 = c\u00b2 \uD83D\uDCAA']];
  document.getElementById('final-msg').textContent=msgs.find(([s])=>p>=s)[1];
}
function restart(){exScore=0;exDone.fill(false);document.getElementById('score-card').className='score-card';renderEx();document.getElementById('page-ex').scrollTop=0;}
renderEx();

</script>
