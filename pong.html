<div style="display: flex; justify-content: center; padding: 1rem 0;">
  <div id="pong-container" style="position: relative; width: 480px; height: 480px; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); overflow: hidden;">
    <canvas id="trail-canvas" width="480" height="480" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 0.3s ease;"></canvas>
    <canvas id="point-canvas" width="480" height="480" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></canvas>
    <div id="edge-top" style="position: absolute; top: 0; left: 0; width: 100%; height: 20px;"></div>
    <div id="edge-bottom" style="position: absolute; bottom: 0; left: 0; width: 100%; height: 20px;"></div>
    <div id="edge-left" style="position: absolute; top: 0; left: 0; width: 20px; height: 100%;"></div>
    <div id="edge-right" style="position: absolute; top: 0; right: 0; width: 20px; height: 100%;"></div>
  </div>
</div>

<script>
(function() {
  const SIZE = 480;
  const RADIUS = 5;
  const trailCanvas = document.getElementById('trail-canvas');
  const pointCanvas = document.getElementById('point-canvas');
  const trailCtx = trailCanvas.getContext('2d');
  const pointCtx = pointCanvas.getContext('2d');

  // Color for the point and trail — use the primary text color via a computed style
  const styles = getComputedStyle(document.documentElement);
  const pointColor = styles.getPropertyValue('--color-text-primary').trim() || '#1a1a1a';

  // Random initial position (with margin) and random velocity direction
  let x = RADIUS + Math.random() * (SIZE - 2 * RADIUS);
  let y = RADIUS + Math.random() * (SIZE - 2 * RADIUS);
  const speed = 2.2;
  let angle = Math.random() * Math.PI * 2;
  let vx = Math.cos(angle) * speed;
  let vy = Math.sin(angle) * speed;

  // Track previous position to draw trail segments
  let prevX = x;
  let prevY = y;

  // Set trail stroke style once
  trailCtx.strokeStyle = pointColor;
  trailCtx.lineWidth = 0.5;
  trailCtx.lineCap = 'round';

  function randomizeBounce(component) {
    // Small random perturbation on bounce to keep things lively but still pong-like
    const jitter = (Math.random() - 0.5) * 0.4;
    return component + jitter;
  }

  function step() {
    prevX = x;
    prevY = y;

    x += vx;
    y += vy;

    // Bounce off edges
    if (x <= RADIUS) {
      x = RADIUS;
      vx = Math.abs(vx);
      vy = randomizeBounce(vy);
    } else if (x >= SIZE - RADIUS) {
      x = SIZE - RADIUS;
      vx = -Math.abs(vx);
      vy = randomizeBounce(vy);
    }
    if (y <= RADIUS) {
      y = RADIUS;
      vy = Math.abs(vy);
      vx = randomizeBounce(vx);
    } else if (y >= SIZE - RADIUS) {
      y = SIZE - RADIUS;
      vy = -Math.abs(vy);
      vx = randomizeBounce(vx);
    }

    // Normalize velocity to keep constant speed
    const mag = Math.sqrt(vx * vx + vy * vy);
    vx = (vx / mag) * speed;
    vy = (vy / mag) * speed;

    // Draw new trail segment (always drawn; visibility is controlled by canvas opacity)
    trailCtx.beginPath();
    trailCtx.moveTo(prevX, prevY);
    trailCtx.lineTo(x, y);
    trailCtx.stroke();

    // Redraw the point
    pointCtx.clearRect(0, 0, SIZE, SIZE);
    pointCtx.fillStyle = pointColor;
    pointCtx.beginPath();
    pointCtx.arc(x, y, RADIUS, 0, Math.PI * 2);
    pointCtx.fill();

    requestAnimationFrame(step);
  }

  step();

  // Edge hover: show trail on enter, hide on leave
  const edges = ['edge-top', 'edge-bottom', 'edge-left', 'edge-right'];
  let hoverCount = 0;
  edges.forEach(function(id) {
    const el = document.getElementById(id);
    el.addEventListener('mouseenter', function() {
      hoverCount++;
      trailCanvas.style.opacity = '1';
    });
    el.addEventListener('mouseleave', function() {
      hoverCount = Math.max(0, hoverCount - 1);
      if (hoverCount === 0) {
        trailCanvas.style.opacity = '0';
      }
    });
  });
})();
</script>
