<!doctype html>
<!--
  Note pour Claude : activité autonome (aucune dépendance externe).
  Figure en SVG (viewBox 990x740) + cadres de dépôt en HTML positionnés en px
  au-dessus de la scène ; la scène est mise à l'échelle par transform:scale.
  Glisser-déposer via Pointer Events (souris + tactile) + mode « clic-clic ».
  6 cadres : point / droite / segment / demi-droite / droite / droites sécantes.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulaire de base en géométrie</title>
<style>
:root{
  --papier:#f5f5f1;
  --encre:#151a2e;
  --gris:#6d7382;
  --trait:#d9dbe1;
  --bleu:#93c0f4;
  --bleu-fonce:#1f4fa8;
  --juste:#2f9e57;
  --faux:#d8402a;
  --noir:#1f2340;
  --rouge:#e8452c;
  --vert:#2fa14a;
  --violet:#5b34c8;
  --olive:#8a8a20;
  --sarcelle:#0f7d8f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--papier);
  color:var(--encre);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.45;
  padding:14px 18px;
  height:100vh;overflow:hidden;
}
.page{max-width:1320px;margin:0 auto;height:100%;display:flex;flex-direction:column}

/* ---------- en-tête ---------- */
.entete{display:flex;align-items:baseline;justify-content:center;gap:10px;flex-wrap:wrap;text-align:center}
.eyebrow,.consigne{
  margin:0;font-size:13.5px;font-weight:700;letter-spacing:.16em;color:var(--gris);
}
.eyebrow{text-transform:uppercase}
.eyebrow::after{content:" ·";margin-left:2px}
.consigne{text-transform:none}
.rule{height:1px;background:var(--trait);margin:10px 0;flex:none}

/* ---------- scène ---------- */
.scene{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start}
.boite{position:relative}
.plateau{position:absolute;left:0;top:0;width:1020px;height:725px;transform-origin:top left}
.figure{
  position:absolute;left:0;top:0;width:810px;height:725px;
  background:
    linear-gradient(rgba(21,26,46,.045) 1px,transparent 1px) 0 0/24px 24px,
    linear-gradient(90deg,rgba(21,26,46,.045) 1px,transparent 1px) 0 0/24px 24px,
    #fdfdfb;
  border:1px solid var(--trait);border-radius:12px;
}
.figure svg{position:absolute;inset:0;width:810px;height:725px}

/* ---------- cadres de dépôt ---------- */
.zone{
  position:absolute;width:186px;height:42px;
  border:1.5px dashed #9aa1b2;border-radius:12px;
  background:rgba(255,255,255,.72);
  display:flex;align-items:center;justify-content:center;padding:3px;
  cursor:pointer;transition:border-color .12s,background .12s,box-shadow .12s;
}
.zone:hover,.zone.survol{border-color:var(--bleu-fonce);background:#fff}
.zone.pleine{border-style:solid;border-color:#c3c8d4;background:#fff}
.zone.juste{border-color:var(--juste);box-shadow:0 0 0 2px rgba(47,158,87,.18)}
.zone.faux{border-color:var(--faux);box-shadow:0 0 0 2px rgba(216,64,42,.16)}
.zone.vide-signalee{border-color:var(--faux)}
.verdict{
  position:absolute;right:-24px;top:50%;transform:translateY(-50%);
  font-size:17px;font-weight:800;opacity:0;
}
.zone.juste .verdict{opacity:1;color:var(--juste)}
.zone.faux .verdict{opacity:1;color:var(--faux)}

/* ---------- étiquettes ---------- */
.etiquette{
  background:var(--bleu);color:#0d1526;text-align:center;
  font-weight:700;font-size:14.5px;
  padding:8px 12px;border-radius:9px;
  border:1px solid rgba(31,79,168,.35);
  cursor:grab;user-select:none;touch-action:none;
  white-space:nowrap;
  box-shadow:0 1px 0 rgba(21,26,46,.12);
}
.etiquette:focus-visible{outline:2px solid var(--bleu-fonce);outline-offset:2px}
.etiquette.dragging{cursor:grabbing;z-index:50;position:relative;box-shadow:0 8px 20px rgba(21,26,46,.28);rotate:-.6deg}
.etiquette.choisie{box-shadow:0 0 0 3px var(--bleu-fonce);rotate:-1deg}
.zone .etiquette{width:100%;height:100%;display:flex;align-items:center;justify-content:center;box-shadow:none;border-color:transparent}

/* ---------- réserve ---------- */
.reserve-titre{
  font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gris);font-weight:700;margin:0 0 10px;
}
.reserve{
  position:absolute;left:820px;top:0;width:200px;
  display:flex;flex-direction:column;gap:8px;align-items:stretch;
  overflow:visible;
  padding:10px;border:1px solid var(--trait);border-radius:12px;
  background:#fdfdfb;
}
.reserve.survol{border-color:var(--bleu-fonce)}
.reserve:empty::before{
  content:"Toutes les étiquettes sont placées.";
  color:var(--gris);font-size:14px;font-style:italic;
}

/* ---------- barre d'actions ---------- */
.actions{position:absolute;left:820px;top:320px;width:200px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
button{
  font:inherit;font-weight:700;font-size:14.5px;
  padding:9px 14px;border-radius:9px;cursor:pointer;
  border:1px solid var(--encre);background:var(--encre);color:#fff;
}
button.secondaire{background:transparent;color:var(--encre);border-color:#b9bec9}
button.secondaire:hover{border-color:var(--encre)}
button:disabled{opacity:.35;cursor:not-allowed;border-color:#b9bec9;background:#b9bec9}
button:focus-visible{outline:2px solid var(--bleu-fonce);outline-offset:2px}
.bilan{font-weight:700;font-size:14px;line-height:1.3;min-height:20px;text-align:center;margin-top:2px}
.bilan .score{font-size:19px}
.bilan.ok{color:var(--juste)}
.bilan.ko{color:var(--faux)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="page">

  <div class="entete">
    <p class="eyebrow">Géométrie · vocabulaire de base</p>
    <p class="consigne">Glisser les étiquettes au bon endroit.</p>
  </div>

  <div class="rule"></div>

  <div class="scene" id="scene">
   <div class="boite" id="boite">
    <div class="plateau" id="stage">
     <div class="figure">
      <svg viewBox="0 0 810 725" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#151a2e">

          <!-- point A -->
          <g transform="translate(-73,-22)">
          <g stroke="#151a2e" stroke-width="2.6" stroke-linecap="round">
            <line x1="141" y1="104" x2="155" y2="118"/>
            <line x1="155" y1="104" x2="141" y2="118"/>
          </g>
          <text x="170" y="98" text-anchor="middle">A</text>
          </g>

          <!-- droite d -->
          <g transform="translate(11,-43)">
          <line x1="61" y1="218" x2="656" y2="127" stroke="#1f2340" stroke-width="3" stroke-linecap="round"/>
          <text x="574" y="113">d</text>

          </g>

          <!-- segment BC -->
          <g transform="translate(-104,-47)">
          <line x1="170" y1="337" x2="390" y2="331" stroke="#e8452c" stroke-width="3"/>
          <line x1="170" y1="328" x2="170" y2="347" stroke="#e8452c" stroke-width="3" stroke-linecap="round"/>
          <line x1="390" y1="322" x2="390" y2="341" stroke="#e8452c" stroke-width="3" stroke-linecap="round"/>
          <text x="166" y="314" text-anchor="middle">B</text>
          <text x="393" y="308" text-anchor="middle">C</text>

          </g>

          <!-- demi-droite d'origine D -->
          <g transform="translate(-65,-37)">
          <line x1="517" y1="257" x2="852" y2="320" stroke="#2fa14a" stroke-width="3" stroke-linecap="round"/>
          <line x1="519" y1="246.2" x2="515" y2="267.8" stroke="#2fa14a" stroke-width="3" stroke-linecap="round"/>
          <text x="516" y="239" text-anchor="middle">D</text>
          <g stroke="#151a2e" stroke-width="2.6" stroke-linecap="round">
            <line x1="713" y1="288" x2="727" y2="302"/>
            <line x1="727" y1="288" x2="713" y2="302"/>
          </g>
          <text x="722" y="275" text-anchor="middle">E</text>

          </g>

          <!-- droite passant par F et G -->
          <g transform="translate(243,-9)">
          <line x1="39" y1="404" x2="524" y2="457" stroke="#5b34c8" stroke-width="3" stroke-linecap="round"/>
          <g stroke="#5b34c8" stroke-width="2.6" stroke-linecap="round">
            <line x1="134" y1="408" x2="148" y2="422"/>
            <line x1="148" y1="408" x2="134" y2="422"/>
            <line x1="366" y1="433" x2="380" y2="447"/>
            <line x1="380" y1="433" x2="366" y2="447"/>
          </g>
          <text x="138" y="396" text-anchor="middle">F</text>
          <text x="371" y="422" text-anchor="middle">G</text>

          </g>

          <!-- droites sécantes d2 et d3 -->
          <g transform="translate(-5,58)">
          <line x1="94" y1="461" x2="435" y2="651" stroke="#8a8a20" stroke-width="3" stroke-linecap="round"/>
          <line x1="27" y1="588" x2="456" y2="538" stroke="#8a8a20" stroke-width="3" stroke-linecap="round"/>
          <text x="160" y="479">d₂</text>
          <text x="404" y="527">d₃</text>
          <text x="271" y="548" text-anchor="middle">O</text>
          </g>

          <!-- angle HIJ -->
          <g transform="translate(-38,-28)">
            <line x1="800" y1="660" x2="647.5" y2="572" stroke="#0f7d8f" stroke-width="3" stroke-linecap="round"/>
            <line x1="800" y1="660" x2="625.2" y2="706.8" stroke="#0f7d8f" stroke-width="3" stroke-linecap="round"/>
            <path d="M758.4 636 A48 48 0 0 0 753.6 672.4" fill="none" stroke="#0f7d8f" stroke-width="2.2"/>
            <g stroke="#151a2e" stroke-width="2.6" stroke-linecap="round">
              <line x1="663" y1="578" x2="677" y2="592"/><line x1="677" y1="578" x2="663" y2="592"/>
              <line x1="643" y1="693" x2="657" y2="707"/><line x1="657" y1="693" x2="643" y2="707"/>
            </g>
            <text x="681" y="568" text-anchor="middle">H</text>
            <text x="822" y="666" text-anchor="middle">I</text>
            <text x="652" y="723" text-anchor="middle">J</text>
          </g>
        </g>
      </svg>

      <div class="zone" data-reponse="point"       style="left:133px;top:37px;--c:var(--noir)"    role="button" tabindex="0" aria-label="Cadre du point A"><span class="verdict"></span></div>
      <div class="zone" data-reponse="droite_d"    style="left:503px;top:121px;--c:var(--noir)"    role="button" tabindex="0" aria-label="Cadre de la ligne d"><span class="verdict"></span></div>
      <div class="zone" data-reponse="demidroite"  style="left:444px;top:272px;--c:var(--vert)"   role="button" tabindex="0" aria-label="Cadre de la ligne verte d'origine D"><span class="verdict"></span></div>
      <div class="zone" data-reponse="segment"     style="left:80px;top:322px;--c:var(--rouge)"  role="button" tabindex="0" aria-label="Cadre de la ligne rouge B C"><span class="verdict"></span></div>
      <div class="zone" data-reponse="droite_fg"   style="left:296px;top:428px;--c:var(--violet)" role="button" tabindex="0" aria-label="Cadre de la ligne violette F G"><span class="verdict"></span></div>
      <div class="zone" data-reponse="angle"       style="left:505px;top:601px" role="button" tabindex="0" aria-label="Cadre de la figure verte-bleue H I J"><span class="verdict"></span></div>
      <div class="zone" data-reponse="secantes"    style="left:103px;top:659px;--c:var(--olive)"  role="button" tabindex="0" aria-label="Cadre des lignes d2 et d3"><span class="verdict"></span></div>

     </div>
     <div class="reserve" id="reserve"></div>
     <div class="actions" id="actions">
       <button id="btn-verifier">Vérifier</button>
       <button id="btn-effacer" class="secondaire">Tout effacer</button>
       <div class="bilan" id="bilan" role="status" aria-live="polite"></div>
     </div>
    </div>
   </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const MOTS = [
    {cle:"segment",   texte:"Un segment"},
    {cle:"droite_d",  texte:"La droite (d)"},
    {cle:"point",     texte:"Un point"},
    {cle:"demidroite",texte:"Une demi-droite"},
    {cle:"angle",     texte:"Un angle"},
    {cle:"droite_fg", texte:"La droite (FG)"},
    {cle:"secantes",  texte:"Droites sécantes"}
  ];

  const stage   = document.getElementById("stage");
  const scene   = document.getElementById("scene");
  const boite   = document.getElementById("boite");
  const reserve = document.getElementById("reserve");
  const bilan   = document.getElementById("bilan");
  const btnVerifier = document.getElementById("btn-verifier");
  const zones   = Array.from(document.querySelectorAll(".zone"));

  /* ---- mise à l'échelle de la scène ---- */
  let echelle = 1;
  function ajuster(){
    const dw = scene.clientWidth, dh = scene.clientHeight;
    if(dw <= 0 || dh <= 0) return;
    echelle = Math.min(1, dw / 1020, dh / 725);
    stage.style.transform = "scale(" + echelle + ")";
    boite.style.width  = Math.round(1020 * echelle) + "px";
    boite.style.height = Math.round(725 * echelle) + "px";
  }
  window.addEventListener("resize", ajuster);

  /* ---- création des étiquettes ---- */
  function melanger(t){
    const a = t.slice();
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
    return a;
  }
  function creerEtiquettes(){
    reserve.innerHTML = "";
    melanger(MOTS).forEach(function(m){
      const el = document.createElement("div");
      el.className = "etiquette";
      el.textContent = m.texte;
      el.dataset.cle = m.cle;
      el.tabIndex = 0;
      el.addEventListener("pointerdown", debutGlisse);
      el.addEventListener("keydown", function(e){
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); basculerChoix(el); }
      });
      reserve.appendChild(el);
    });
  }

  /* ---- sélection au clic ---- */
  let choisie = null;
  function basculerChoix(el){
    if(choisie === el){ choisie.classList.remove("choisie"); choisie = null; return; }
    if(choisie) choisie.classList.remove("choisie");
    choisie = el; el.classList.add("choisie");
  }
  function deselectionner(){
    if(choisie){ choisie.classList.remove("choisie"); choisie = null; }
  }

  /* ---- placement ---- */
  function placer(etiquette, zone){
    const occupante = zone.querySelector(".etiquette");
    if(occupante && occupante !== etiquette) reserve.appendChild(occupante);
    zone.appendChild(etiquette);
    majEtats();
  }
  function rendre(etiquette){ reserve.appendChild(etiquette); majEtats(); }

  function majEtats(){
    let pleines = 0;
    zones.forEach(function(z){
      const remplie = !!z.querySelector(".etiquette");
      if(remplie) pleines++;
      z.classList.toggle("pleine", remplie);
      z.classList.remove("juste","faux","vide-signalee");
      z.querySelector(".verdict").textContent = "";
    });
    btnVerifier.disabled = (pleines < zones.length);
    bilan.textContent = ""; bilan.className = "bilan";
  }

  /* ---- glisser-déposer (souris + tactile) ---- */
  let encours = null, x0 = 0, y0 = 0, bouge = false, facteur = 1;

  function debutGlisse(e){
    if(e.button !== undefined && e.button !== 0) return;
    encours = e.currentTarget;
    x0 = e.clientX; y0 = e.clientY; bouge = false;
    facteur = stage.contains(encours) ? echelle : 1;
    encours.setPointerCapture(e.pointerId);
    encours.classList.add("dragging");
    encours.addEventListener("pointermove", glisse);
    encours.addEventListener("pointerup", finGlisse);
    encours.addEventListener("pointercancel", finGlisse);
    e.preventDefault();
  }

  function glisse(e){
    if(!encours) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    if(Math.abs(dx) > 5 || Math.abs(dy) > 5) bouge = true;
    encours.style.transform = "translate(" + (dx/facteur) + "px," + (dy/facteur) + "px)";
    if(bouge) survol(e.clientX, e.clientY);
  }

  function cible(x,y){
    // le cadre le plus recouvert par l'étiquette l'emporte ; une marge élargit sa zone sensible
    const r = encours.getBoundingClientRect();
    const marge = 26 * echelle;
    let choix = null, aire = 0;
    zones.forEach(function(z){
      const q = z.getBoundingClientRect();
      const lx = Math.min(r.right, q.right + marge) - Math.max(r.left, q.left - marge);
      const ly = Math.min(r.bottom, q.bottom + marge) - Math.max(r.top, q.top - marge);
      const a = Math.max(0, lx) * Math.max(0, ly);
      if(a > aire){ aire = a; choix = z; }
    });
    if(choix) return choix;
    const q = reserve.getBoundingClientRect();
    if(r.right > q.left && r.left < q.right && r.bottom > q.top && r.top < q.bottom) return reserve;
    return null;
  }

  function survol(x,y){
    const c = cible(x,y);
    zones.forEach(z => z.classList.toggle("survol", z === c));
    reserve.classList.toggle("survol", c === reserve);
  }

  function finGlisse(e){
    if(!encours) return;
    const el = encours;
    el.removeEventListener("pointermove", glisse);
    el.removeEventListener("pointerup", finGlisse);
    el.removeEventListener("pointercancel", finGlisse);
    const c = bouge ? cible(e.clientX, e.clientY) : null;
    el.style.transform = "";
    el.classList.remove("dragging");
    zones.forEach(z => z.classList.remove("survol"));
    reserve.classList.remove("survol");
    encours = null;
    if(bouge){
      deselectionner();
      if(c && c.classList.contains("zone")) placer(el, c);
      else if(c === reserve) rendre(el);
    }else{
      basculerChoix(el);
    }
  }

  zones.forEach(function(z){
    z.addEventListener("click", function(){
      if(choisie && choisie.parentElement !== z){ placer(choisie, z); deselectionner(); return; }
      if(!choisie){
        const dedans = z.querySelector(".etiquette");
        if(dedans && !dedans.classList.contains("choisie")) return;
      }
    });
    z.addEventListener("keydown", function(e){
      if((e.key === "Enter" || e.key === " ") && choisie){ e.preventDefault(); placer(choisie, z); deselectionner(); }
    });
  });
  reserve.addEventListener("click", function(e){
    if(choisie && e.target === reserve){ rendre(choisie); deselectionner(); }
  });

  /* ---- vérification ---- */
  btnVerifier.addEventListener("click", function(){
    deselectionner();
    let justes = 0;
    zones.forEach(function(z){
      const et = z.querySelector(".etiquette");
      z.classList.remove("juste","faux","vide-signalee");
      const v = z.querySelector(".verdict");
      if(!et){ z.classList.add("vide-signalee"); v.textContent = ""; return; }
      if(et.dataset.cle === z.dataset.reponse){ z.classList.add("juste"); v.textContent = "✓"; justes++; }
      else { z.classList.add("faux"); v.textContent = "✗"; }
    });
    bilan.className = "bilan " + (justes === zones.length ? "ok" : "ko");
    if(justes === zones.length){
      bilan.innerHTML = '<span class="score">' + justes + " / " + zones.length + "</span> — tout est juste.";
    }else{
      bilan.innerHTML = '<span class="score">' + justes + " / " + zones.length + "</span> — corrigez les cadres en rouge.";
    }
  });

  document.getElementById("btn-effacer").addEventListener("click", function(){
    deselectionner();
    zones.forEach(function(z){
      const et = z.querySelector(".etiquette");
      if(et) reserve.appendChild(et);
    });
    majEtats();
  });

  function calerActions(){
    const a = document.getElementById("actions");
    const h = reserve.offsetHeight || 292;
    a.style.top = (reserve.offsetTop + h + 12) + "px";
  }

  creerEtiquettes();
  majEtats();
  ajuster();
  calerActions();
  window.addEventListener("load", calerActions);
})();
</script>
</body>
</html>
