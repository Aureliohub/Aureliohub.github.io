<!DOCTYPE html>
<html lang="fr-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calcul mental en direct</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF3F8; --card:#FFFFFF; --ink:#13233F; --muted:#5A6A80; --line:#D3DDE9;
  --ok:#14915A; --ko:#D03B3B;
  --c0:#EE6A33; --c1:#2D7FF9; --c2:#F2B705; --c3:#7A4AD6;
  --font:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;transition:background .25s}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--c1);outline-offset:3px}
h1,h2,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- éléments communs ---------- */
.eq{font-weight:800;line-height:1.15;text-align:center;white-space:nowrap}
.slot{display:inline-block;min-width:2.4em;padding:0 .2em;border:.055em dashed var(--c1);border-radius:.16em;color:var(--c1);background:rgba(45,127,249,.07);text-align:center;vertical-align:baseline;line-height:1.1}
.slot:empty::before{content:"\00a0"}
.asking .slot{animation:breathe 2.2s ease-in-out infinite}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok);color:#fff;animation:fill .35s ease-out}
@keyframes breathe{50%{background:rgba(45,127,249,.18)}}
@keyframes fill{from{transform:scale(.7)}to{transform:scale(1)}}
.o0{background:var(--c0);color:#fff}.o1{background:var(--c1);color:#fff}.o2{background:var(--c2);color:var(--ink)}.o3{background:var(--c3);color:#fff}
.shape{width:1em;height:1em;flex:none;fill:currentColor}

/* ---------- écran animateur ---------- */
.host{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;font-size:min(1.45vw,2.6vh)}
.bar{display:flex;align-items:center;gap:1.2em;padding:.6em 1.4em;color:var(--muted)}
.bar .title{font-weight:600;color:var(--ink)}
.bar .prog{margin-left:auto}
.iconbtn{border:0;background:transparent;padding:.3em;border-radius:.3em;display:flex}
.iconbtn svg{width:1.3em;height:1.3em;stroke:currentColor;fill:none;stroke-width:2}
.stage{position:relative;display:flex;flex-direction:column;padding:1em 3em 2em;min-height:0;overflow:auto}
.inner{margin:auto;width:100%;display:flex;flex-direction:column;align-items:center}
.foot{display:flex;align-items:center;gap:1em;padding:.8em 1.4em;background:var(--card);border-top:1px solid var(--line)}
.foot .sp{flex:1}
.foot:empty{display:none}
.btn{border:0;border-radius:.55em;padding:.7em 1.4em;font-weight:600;background:var(--ink);color:#fff;font-size:1.1em}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn:disabled{opacity:.35;cursor:default}
.hint{color:var(--muted)}

/* salle d'attente */
.lobby{flex-direction:row;align-items:center;justify-content:center;gap:3.5em;max-width:92em}
.qr{width:25em;height:25em;flex:none;background:#fff;padding:1.1em;border-radius:.6em;display:grid;place-items:center;color:var(--muted)}
.qr svg{width:100%;height:100%;display:block}
.join{flex:1;min-width:0;max-width:46em}
.join h1{font-size:2.6em;font-weight:800;line-height:1.1;margin-bottom:.5em}
.steps{margin:0 0 1em;padding-left:1.3em;font-size:1.35em;line-height:1.6}
.code{display:flex;align-items:baseline;gap:.5em;margin:.2em 0 .3em}
.code b{font-size:4.2em;font-weight:800;letter-spacing:.06em;line-height:1}
.url{color:var(--muted);word-break:break-all;font-size:.95em}
.err{color:var(--ko);font-weight:600;margin-top:.6em}
.ppl-h{display:flex;align-items:baseline;gap:.5em;margin:1.6em 0 .6em;font-size:1.35em}
.ppl-h b{font-size:1.4em}
.chips{display:flex;flex-wrap:wrap;gap:.5em;min-height:2.6em}
.chip{border:0;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);border-radius:999px;padding:.35em 1em;font-weight:600;font-size:1.3em;animation:pop .3s ease-out}
.chip.off{opacity:.4}
.chip:hover{box-shadow:inset 0 0 0 2px var(--ko)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.seg{display:inline-flex;border-radius:.55em;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line)}
.seg button{border:0;background:transparent;padding:.55em 1em;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* diapo */
.slide .t{font-size:6em;font-weight:700;color:var(--muted);line-height:1.1}
.slide .n{font-size:8em;font-weight:800;line-height:1;letter-spacing:-.02em}
.stage .slide .eq{font-size:3.2em;margin-top:.7em;color:var(--muted)}

/* question */
.tbar{position:absolute;left:0;top:0;height:.55em;width:100%;background:var(--c1);transform-origin:left;transition:background .3s}
.tbar.late{background:var(--c0)}
.qhead{width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:.6em;flex:none}
.clock{width:3.6em;height:3.6em;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:1.6em;font-weight:800}
.count{font-size:1.5em;color:var(--muted)}
.count b{color:var(--ink);font-size:1.4em}
.stage .eq{font-size:6.5em}
.stage .with-opts .eq{font-size:4.6em}
.qtype{font-size:1.6em;color:var(--muted);margin-bottom:.6em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.8em;width:100%;max-width:66em;margin-top:2.2em}
.opt{display:flex;align-items:center;gap:.7em;padding:.7em 1em;border-radius:.4em;font-size:2.6em;font-weight:700}
.opt.dim{opacity:.25}

/* correction */
.result{margin-top:2.2em;width:100%;max-width:60em;text-align:center}
.score-line{font-size:2em}
.score-line b{font-size:1.5em}
.split{display:flex;height:1.2em;border-radius:.6em;overflow:hidden;margin:.8em 0 1.2em;background:var(--line)}
.split i{display:block}
.split .ok{background:var(--ok)} .split .ko{background:var(--ko)}
.wrong{display:flex;flex-wrap:wrap;gap:.5em;justify-content:center;align-items:center;font-size:1.3em;color:var(--muted)}
.wrong span{background:var(--card);border-radius:.4em;padding:.2em .6em;color:var(--ko);font-weight:700}
.bars{display:flex;gap:1.2em;align-items:flex-end;justify-content:center;height:12em;margin-top:1em}
.bars .col{width:9em;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bars .v{font-size:1.8em;font-weight:800;margin-bottom:.2em}
.bars .b{width:100%;border-radius:.3em .3em 0 0;min-height:.3em}
.bars .lab{display:flex;align-items:center;gap:.4em;margin-top:.4em;font-size:1.6em;font-weight:700;padding:.2em .5em;border-radius:.3em}
.bars .col.dim .b,.bars .col.dim .lab{opacity:.3}
.tf{font-size:3em;font-weight:800;margin-top:.5em;padding:.15em .8em;border-radius:.3em;background:var(--ok);color:#fff}

/* classement */
.board{width:100%;max-width:54em;display:grid;gap:.5em}
.board h1{font-size:2.6em;font-weight:800;margin-bottom:.3em;text-align:center}
.row{display:grid;grid-template-columns:2.2em 1fr auto 4.5em;align-items:center;gap:.8em;background:var(--card);border-radius:.45em;padding:.55em 1.1em;font-size:1.9em}
.row .rk{font-weight:800;color:var(--muted)}
.row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .pt{font-weight:800}
.row .gain{color:var(--ok);font-size:.65em;text-align:right}
.row:first-of-type{box-shadow:inset .3em 0 0 var(--c2)}

/* fin */
.final h1{font-size:3em;font-weight:800;margin-bottom:1em}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:1.2em}
.pod{width:15em;text-align:center}
.pod .nm{font-size:1.9em;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pt{font-size:1.3em;color:var(--muted);margin:.2em 0 .5em}
.pod .blk{border-radius:.25em .25em 0 0;color:#fff;font-size:3em;font-weight:800;padding-top:.3em}
.pod.p1 .blk{height:3.6em;background:var(--c1)}
.pod.p2 .blk{height:2.6em;background:var(--c3)}
.pod.p3 .blk{height:1.9em;background:var(--c0)}
.menuwrap{position:relative;margin-left:-.4em}
.menu{position:absolute;left:0;top:calc(100% + .4em);z-index:20;min-width:15em;background:var(--card);border-radius:.55em;box-shadow:0 .6em 2em rgba(19,35,63,.18),0 0 0 1px var(--line);padding:.35em;display:flex;flex-direction:column}
.menu[hidden]{display:none}
.menu button{border:0;background:transparent;text-align:left;padding:.6em .8em;border-radius:.4em;font-weight:600;color:var(--ink);display:flex;flex-direction:column;gap:.1em}
.menu button small{font-weight:400;color:var(--muted);font-size:.8em}
.menu button:hover:not(:disabled){background:var(--paper)}
.menu button:disabled{opacity:.4;cursor:default}
.overlay{position:absolute;inset:0;z-index:15;background:var(--paper);overflow:auto;padding:1em 3em 3em;font-size:1.05em}
.ovbar{position:sticky;top:0;z-index:1;display:flex;gap:.6em;align-items:center;padding:.6em 0;background:var(--paper)}
.ovbar .sp{flex:1}
.overlay .report{margin:0 auto}
@media (prefers-reduced-motion:no-preference){
  .pod{opacity:0;animation:podin .9s cubic-bezier(.2,.8,.2,1) forwards}
  .pod .blk{transform-origin:bottom;transform:scaleY(0);animation:grow .9s cubic-bezier(.2,.8,.2,1) forwards}
  .pod.p3,.pod.p3 .blk{animation-delay:.4s}
  .pod.p2,.pod.p2 .blk{animation-delay:3.4s}
  .pod.p1,.pod.p1 .blk{animation-delay:6.4s}
  .pod.p1 .nm{animation:shine 1.2s ease-out 7.2s both}
}
@keyframes podin{from{opacity:0;transform:translateY(1.5em)}to{opacity:1;transform:none}}
@keyframes grow{to{transform:scaleY(1)}}
@keyframes shine{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}

/* rapport */
.report{background:var(--card);width:100%;max-width:92em;padding:2em 2.2em;border-radius:.6em;font-size:.85em;margin-top:1em;text-align:left}
.report h2{font-size:1.6em;margin:0 0 .2em}
.report h3{font-size:1.15em;margin:1.6em 0 .4em}
.report .meta{color:var(--muted)}
.wrap{overflow-x:auto}
.report table{border-collapse:collapse;width:100%}
.report th,.report td{border-bottom:1px solid var(--line);padding:.35em .55em;text-align:left;white-space:nowrap}
.report th{font-weight:600;color:var(--muted)}
.report .r{text-align:right}
.grid th,.grid td{text-align:center;padding:.3em .35em}
.grid th:first-child,.grid td:first-child{text-align:left}
.grid td.ok{background:#E2F4EA;color:#0D6A3F}
.grid td.ko{background:#FBE4E4;color:#A62B2B}
.grid td.na{color:var(--muted)}

/* ---------- téléphone ---------- */
body.is-player{font-size:18px}
#app{min-height:100%;display:flex;flex-direction:column}
body[data-tone="ok"]{background:var(--ok);color:#fff}
body[data-tone="ko"]{background:var(--ko);color:#fff}
.player{flex:1;width:100%;max-width:30em;margin:0 auto;padding:1em 1.1em 1.6em;display:flex;flex-direction:column}
.ptop{display:flex;justify-content:space-between;gap:1em;font-weight:600;opacity:.75;min-height:1.4em}
.pcard{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1em;text-align:center}
.pcard h1{font-size:1.9em;font-weight:800;line-height:1.15}
.pmuted{opacity:.7}
.big{font-size:2.3em;font-weight:800;line-height:1.1}
.pform{display:flex;flex-direction:column;gap:.8em;text-align:left}
.pform label{display:flex;flex-direction:column;gap:.3em;font-weight:600}
.pin{font:inherit;font-size:1.4em;width:100%;padding:.55em .7em;border:3px solid var(--line);border-radius:.45em;background:#fff;color:var(--ink)}
.pin.ans{font-size:2.2em;text-align:center;font-weight:800}
.pin:focus{border-color:var(--c1);outline:none}
.pbtn{width:100%;padding:.9em;font-size:1.2em;border-radius:.55em;border:0;background:var(--ink);color:#fff;font-weight:700}
.pbtn:disabled{opacity:.35}
.ptimer{height:.5em;border-radius:.25em;background:var(--line);overflow:hidden}
.ptimer i{display:block;height:100%;background:var(--c1);transform-origin:left}
.ptimer i.late{background:var(--c0)}
.pnum{opacity:.7;font-weight:600}
.peq{font-size:min(2.4em,8vw)}
.popts{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.popt{min-height:5.2em;border:0;border-radius:.55em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25em;font-size:1.5em;font-weight:800}
.popt .shape{width:.8em;height:.8em}
.popts.two .popt{min-height:7em}
.pmine{font-size:2.2em;font-weight:800}
.pts{font-size:1.6em;font-weight:700}
.banner{position:fixed;left:0;right:0;top:0;z-index:9;background:var(--c2);color:var(--ink);text-align:center;padding:.5em;font-weight:600}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

@media (max-width:900px){ .lobby{flex-direction:column;gap:1.5em} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media print{
  @page{size:A4 landscape;margin:12mm}
  body{background:#fff!important}
  .host{position:static;display:block;font-size:9.5pt}
  .bar,.foot,.noprint{display:none!important}
  .stage{display:block;padding:0;overflow:visible}
  .inner{display:block;margin:0}
  .report{max-width:none;padding:0;margin:0;font-size:9pt}
  .wrap{overflow:visible}
  tr{break-inside:avoid}
  .grid td.ok,.grid td.ko{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.slot .caret{display:inline-block;width:.06em;height:.9em;margin-left:.04em;vertical-align:-.08em;background:var(--c1);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:.45em}
.keypad button{border:0;border-radius:.5em;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);padding:.55em 0;font-size:1.6em;font-weight:700;touch-action:manipulation}
.keypad button:active{background:var(--line)}
.keypad .del svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;vertical-align:-.15em}
#pend{margin-top:.8em}
</style>
<script>
/* ============================================================
   QUESTIONS — modifiables
   Le signe _ marque la case à compléter.
   Types :
     { type: "diapo", titre: "...", nombre: "10", exemple: "43 + _ = 100", exempleR: 57 }   (exempleR = valeur affichée dans la case)
     { type: "libre", q: "4 + 6 = _", r: 10 }
     { type: "choix", q: "19 + _ = 100", choix: ["91", "81", "79", "71"], r: 1 }   (r = position de la bonne réponse, à partir de 0)
     { type: "vraifaux", q: "53 + 37 = 100", r: false }
   ============================================================ */
const TITRE = "Complément à 10, 100, 1000";
const DUREE_PAR_DEFAUT = 20; // secondes

const QUESTIONS = [
  { type: "diapo", titre: "Complément à", nombre: "10" },
  { type: "libre", q: "4 + 6 = _", r: 10 },
  { type: "libre", q: "3 + 7 = _", r: 10 },
  { type: "libre", q: "5 + _ = 10", r: 5 },
  { type: "libre", q: "4 + _ = 10", r: 6 },

  { type: "diapo", titre: "Complément à", nombre: "100", exemple: "43 + _ = 100", exempleR: 57 },
  { type: "libre", q: "15 + _ = 100", r: 85 },
  { type: "libre", q: "89 + _ = 100", r: 11 },
  { type: "libre", q: "45 + _ = 100", r: 55 },
  { type: "libre", q: "21 + _ = 100", r: 79 },
  { type: "choix", q: "19 + _ = 100", choix: ["91", "81", "79", "71"], r: 1 },
  { type: "choix", q: "13 + _ = 100", choix: ["77", "83", "87", "97"], r: 2 },
  { type: "libre", q: "65 + _ = 100", r: 35 },
  { type: "vraifaux", q: "53 + 37 = 100", r: false },
  { type: "libre", q: "77 + _ = 100", r: 23 },

  { type: "diapo", titre: "Complément à", nombre: "1000", exemple: "768 + _ = 1000", exempleR: 232 },
  { type: "libre", q: "285 + _ = 1000", r: 715 },
  { type: "libre", q: "144 + _ = 1000", r: 856 },
  { type: "vraifaux", q: "483 + 517 = 1000", r: true },
  { type: "libre", q: "560 + _ = 1000", r: 440 },
  { type: "choix", q: "634 + _ = 1000", choix: ["366", "376"], r: 0 },
  { type: "choix", q: "310 + _ = 1000", choix: ["790", "690"], r: 1 },
  { type: "libre", q: "427 + _ = 1000", r: 573 },
];
</script>
</head>

      `<button data-s="${s}" aria-pressed="${H.dur === s * 1000}">${s}\u00a0s</button>`).join('')}</div>

      <button class="btn" id="go">Lancer la partie</button>`;
    $('#seg').onclick = e => { const b = e.target.closest('button'); if (!b) return; H.dur = b.dataset.s * 1000;
      $('#seg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); };
    $('#go').onclick = advance;
    if ($('#retry')) $('#retry').onclick = () => { H.err = ''; render(); tryBroker(0); };
    renderChips();
  } else if (H.phase === 'slide') {
    stage.innerHTML = `<div class="inner slide">
      ${it.titre ? `<div class="t">${esc(it.titre)}</div>` : ''}
      ${it.nombre ? `<div class="n">${esc(it.nombre)}</div>` : ''}
      ${it.exemple ? `<div class="eq">${eqHTML(it.exemple, it.exempleR)}</div>` : ''}</div>`;
    foot.innerHTML = `<span class="sp"></span><button class="btn" id="nx">Commencer</button>`;
    $('#nx').onclick = advance;
  } else if (H.phase === 'question') {
    const opts = optList(it);
    stage.innerHTML = `<div class="tbar" id="tbar"></div>
      <div class="qhead"><div class="clock" id="clock"></div><div class="count" id="cnt"></div></div>
      <div class="inner asking${opts ? ' with-opts' : ''}">
        ${it.type === 'vraifaux' ? '<div class="qtype">Vrai ou faux ?</div>' : ''}
        <div class="eq">${eqHTML(it.q)}</div>
        ${opts ? `<div class="opts">${opts.map(o => `<div class="opt o${o.k}">${shape(o.k)}<span>${esc(o.label)}</span></div>`).join('')}</div>` : ''}
      </div>`;
    foot.innerHTML = `<span class="sp"></span><button class="btn ghost" id="nx">Arrêter le chrono</button>`;
    $('#nx').onclick = advance;
    updateCount();
  } else if (H.phase === 'reveal') {
    const ps = present(), ans = ps.filter(p => p.answers[H.idx]);
    const nOk = ans.filter(p => p.answers[H.idx].ok).length, nTot = ps.length;
    let res = '';
    const opts = optList(it);
    if (it.type === 'libre') {
      const wrong = {};
      ans.filter(p => !p.answers[H.idx].ok).forEach(p => { const v = p.answers[H.idx].v.trim() || '(vide)'; wrong[v] = (wrong[v] || 0) + 1; });
      const top = Object.entries(wrong).sort((a, b) => b[1] - a[1]).slice(0, 5);
      res = `<div class="score-line"><b>${nOk}</b> ${nOk > 1 ? 'bonnes réponses' : 'bonne réponse'} sur ${nTot}</div>
        <div class="split"><i class="ok" style="flex:${nOk}"></i><i class="ko" style="flex:${nTot - nOk}"></i></div>
        ${top.length ? `<div class="wrong">Réponses fausses : ${top.map(([v, c]) => `<span>${esc(v)}${c > 1 ? ` ×${c}` : ''}</span>`).join('')}</div>` : ''}`;
    } else {
      const counts = opts.map(o => ans.filter(p => p.answers[H.idx].v === o.value).length);
      const max = Math.max(1, ...counts);
      res = `<div class="bars">${opts.map((o, i) => `<div class="col${o.value === it.r ? '' : ' dim'}">
          <div class="v">${counts[i]}</div><div class="b o${o.k}" style="height:${counts[i] / max * 70}%"></div>
          <div class="lab o${o.k}">${shape(o.k)}${esc(o.label)}${o.value === it.r ? ' ✓' : ''}</div></div>`).join('')}</div>
        <div class="score-line" style="margin-top:1em"><b>${nOk}</b> ${nOk > 1 ? 'bonnes réponses' : 'bonne réponse'} sur ${nTot}</div>`;
    }
    const eq = it.type === 'vraifaux' ? `<div class="eq">${eqHTML(it.q)}</div><div class="tf">${it.r ? 'Vrai' : 'Faux'}</div>`
      : `<div class="eq">${eqHTML(it.q, answerText(it))}</div>`;
    stage.innerHTML = `<div class="inner${opts ? ' with-opts' : ''}">${eq}<div class="result">${res}</div></div>`;
    foot.innerHTML = `<span class="sp"></span><button class="btn" id="nx">${isLastQuestion() ? 'Voir les résultats' : 'Voir le classement'}</button>`;
    $('#nx').onclick = advance;
  } else if (H.phase === 'board') {
    const top = ranked().slice(0, 5);
    stage.innerHTML = `<div class="inner"><div class="board"><h1>Classement</h1>
      ${top.map((p, i) => { const g = p.answers[H.idx] ? p.answers[H.idx].pts : 0;
        return `<div class="row"><span class="rk">${i + 1}</span><span class="nm">${esc(p.name)}</span><span class="pt">${fmt(p.score)}</span><span class="gain">${g ? '+' + fmt(g) : ''}</span></div>`; }).join('')}
      </div></div>`;
    const nxt = ITEMS[H.idx + 1];
    foot.innerHTML = `<span class="sp"></span><button class="btn" id="nx">${nxt && nxt.type === 'diapo' ? 'Suivant' : 'Question suivante'}</button>`;
    $('#nx').onclick = advance;
  } else if (H.phase === 'final') {
    const r = ranked();
    const pod = [[r[1], 2], [r[0], 1], [r[2], 3]].filter(x => x[0]);
    stage.innerHTML = `<div class="inner final">
      <h1>Bravo à toutes et à tous !</h1>
      <div class="podium">${pod.map(([p, k]) => `<div class="pod p${k}"><div class="nm">${esc(p.name)}</div><div class="pt">${fmt(p.score)} points</div><div class="blk">${k}</div></div>`).join('')}</div>
      </div>`;
    foot.innerHTML = `<span class="hint">Rapport, PDF et CSV : menu en haut à gauche.</span><span class="sp"></span><button class="btn ghost" id="again">Nouvelle partie</button>`;
    $('#again').onclick = () => { if (confirm('Les résultats de cette partie seront effacés. Télécharge le PDF ou le CSV avant si tu veux les garder. Continuer ?')) { H.phase = 'lobby'; location.reload(); } };
  }
  updateBar();
}

/* rapport */
function now() { const d = H.startedAt || new Date(); return { d, txt: `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}` }; }
const dateTag = () => { const d = now().d; return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`; };
const slug = t => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'quiz';
const TYPE_TXT = { libre: 'Réponse libre', choix: 'Choix multiple', vraifaux: 'Vrai ou faux' };
function saveBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function showReport() {
  hideReport();
  const o = document.createElement('div');
  o.className = 'overlay'; o.id = 'ov'; o.setAttribute('role', 'dialog'); o.setAttribute('aria-label', 'Rapport');
  o.innerHTML = `<div class="ovbar"><button class="btn ghost" data-a="pdf">PDF</button><button class="btn ghost" data-a="csv">CSV</button><span class="sp"></span><button class="btn" data-a="x">Fermer</button></div>${reportHTML()}`;
  o.onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.a === 'x') hideReport(); else if (b.dataset.a === 'pdf') downloadPDF(); else downloadCSV(); };
  $('.host').appendChild(o);
}
function hideReport() { const o = $('#ov'); if (o) o.remove(); }
function reportHTML() {
  const ps = ranked(), n = ps.length;
  const avgOk = p => { const a = Object.values(p.answers).filter(x => x.ok); return a.length ? secs(a.reduce((s, x) => s + x.ms, 0) / a.length) : '—'; };
  const qrows = QIDX.map(i => {
    const it = ITEMS[i], a = ps.map(p => p.answers[i]).filter(Boolean), ok = a.filter(x => x.ok).length;
    const pct = n ? Math.round(ok / n * 100) : 0;
    return `<tr><td>${qNum(i)}</td><td>${esc(it.q.replace('_', '…'))}</td><td>${esc(answerText(it))}</td>
      <td class="r">${ok} / ${n}</td><td class="r">${pct}\u00a0%</td><td class="r">${a.length ? secs(a.reduce((s, x) => s + x.ms, 0) / a.length) : '—'}</td></tr>`;
  }).join('');
  const grid = ps.map(p => `<tr><td>${esc(p.name)}</td>${QIDX.map(i => { const a = p.answers[i];
    return a ? `<td class="${a.ok ? 'ok' : 'ko'}">${esc(givenText(ITEMS[i], a.v))}</td>` : '<td class="na">—</td>'; }).join('')}</tr>`).join('');
  return `<section class="report" id="report">
    <h2>${esc(TITRE)}</h2>
    <p class="meta">Partie du ${now().txt}. ${plural(n, 'participant', 'participants')}, ${plural(NQ, 'question', 'questions')}, ${H.dur / 1000}\u00a0s par question.</p>
    <h3>Classement</h3>
    <div class="wrap"><table><thead><tr><th>Rang</th><th>Nom</th><th class="r">Points</th><th class="r">Bonnes réponses</th><th class="r">Temps moyen (réponses justes)</th></tr></thead>
    <tbody>${ps.map((p, i) => `<tr><td>${i + 1}</td><td>${esc(p.name)}</td><td class="r">${fmt(p.score)}</td><td class="r">${okCount(p)} / ${NQ}</td><td class="r">${avgOk(p)}</td></tr>`).join('')}</tbody></table></div>
    <h3>Réussite par question</h3>
    <div class="wrap"><table><thead><tr><th>N°</th><th>Question</th><th>Réponse attendue</th><th class="r">Justes</th><th class="r">Réussite</th><th class="r">Temps moyen</th></tr></thead><tbody>${qrows}</tbody></table></div>
    <h3>Réponses données</h3>
    <div class="wrap"><table class="grid"><thead><tr><th>Nom</th>${QIDX.map(i => `<th>${qNum(i)}</th>`).join('')}</tr></thead><tbody>${grid}</tbody></table></div>
  </section>`;
}
function downloadCSV() {
  const q = v => { const t = String(v); return /[;"\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const ps = ranked(), base = [dateTag(), now().txt.split(', ')[1], TITRE, H.code, H.dur / 1000, ps.length];
  const rows = [['Date', 'Heure', 'Quiz', 'Code partie', 'Durée par question (s)', 'Participants',
    'Rang', 'Nom', 'Points total', 'Bonnes réponses', 'Questions répondues',
    'N° question', 'Type', 'Question', 'Réponse attendue', 'Réponse donnée', 'Résultat', 'Temps (s)', 'Points', 'Réussite de la classe (%)']];
  const pct = {};
  QIDX.forEach(i => { pct[i] = ps.length ? Math.round(ps.filter(p => p.answers[i] && p.answers[i].ok).length / ps.length * 100) : 0; });
  ps.forEach((p, r) => {
    const answered = Object.keys(p.answers).length;
    QIDX.forEach(i => {
      const it = ITEMS[i], a = p.answers[i];
      rows.push(base.concat([r + 1, p.name, p.score, okCount(p), answered, qNum(i), TYPE_TXT[it.type], it.q.replace('_', '…'), answerText(it),
        a ? givenText(it, a.v) : '', a ? (a.ok ? 'juste' : 'faux') : 'sans réponse', a ? (a.ms / 1000).toFixed(1) : '', a ? a.pts : 0, pct[i]]));
    });
  });
  const csv = '\ufeff' + rows.map(r => r.map(q).join(';')).join('\r\n');
  saveBlob(new Blob([csv], { type: 'text/csv;charset=utf-8' }), `quiz_${slug(TITRE)}_${dateTag()}.csv`);
}

function downloadPDF() {
  if (!window.jspdf) { alert('La bibliothèque PDF n’a pas pu être chargée.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const M = 15, W = 210 - 2 * M, ink = [19, 35, 63], muted = [90, 106, 128], line = [211, 221, 233];
  const ps = ranked(), n = ps.length;
  const avg = arr => arr.length ? secs(arr.reduce((t, x) => t + x.ms, 0) / arr.length).replace('\u00a0', ' ') : '—';
  const base = { theme: 'plain', margin: { left: M, right: M, top: M + 4, bottom: M + 4 }, styles: { font: 'helvetica', fontSize: 9, textColor: ink, cellPadding: 1.6, lineColor: line, lineWidth: { bottom: 0.2 } },
    headStyles: { fontStyle: 'bold', textColor: muted, lineWidth: { bottom: 0.4 } } };
  let y = M;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.setTextColor(...ink); doc.text(TITRE, M, y + 5);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...muted);
  doc.text(`Partie du ${now().txt}. ${plural(n, 'participant', 'participants')}, ${plural(NQ, 'question', 'questions')}, ${H.dur / 1000} s par question.`, M, y + 11);
  const h3 = (t, yy) => { doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(...ink); doc.text(t, M, yy); };
  h3('Classement', y + 21);
  doc.autoTable(Object.assign({}, base, { startY: y + 24,
    head: [['Rang', 'Nom', 'Points', 'Bonnes réponses', 'Temps moyen (justes)']],
    body: ps.map((p, i) => [i + 1, p.name, fmt(p.score), `${okCount(p)} / ${NQ}`, avg(Object.values(p.answers).filter(a => a.ok))]),
    columnStyles: { 0: { cellWidth: 14 }, 2: { halign: 'right' }, 3: { halign: 'right' }, 4: { halign: 'right' } },
    didParseCell: d => { if (d.section === 'head' && d.column.index >= 2) d.cell.styles.halign = 'right'; } }));
  y = doc.lastAutoTable.finalY + 10; if (y > 260) { doc.addPage(); y = M + 6; }
  h3('Réussite par question', y);
  doc.autoTable(Object.assign({}, base, { startY: y + 3,
    head: [['N°', 'Question', 'Réponse attendue', 'Justes', 'Réussite', 'Temps moyen']],
    body: QIDX.map(i => { const it = ITEMS[i], a = ps.map(p => p.answers[i]).filter(Boolean), ok = a.filter(x => x.ok).length;
      return [qNum(i), it.q.replace('_', '…'), answerText(it), `${ok} / ${n}`, `${n ? Math.round(ok / n * 100) : 0} %`, avg(a)]; }),
    columnStyles: { 0: { cellWidth: 10 }, 3: { halign: 'right' }, 4: { halign: 'right' }, 5: { halign: 'right' } },
    didParseCell: d => { if (d.section === 'head' && d.column.index >= 3) d.cell.styles.halign = 'right'; } }));
  y = doc.lastAutoTable.finalY + 10; if (y > 250) { doc.addPage(); y = M + 6; }
  h3('Réponses données', y);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...muted);
  doc.text('Vert : juste. Rouge : faux. Tiret : pas de réponse.', M + 42, y);
  const nameW = 30, colW = (W - nameW) / NQ;
  const cs = { 0: { cellWidth: nameW, halign: 'left' } }; QIDX.forEach((_, k) => { cs[k + 1] = { cellWidth: colW, halign: 'center' }; });
  doc.autoTable(Object.assign({}, base, { startY: y + 3,
    styles: Object.assign({}, base.styles, { fontSize: NQ > 16 ? 6.5 : 8, cellPadding: { top: 1.4, bottom: 1.4, left: 0.4, right: 0.4 }, overflow: 'ellipsize' }),
    head: [['Nom'].concat(QIDX.map(i => String(qNum(i))))],
    body: ps.map(p => [p.name].concat(QIDX.map(i => { const a = p.answers[i]; return a ? givenText(ITEMS[i], a.v) : '—'; }))),
    columnStyles: cs,
    didParseCell: d => {
      if (d.section === 'head' && d.column.index > 0) d.cell.styles.halign = 'center';
      if (d.section !== 'body' || d.column.index === 0) return;
      const a = ps[d.row.index].answers[QIDX[d.column.index - 1]];
      if (a) { d.cell.styles.fillColor = a.ok ? [226, 244, 234] : [251, 228, 228]; d.cell.styles.textColor = a.ok ? [13, 106, 63] : [166, 43, 43]; }
      else d.cell.styles.textColor = muted;
    } }));
  const pages = doc.getNumberOfPages();
  for (let k = 1; k <= pages; k++) {
    doc.setPage(k); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...muted);
    doc.text(`${TITRE}, ${dateTag()}`, M, 297 - 8);
    doc.text(`Page ${k} / ${pages}`, 210 - M, 297 - 8, { align: 'right' });
  }
  saveBlob(doc.output('blob'), `quiz_${slug(TITRE)}_${dateTag()}.pdf`);
}


/* =====================================================================
   PARTICIPANT
   ===================================================================== */
const P = { code: '', bi: 0, client: null, link: null, topic: '', pid: '', name: '', st: null, sig: '', score: 0, joined: false,
  connected: false, everConnected: false, kicked: false, mine: '', notFound: false, lastHost: 0, joinAt: 0, beat: null };
const cleanCode = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);

function startPlayer(code, bi) {
  document.body.className = 'is-player';
  P.code = code; P.bi = bi;
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); hello(); } });
  if (IN_PREVIEW) { P.blocked = true; pRender(); return; }
  if (code && code.length !== 6) {
    app.innerHTML = `<div class="player"><div class="pcard"><h1>Ancienne version de la partie</h1><p class="pmuted">L’écran affiche encore une ancienne version (code à 4 chiffres). Sur l’ordinateur, recharge la page en forçant la mise à jour (Cmd + Maj + R), puis scanne le nouveau code QR.</p></div></div>`;
    return;
  }
  const saved = code && LS.get('calcul-live:' + code);
  if (saved && saved.pid && saved.name) { P.pid = saved.pid; P.name = saved.name; P.joined = true; connect(); }
  else renderJoin();
}

function renderJoin(msg) {
  document.body.dataset.tone = '';
  app.innerHTML = `<div class="player"><div class="pcard">
    <h1>Calcul mental</h1><p class="pmuted">${esc(TITRE)}</p>
    <form class="pform" id="jf" autocomplete="off">
      ${P.code ? '' : '<label>Code de la partie<input class="pin" id="jc" maxlength="6" required autocapitalize="characters" spellcheck="false" style="text-transform:uppercase;letter-spacing:.15em"></label>'}
      <label>Ton prénom<input class="pin" id="jn" maxlength="18" required autocapitalize="words" enterkeyhint="go"></label>
      <button class="pbtn">Rejoindre</button>
      ${msg ? `<p class="err">${esc(msg)}</p>` : ''}
    </form></div></div>`;
  $('#jn').value = P.name || '';
  $('#jf').onsubmit = e => {
    e.preventDefault();
    const n = $('#jn').value.replace(/\s+/g, ' ').trim();
    if (!P.code) { const c = cleanCode($('#jc').value); if (c.length !== 6) { $('#jc').classList.add('shake'); return; } P.code = c; }
    if (!n) { $('#jn').classList.add('shake'); return; }
    P.name = n.slice(0, 18); P.pid = P.pid || rid(); P.joined = true;
    LS.set('calcul-live:' + P.code, { pid: P.pid, name: P.name });
    keepAwake();
    connect();
  };
}

function setDiag(t, fail) {
  P.diag = t; P.fail = !!fail;
  const d = $('#diag'); if (d) { d.textContent = t; d.className = fail ? 'err' : 'pmuted'; }
}

async function connect() {
  if (P.kicked || P.client) return;
  P.joinAt = Date.now();
  setDiag('Préparation…'); pRender();
  try { const g = await deriveGame(P.code); P.topic = g.topic; P.key = g.key; }
  catch (e) { P.blocked = true; pRender(); return; }
  let client;
  try { client = mqtt.connect(BROKERS[P.bi] || BROKERS[0], Object.assign({ clientId: 'clp_' + rid() }, MQ_OPTS)); }
  catch (e) { if (isBlocked(e)) { P.blocked = true; pRender(); } else setDiag(NET_MSG, true); return; }
  P.client = client;
  P.link = makeLink(client, P.key);
  setDiag('Connexion au serveur…');
  client.on('error', e => { if (isBlocked(e)) { P.blocked = true; pRender(); } });
  client.on('connect', () => {
    if (!P.everConnected) setDiag('Recherche de l’écran…');
    client.subscribe(P.topic + '/p/' + P.pid, { qos: 1 }, () => hello());
  });
  client.on('offline', () => { if (!P.everConnected) setDiag(NET_MSG, true); });
  P.link.onMessage((t, m) => onMsg(m));
  clearInterval(P.beat);
  P.beat = setInterval(() => {
    hello();
    const now = Date.now();
    if (P.everConnected) { const c = now - P.lastHost < 10000; if (c !== P.connected) { P.connected = c; setBanner(); } }
    else if (now - P.joinAt > 12000 && P.client && P.client.connected && !P.notFound) { P.notFound = true; pRender(); }
  }, 4000);
}
function hello() {
  if (P.kicked || !P.link || !P.client || !P.client.connected) return;
  P.link.send(P.topic + '/h', { t: 'hello', from: P.pid, name: P.name });
}

function setBanner() {
  let b = $('#banner');
  const show = P.everConnected && !P.connected && !P.kicked;
  if (!show) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement('div'); b.id = 'banner'; b.className = 'banner'; b.setAttribute('role', 'status'); document.body.appendChild(b); }
  b.textContent = 'Connexion perdue. Reconnexion…';
}

function onMsg(m) {
  if (!m || typeof m !== 'object') return;
  P.lastHost = Date.now();
  if (!P.connected || !P.everConnected) { P.connected = true; P.everConnected = true; P.notFound = false; setBanner(); }
  if (m.t === 'welcome') {
    if (m.name !== P.name) { P.name = m.name; LS.set('calcul-live:' + P.code, { pid: P.pid, name: P.name }); }
  } else if (m.t === 'kicked') {
    P.kicked = true; LS.del('calcul-live:' + P.code);
    clearInterval(P.beat);
    try { P.client.end(); } catch (e) {}
    setBanner();
    document.body.dataset.tone = '';
    app.innerHTML = `<div class="player"><div class="pcard"><h1>Ton nom a été retiré de la partie.</h1><p class="pmuted">Demande à l’enseignant si c’est une erreur.</p></div></div>`;
  } else if (m.t === 'state') {
    const { rem, ...rest } = m;
    const sig = JSON.stringify(rest);
    if (sig === P.sig && P.st) return; // rien de nouveau (battement de cœur)
    P.sig = sig;
    m.recv = performance.now();
    if (m.score != null) P.score = m.score;
    if (m.ph !== 'answered') P.mine = '';
    if (m.ph === 'answered' && m.mine) P.mine = m.mine;
    P.st = m;
    pRender();
  }
}


document.addEventListener('keydown', e => { if (P.keyHandler) P.keyHandler(e); });
function pShell(inner, tone) {
  P.keyHandler = null;
  document.body.dataset.tone = tone || '';
  app.innerHTML = `<div class="player"><div class="ptop"><span>${esc(P.name)}</span><span>${P.score ? fmt(P.score) + ' points' : ''}</span></div><div class="pcard">${inner}</div></div>`;
  setBanner();
}

function pRender() {
  const st = P.st;
  if (!st) {
    pShell(P.blocked ? `<h1>Connexion bloquée</h1><p class="pmuted">${esc(BLOCKED_MSG)}</p>` : P.notFound
      ? `<h1>Partie introuvable</h1><p class="pmuted">Vérifie que l’écran affiche bien la partie ${esc(P.code)}. Nouvel essai automatique…</p>`
      : `<h1>Connexion…</h1><p class="pmuted">Partie ${esc(P.code)}</p><p id="diag" class="${P.fail ? 'err' : 'pmuted'}">${esc(P.diag || '')}</p>`);
    return;
  }
  switch (st.ph) {
    case 'lobby': pShell(`<h1>C’est bon, ${esc(P.name)} !</h1><p class="pmuted">Ton prénom s’affiche à l’écran. La partie va bientôt commencer.</p>`); break;
    case 'slide': pShell(`<p class="pmuted">${esc(st.titre)}</p><div class="big">Regarde l’écran</div>`); break;
    case 'question': {
      if (st.timeout) { pShell(`<div class="big">Temps écoulé</div><p class="pmuted">Regarde l’écran.</p>`); break; }
      const head = `<div class="ptimer"><i id="pt"></i></div><p class="pnum">Question ${st.num} / ${st.total}</p>
        ${st.type === 'vraifaux' ? '<p class="pmuted">Vrai ou faux ?</p>' : ''}<div class="eq peq asking">${eqHTML(st.q)}</div>`;
      if (st.type === 'libre') {
        const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', st.kb === 'decimal' ? ',' : '', '0', 'del'];
        pShell(head + `<div class="keypad" id="kp">${keys.map(k => k === 'del'
            ? '<button class="del" data-k="del" aria-label="Effacer"><svg viewBox="0 0 24 24"><path d="M9 5h11v14H9l-6-7z"/><path d="m12 9 5 6m0-6-5 6"/></svg></button>'
            : k ? `<button data-k="${k}">${k}</button>` : '<span></span>').join('')}</div>
          <button class="pbtn" id="ok" disabled>Valider</button>`);
        const slot = $('.peq .slot');
        slot.innerHTML = '<span id="typed"></span><i class="caret"></i>';
        slot.setAttribute('aria-live', 'polite');
        let val = '';
        const show = () => { $('#typed').textContent = val; $('#ok').disabled = !val; };
        const press = k => {
          if (k === 'del') val = val.slice(0, -1);
          else if (k === ',') { if (st.kb === 'decimal' && !val.includes(',')) val = (val || '0') + ','; }
          else if (val.length < 8) val = val === '0' ? k : val + k;
          show();
        };
        $('#kp').onclick = e => { const b = e.target.closest('button'); if (b) press(b.dataset.k); };
        $('#ok').onclick = () => { if (val) answer(val, val); };
        P.keyHandler = e => {
          if (!P.st || P.st !== st) return;
          if (/^[0-9]$/.test(e.key)) press(e.key);
          else if (e.key === ',' || e.key === '.') press(',');
          else if (e.key === 'Backspace') press('del');
          else if (e.key === 'Enter' && val) answer(val, val);
        };
      } else {
        pShell(head + `<div class="popts${st.opts.length === 2 ? ' two' : ''}">${st.opts.map((o, i) =>
          `<button class="popt o${o.k}" data-i="${i}">${shape(o.k)}<span>${esc(o.label)}</span></button>`).join('')}</div>`);
        $('.popts').onclick = e => { const b = e.target.closest('button'); if (!b) return; const o = st.opts[b.dataset.i]; answer(o.value, o.label); };
      }
      pTick();
      break;
    }
    case 'answered': pShell(`<div class="big">Réponse envoyée</div>${P.mine ? `<p class="pmine">${esc(P.mine)}</p>` : ''}<p class="pmuted">Attends la fin du chrono.</p>`); break;
    case 'reveal':
      pShell(st.ok ? `<div class="big">Juste !</div><p class="pts">+${fmt(st.pts)} points</p>`
        : `<div class="big">${st.answered ? 'Pas juste' : 'Pas de réponse'}</div><p class="pts">La bonne réponse : ${esc(st.bonne)}</p>`, st.ok ? 'ok' : 'ko');
      break;
    case 'board': pShell(`<p class="pmuted">Classement</p><div class="big">Rang ${st.rank} sur ${st.n}</div><p class="pts">${fmt(st.score)} points</p>`); break;
    case 'final': pShell(`<h1>Partie terminée</h1><div class="big">Rang ${st.rank} sur ${st.n}</div><p class="pts">${fmt(st.score)} points</p><p class="pmuted">${st.ok} ${st.ok > 1 ? 'bonnes réponses' : 'bonne réponse'} sur ${st.total}</p>`); break;
  }
}

function pTick() {
  const st = P.st;
  if (!st || st.ph !== 'question' || st.timeout) return;
  const rem = st.rem - (performance.now() - st.recv);
  const bar = $('#pt');
  if (bar) { bar.style.transform = `scaleX(${Math.max(0, rem / st.dur)})`; bar.classList.toggle('late', rem < 5000); }
  if (rem <= 0) { st.timeout = true; pRender(); return; }
  requestAnimationFrame(pTick);
}

function answer(v, label) {
  const st = P.st;
  if (!st || st.ph !== 'question' || st.timeout) return;
  const ms = st.dur - st.rem + (performance.now() - st.recv);
  if (P.link) P.link.send(P.topic + '/h', { t: 'answer', from: P.pid, qi: st.qi, v, ms: Math.round(ms) });
  P.mine = label;
  P.st = { ph: 'answered', qi: st.qi };
  pRender();
}


/* ---------- démarrage ---------- */
if (typeof mqtt === 'undefined') return fatal('La bibliothèque de connexion n’a pas pu être chargée.');
if (params.has('p') || params.has('jouer')) startPlayer(cleanCode(params.get('p')), Math.min(Number(params.get('s')) || 0, BROKERS.length - 1));
else startHost();
})();
</script>
</body>
