<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Géométrie – droite perpendiculaire, droite parallèle</title>
<!-- aperçu pour Padlet et les autres sites qui affichent une vignette du lien -->
<meta property="og:title" content="Géométrie – droite perpendiculaire, droite parallèle">
<meta property="og:type" content="website">
<meta property="og:url" content="https://aureliohub.github.io/geometrie_perpendiculaire_parallele.html">
<meta property="og:image" content="https://aureliohub.github.io/apercus/geometrie_perpendiculaire_parallele.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="900">
<style>
:root{
  --encre:#1a1a1a;
  --navy:#1F3A5F;
  --bleu:#2E75B6;
  --magenta:#E6007E;
  --filet:#c9c9c9;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#e9e9e9;
  color:var(--encre);
  font-family:"Avenir Next","Avenir","Segoe UI","Trebuchet MS",Verdana,sans-serif;
  font-size:0;
  line-height:1.5;
}

/* ---------- barre d'outils (écran seulement) ---------- */
.barre{
  position:sticky;top:0;z-index:10;
  display:flex;gap:10px;align-items:center;justify-content:center;
  padding:8px;background:var(--navy);color:#fff;font-size:10pt;
}
.barre button{
  font:inherit;font-weight:600;cursor:pointer;
  background:#fff;color:var(--navy);border:none;border-radius:3px;padding:5px 12px;
}
.barre button:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
.barre span{opacity:.8}
.barre .zoom-outils{opacity:1}

/* ---------- page A4 ---------- */
.page{
  position:relative;zoom:var(--z,1);
  width:210mm;height:292mm;
  margin:14px auto;padding:12mm 12mm 18mm 20mm;
  background:#fff;
  overflow:hidden;
  font-size:11.5pt;
}
h1{font-size:15pt;font-weight:700;text-align:center;margin:0 0 1mm;letter-spacing:.1px}
.sur-titre{text-align:center;font-size:11.5pt;margin:0 0 6mm}
.etiquette-corrige{
  display:none;position:absolute;top:13mm;right:12mm;margin:0;
  color:var(--magenta);font-weight:700;font-size:11pt;letter-spacing:1px;
}
body.corrige .etiquette-corrige{display:block}
p{margin:0 0 4mm}

/* ---------- exercices ---------- */
.exo-titre{display:flex;gap:3mm;align-items:flex-start;margin-bottom:2mm}
.exo-titre .consigne{font-weight:700}
.pastille{flex:0 0 auto;width:15px;height:15px;margin-top:2px}

/* ---------- figures ---------- */
.fig{display:block;margin:2mm auto 0;width:170mm;height:auto}
.sol{visibility:hidden}
body.corrige .sol{visibility:visible}

/* ---------- pied de page ---------- */
.pied{
  position:absolute;left:20mm;right:12mm;bottom:10mm;
  padding-top:2.5mm;border-top:1px solid var(--filet);
  display:flex;justify-content:space-between;font-size:9.5pt;color:#333;
}

/* ---------- impression ---------- */

/* ---------- affichage écran : zoom façon visionneuse PDF ---------- */
.zoom-outils{display:flex;gap:6px;align-items:center}
.barre button{padding:0;width:30px;height:30px;line-height:1;display:inline-flex;align-items:center;justify-content:center;font-size:13pt}
.barre button svg{display:block}
.zoom-taux{font-variant-numeric:tabular-nums;min-width:44px;text-align:center;opacity:.9}

@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .barre{display:none}
  .page{zoom:1;margin:0;page-break-after:always}
  .page:last-of-type{page-break-after:auto}
}
@media screen{ .page{box-shadow:0 1px 6px rgba(0,0,0,.18)} }

/* ---------- corrigé : page additionnelle à l'impression ---------- */
.page-corrige{display:none}
@media print{
  body.corrige .page:not(.page-corrige) .etiquette-corrige{display:none}
  body.corrige .page:not(.page-corrige) .sol{visibility:hidden}
  .page-corrige{display:block}
  .page-corrige .etiquette-corrige{display:block}
  .page-corrige .sol{visibility:visible}
}
</style>
<style>
/* écran : agrandissement par transform plutôt que par zoom CSS — Firefox pour Android (écran i3TOUCH)
   ne dessine pas certains tracés SVG quand la page est agrandie avec zoom. L'impression n'est pas touchée. */
@media screen{
  .page{
    zoom:1 !important;
    transform:scale(var(--z,1));transform-origin:top left;
    margin-left:max(14px, calc((100% - var(--pw,210mm) * var(--z,1)) / 2));margin-right:0;
    margin-bottom:calc(14px + (var(--z,1) - 1) * var(--ph,292mm));
  }
  /* empêche la marge négative de la dernière page de sortir du body (sinon vide sous la page en réduction) */
  body{display:flow-root}
}
</style>
</head>
<body>

<div class="barre">
  <button id="btn" type="button" title="Afficher le corrigé" aria-label="Afficher le corrigé"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.3 8S3.6 3.8 8 3.8 14.7 8 14.7 8 12.4 12.2 8 12.2 1.3 8 1.3 8z"/><circle cx="8" cy="8" r="2.1"/></svg></button>
  <span class="zoom-outils">
    <button id="zoom-moins" type="button" title="Réduire">−</button>
    <span class="zoom-taux" id="zoom-taux">100 %</span>
    <button id="zoom-plus" type="button" title="Agrandir">+</button>
    <button id="zoom-page" type="button" title="Page entière" aria-label="Page entière"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="1.6" width="9.6" height="12.8" rx="1.2"/><path d="M8 4.6v6.8"/><path d="M6.3 6.3L8 4.6l1.7 1.7"/><path d="M6.3 9.7L8 11.4l1.7-1.7"/></svg></button>
    <button id="plein-ecran" type="button" title="Plein écran" aria-label="Plein écran"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6V2h4"/><path d="M10 2h4v4"/><path d="M14 10v4h-4"/><path d="M6 14H2v-4"/></svg></button>
  </span>

</div>

<section class="page" data-corrige>
  <h1>Géométrie</h1>
  <p class="sur-titre">droite perpendiculaire – droite parallèle</p>
  <p class="etiquette-corrige">CORRIGÉ</p>

  <div class="exo-titre">
    <svg class="pastille" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="2" fill="#1F3A5F"/><text x="8" y="12" text-anchor="middle" fill="#fff" font-size="11" font-weight="700" font-family="Verdana,sans-serif">1</text></svg>
    <span class="consigne">Tracer la droite (<i>g</i>) perpendiculaire à la droite (<i>d</i>) et passant par le point A.</span>
  </div>

  <svg class="fig" viewBox="0 0 170 105" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="droite d et point A">
    <line x1="12" y1="55" x2="162" y2="87" stroke="#1a1a1a" stroke-width="0.45"/>
    <text x="14" y="50" font-family="Georgia,serif" font-style="italic" font-size="5">(d)</text>
    <path d="M102.2 26.5 L106.6 30.9 M106.6 26.5 L102.2 30.9" stroke="#1a1a1a" stroke-width="0.5" fill="none"/>
    <text x="108" y="27" font-family="Georgia,serif" font-style="italic" font-size="5.5">A</text>

    <g class="sol" fill="none">
      <line x1="107.3" y1="15" x2="89.2" y2="100.1" stroke="#E6007E" stroke-width="0.55"/>
      <path d="M98.9 73.5 L99.7 69.6 L95.8 68.8" stroke="#E6007E" stroke-width="0.45"/>
      <text x="109" y="13" font-family="Georgia,serif" font-style="italic" font-size="5" fill="#E6007E" stroke="none">(g)</text>
    </g>
  </svg>

  <div class="exo-titre" style="margin-top:3mm">
    <svg class="pastille" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="2" fill="#1F3A5F"/><text x="8" y="12" text-anchor="middle" fill="#fff" font-size="11" font-weight="700" font-family="Verdana,sans-serif">2</text></svg>
    <span class="consigne">Tracer la droite (<i>f</i>) parallèle à la droite (<i>e</i>) et passant par le point B.</span>
  </div>

  <svg class="fig" viewBox="0 0 170 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="droite e et point B">
    <line x1="12" y1="48" x2="162" y2="80" stroke="#1a1a1a" stroke-width="0.45"/>
    <text x="16" y="43" font-family="Georgia,serif" font-style="italic" font-size="5">(e)</text>
    <path d="M85 29.1 L89.4 33.5 M89.4 29.1 L85 33.5" stroke="#1a1a1a" stroke-width="0.5" fill="none"/>
    <text x="90.5" y="29" font-family="Georgia,serif" font-style="italic" font-size="5.5">B</text>

    <g class="sol" fill="none">
      <line x1="18.7" y1="16.7" x2="157.6" y2="46.3" stroke="#E6007E" stroke-width="0.55"/>
      <text x="20" y="13" font-family="Georgia,serif" font-style="italic" font-size="5" fill="#E6007E" stroke="none">(f)</text>
    </g>
  </svg>

  <div class="pied"><span>Espace - utilisation des instruments de géométrie - UOG/AM</span><span>1</span></div>
</section>

<script>
document.querySelectorAll('.page[data-corrige]').forEach(p => {
  const c = p.cloneNode(true);          /* le corrigé garde le numéro de la page d'origine */
  c.removeAttribute('data-corrige');
  c.classList.add('page-corrige');
  document.body.appendChild(c);
});

const btn = document.getElementById('btn');
btn.addEventListener('click', () => {
  const on = document.body.classList.toggle('corrige');
  btn.innerHTML = on ? '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.3 8S3.6 3.8 8 3.8 14.7 8 14.7 8 12.4 12.2 8 12.2 1.3 8 1.3 8z"/><circle cx="8" cy="8" r="2.1"/><path d="M2.5 13.5L13.5 2.5"/></svg>' : '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.3 8S3.6 3.8 8 3.8 14.7 8 14.7 8 12.4 12.2 8 12.2 1.3 8 1.3 8z"/><circle cx="8" cy="8" r="2.1"/></svg>';
  btn.title = on ? 'Masquer le corrigé' : 'Afficher le corrigé';
  btn.setAttribute('aria-label', btn.title);
});
/* ---------- zoom écran (ignoré à l'impression) ---------- */
(function(){
  const racine = document.documentElement;
  const barre = document.querySelector('.barre');
  const taux = document.getElementById('zoom-taux');
  let z = 1;
  function applique(v){
    z = Math.max(0.15, Math.min(v, 4));
    racine.style.setProperty('--z', z);
    if (taux) taux.textContent = Math.round(z * 100) + ' %';
  }
  function pageEntiere(){
    racine.style.setProperty('--z', 1);
    const p = document.querySelector('.page');
    if (!p) return;
    const r = p.getBoundingClientRect();
    const hBarre = barre ? barre.getBoundingClientRect().height : 0;
    applique(Math.min((document.documentElement.clientWidth - 36) / r.width,
                      (document.documentElement.clientHeight - hBarre - 36) / r.height));
  }
  /* largeur de l'écran : page calée sur la largeur, défilement vertical.
     clientWidth et offsetWidth ne sont pas faussés si le navigateur du téléphone a dézoomé. */
  function largeur(){
    const p = document.querySelector('.page');
    if (!p) return;
    applique((document.documentElement.clientWidth - 28) / p.offsetWidth);
  }
  /* téléphone (côté court de l'écran < 600 px) : 100 % y est plus large que l'écran */
  const petitEcran = Math.min(screen.width, screen.height) < 600;
  let cale = pageEntiere;   /* recalage automatique en cours */
  /* auto = la page suit la taille de la fenêtre ; un zoom manuel coupe ce suivi
     jusqu'au prochain clic sur « Page entière ». À l'ouverture : 100 %, sans suivi. */
  let auto = false, lw = window.innerWidth, lh = window.innerHeight;
  document.getElementById('zoom-moins').addEventListener('click', () => { auto = false; applique(z / 1.15); });
  document.getElementById('zoom-plus').addEventListener('click', () => { auto = false; applique(z * 1.15); });
  document.getElementById('zoom-page').addEventListener('click', () => { auto = true; cale = pageEntiere; pageEntiere(); });
  let t; window.addEventListener('resize', () => {
    clearTimeout(t);
    t = setTimeout(() => {
      const w = window.innerWidth, h = window.innerHeight;
      /* le défilement tactile fait apparaître ou disparaître des barres du navigateur :
         seule la hauteur bouge un peu, ce n'est pas un vrai redimensionnement */
      const vrai = Math.abs(w - lw) > 2 || Math.abs(h - lh) > 150;
      lw = w; lh = h;
      if (auto && vrai) cale();
    }, 150);
  });
  /* téléphone : ouverture calée sur la largeur, et la page suit les rotations ;
     ailleurs : 100 %, sans suivi */
  if (petitEcran) { auto = true; cale = largeur; largeur(); } else applique(1);

  /* plein écran */
  /* position de lecture, mémorisée hors passage en plein écran pour être restituée ensuite */
  let posY = 0, posH = 1, tPos, transition = false;
  const notePos = () => { posY = window.scrollY; posH = document.documentElement.scrollHeight || 1; };
  window.addEventListener('scroll', () => {
    if (transition) return;
    clearTimeout(tPos); tPos = setTimeout(notePos, 200);
  }, { passive: true });

  const bpe = document.getElementById('plein-ecran');
  if (bpe) {
    bpe.addEventListener('click', () => {
      clearTimeout(tPos); notePos();
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    });
    document.addEventListener('fullscreenchange', () => {
      const plein = !!document.fullscreenElement;
      bpe.innerHTML = plein ? '<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v4H2"/><path d="M14 6h-4V2"/><path d="M10 14v-4h4"/><path d="M2 10h4v4"/></svg>' : '<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6V2h4"/><path d="M10 2h4v4"/><path d="M14 10v4h-4"/><path d="M6 14H2v-4"/></svg>';
      bpe.title = plein ? 'Quitter le plein écran' : 'Plein écran';
      /* le zoom choisi avec + ou − est conservé ; sans zoom manuel, la page se recale en page entière.
         La même portion de page reste à l'écran. */
      clearTimeout(tPos); transition = true;
      setTimeout(() => {
        lw = window.innerWidth; lh = window.innerHeight;
        if (auto) cale();
        window.scrollTo(0, posY / posH * document.documentElement.scrollHeight);
        setTimeout(() => { transition = false; notePos(); }, 400);
      }, 120);
    });
  }
})();

</script>
</body>
</html>
