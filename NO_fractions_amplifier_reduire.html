<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fractions – Amplifier, réduire</title>

<style>
:root{
  --encre:#1a1a1a;--navy:#1F3A5F;--bleu:#2E75B6;--magenta:#E6007E;--filet:#c9c9c9;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#e9e9e9;color:var(--encre);
  font-family:"Avenir Next","Avenir","Segoe UI","Trebuchet MS",Verdana,sans-serif;
  font-size:0;line-height:1.5;
}
.barre{
  position:sticky;top:0;z-index:10;
  display:flex;gap:10px;align-items:center;justify-content:center;
  padding:8px;background:var(--navy);color:#fff;font-size:10pt;
}
.barre button{font:inherit;font-weight:600;cursor:pointer;background:#fff;color:var(--navy);border:none;border-radius:3px;
  padding:0;width:30px;height:30px;line-height:1;display:inline-flex;align-items:center;justify-content:center;font-size:13pt}
.barre button svg{display:block}
.barre button:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
.barre span{opacity:.8}
.barre .zoom-outils{opacity:1}
.zoom-outils{display:flex;gap:6px;align-items:center}
.zoom-taux{font-variant-numeric:tabular-nums;min-width:44px;text-align:center;opacity:.9}

.page{
  position:relative;zoom:var(--z,1);width:210mm;height:292mm;
  margin:14px auto;padding:12mm 12mm 18mm 20mm;
  background:#fff;overflow:hidden;font-size:11.5pt;
}
h1{font-size:15pt;font-weight:700;text-align:center;margin:0 0 1mm;letter-spacing:.1px}
.sur-titre{text-align:center;font-size:11.5pt;margin:0 0 6mm}
.etiquette-corrige{
  display:none;position:absolute;top:13mm;right:12mm;margin:0;
  color:var(--magenta);font-weight:700;font-size:11pt;letter-spacing:1px;
}
body.corrige .etiquette-corrige{display:block}
p{margin:0 0 4mm}

.exo-titre{display:flex;gap:3mm;align-items:flex-start;margin-bottom:2mm}
.exo-titre .consigne{font-weight:700}
.pastille{flex:0 0 auto;width:15px;height:15px;margin-top:2px}
.item{margin:0 0 2mm 8mm}

.fig{display:block;margin:2mm auto 0;width:170mm;height:auto}
.sol{visibility:hidden}
body.corrige .sol{visibility:visible}

.pied{
  position:absolute;left:20mm;right:12mm;bottom:10mm;
  padding-top:2.5mm;border-top:1px solid var(--filet);
  display:flex;justify-content:space-between;font-size:9.5pt;color:#333;
}

@page{size:A4;margin:0}
@media print{
  html,body{width:210mm;margin:0;padding:0;overflow:hidden}
  body{background:#fff}
  .barre{display:none}
  .page{zoom:1;margin:0;page-break-after:always}
  .page:last-of-type{page-break-after:auto}
}
@media screen{ .page{box-shadow:0 1px 6px rgba(0,0,0,.18)} }

.page-corrige{display:none}
@media print{
  body.corrige .page:not(.page-corrige) .etiquette-corrige{display:none}
  body.corrige .page:not(.page-corrige) .sol{visibility:hidden}
  .page-corrige{display:block}
  .page-corrige .etiquette-corrige{display:block}
  .page-corrige .sol{visibility:visible}
}
</style>
<style>
/* propre à la fiche – fractions, quadrillages */
h1{margin-bottom:6mm}
.fig{margin-top:6mm;width:265mm}
/* format paysage */
.page{width:297mm;height:205mm}
@page{size:A4 landscape;margin:0}
@media print{html,body{width:297mm}}
/* corrigé en 2 temps à l'écran : douzièmes, puis fractions réduites */
.barre #etape{display:none;width:auto;padding:0 10px;font-size:10pt;white-space:nowrap}
body.corrige .barre #etape{display:inline-flex}
@media screen{ body[data-etape="1"] .e2{visibility:hidden} }
.fig text{font-family:"Avenir Next","Avenir","Segoe UI","Trebuchet MS",Verdana,sans-serif}
</style>
</head>

    <button id="zoom-moins" type="button" title="Réduire">−</button>

  </span>
</div>

<script>
document.querySelectorAll('.page[data-corrige]').forEach(p => {
  const c = p.cloneNode(true);          /* le corrigé garde le numéro de la page d'origine */
  c.removeAttribute('data-corrige');
  c.classList.add('page-corrige');
  document.body.appendChild(c);
});

const btn = document.getElementById('btn');
const OEIL = '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.3 8S3.6 3.8 8 3.8 14.7 8 14.7 8 12.4 12.2 8 12.2 1.3 8 1.3 8z"/><circle cx="8" cy="8" r="2.1"/></svg>';
const OEIL_B = '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.3 8S3.6 3.8 8 3.8 14.7 8 14.7 8 12.4 12.2 8 12.2 1.3 8 1.3 8z"/><circle cx="8" cy="8" r="2.1"/><path d="M2.5 13.5L13.5 2.5"/></svg>';
btn.addEventListener('click', () => {
  const on = document.body.classList.toggle('corrige');
  btn.innerHTML = on ? OEIL_B : OEIL;
  btn.title = on ? 'Masquer le corrigé' : 'Afficher le corrigé';
  btn.setAttribute('aria-label', btn.title);
});

(function(){
  const racine = document.documentElement;
  const barre = document.querySelector('.barre');
  const taux = document.getElementById('zoom-taux');
  let z = 1;
  function applique(v){
    z = Math.max(0.15, Math.min(v, 4));
    racine.style.setProperty('--z', z);
    if (taux) taux.textContent = Math.round(z * 100) + ' %';
  }
  function pageEntiere(){
    racine.style.setProperty('--z', 1);
    const p = document.querySelector('.page');
    if (!p) return;
    const r = p.getBoundingClientRect();
    const hBarre = barre ? barre.getBoundingClientRect().height : 0;
    applique(Math.min((window.innerWidth - 36) / r.width,
                      (window.innerHeight - hBarre - 36) / r.height));
  }
  /* auto = la page suit la taille de la fenêtre ; un zoom manuel coupe ce suivi
     jusqu'au prochain clic sur « Page entière » ou au passage en plein écran */
  let auto = true, lw = window.innerWidth, lh = window.innerHeight;
  document.getElementById('zoom-moins').addEventListener('click', () => { auto = false; applique(z / 1.15); });
  document.getElementById('zoom-plus').addEventListener('click', () => { auto = false; applique(z * 1.15); });
  document.getElementById('zoom-page').addEventListener('click', () => { auto = true; pageEntiere(); });
  let t; window.addEventListener('resize', () => {
    clearTimeout(t);
    t = setTimeout(() => {
      const w = window.innerWidth, h = window.innerHeight;
      /* le défilement tactile fait apparaître ou disparaître des barres du navigateur :
         seule la hauteur bouge un peu, ce n'est pas un vrai redimensionnement */
      const vrai = Math.abs(w - lw) > 2 || Math.abs(h - lh) > 150;
      lw = w; lh = h;
      if (auto && vrai) pageEntiere();
    }, 150);
  });
  pageEntiere();

  const bpe = document.getElementById('plein-ecran');
  if (bpe) {
    bpe.addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    });
    document.addEventListener('fullscreenchange', () => {
      const plein = !!document.fullscreenElement;
      bpe.innerHTML = plein
        ? '<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v4H2"/><path d="M14 6h-4V2"/><path d="M10 14v-4h4"/><path d="M2 10h4v4"/></svg>'
        : '<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6V2h4"/><path d="M10 2h4v4"/><path d="M14 10v4h-4"/><path d="M6 14H2v-4"/></svg>';
      bpe.title = plein ? 'Quitter le plein écran' : 'Plein écran';
      auto = true;
      setTimeout(() => { lw = window.innerWidth; lh = window.innerHeight; pageEntiere(); }, 120);
    });
  }
})();
</script>
<script>
/* corrigé en 2 temps (écran seulement) : 1 = douzièmes, 2 = fractions réduites ; l'impression montre tout */
(function(){
  const corps = document.body, oeil = document.getElementById('btn');
  const b = document.createElement('button');
  b.id = 'etape'; b.type = 'button';
  oeil.insertAdjacentElement('afterend', b);
  function maj(n){
    corps.dataset.etape = n;
    b.textContent = 'Étape ' + n + '/2';
    b.title = n < 2 ? 'Corrigé : afficher les fractions réduites' : 'Corrigé : revenir aux douzièmes';
    b.setAttribute('aria-label', b.title);
  }
  b.addEventListener('click', () => maj(corps.dataset.etape === '1' ? 2 : 1));
  oeil.addEventListener('click', () => maj(1));
  maj(1);
})();
</script>
