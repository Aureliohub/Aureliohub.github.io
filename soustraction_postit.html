<!doctype html>
<!--
  Note pour Claude : animation « la soustraction » (fichier autonome, aucune dépendance).
  Coquille commune aux activités : en-tête, plateau 900x560 mis à l'échelle, bouton plein écran.
  Post-it = div HTML positionné en px dans le repère du plateau ; le papier est un SVG
  (dégradé + coin replié + ombre) partageant les defs déclarés une seule fois en haut du corps.
  Glisser = déplacer la sélection ; clic sur le fond = lasso ; maj/ctrl + clic = ajouter ;
  badge + ou double-clic ou Ctrl+D = dupliquer la sélection ; badge × ou Suppr = retirer ; Ctrl+Z = annuler.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nombres et opérations - la soustraction</title>
<style>
:root{
  --papier:#f5f5f1;--encre:#151a2e;--gris:#6d7382;--trait:#d9dbe1;--bleu-fonce:#1f4fa8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--papier);color:var(--encre);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:16px;
  padding:14px 18px;height:100vh;overflow:hidden;
}
.page{max-width:1320px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.entete{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;text-align:center;min-height:34px}
.eyebrow{margin:0;font-size:13.5px;font-weight:700;letter-spacing:.16em;color:var(--gris);text-transform:uppercase}
.rule{height:1px;background:var(--trait);margin:10px 0;flex:none}
.nav{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;gap:8px}
button{
  font:inherit;font-weight:700;font-size:14px;padding:9px 12px;border-radius:9px;cursor:pointer;
  border:1px solid #b9bec9;background:#fff;color:var(--encre);
}
button:focus-visible{outline:2px solid var(--bleu-fonce);outline-offset:2px}
.plein{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center}
.plein svg{width:19px;height:19px}
.plein .sortir{display:none}
body.pleinecran .plein .entrer{display:none}
body.pleinecran .plein .sortir{display:block}

.scene{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start}
.boite{position:relative}
.plateau{position:absolute;left:0;top:0;width:900px;height:560px;transform-origin:top left}
.feuille{
  position:absolute;left:0;top:0;width:900px;height:560px;
  background:#fdfdfb;border:1px solid var(--trait);border-radius:12px;overflow:hidden;
}

/* --- post-it --- */
.postit{position:absolute;width:114px;height:113px;cursor:grab;user-select:none;touch-action:none}
.postit .papier{
  position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none;
  filter:drop-shadow(2px 4px 5px rgba(21,26,46,.30));
}
.postit.select .papier{
  filter:drop-shadow(1.6px 0 0 #1f4fa8) drop-shadow(-1.6px 0 0 #1f4fa8)
         drop-shadow(0 1.6px 0 #1f4fa8) drop-shadow(0 -1.6px 0 #1f4fa8)
         drop-shadow(2px 5px 6px rgba(21,26,46,.34));
}
.postit.glisse .papier{filter:drop-shadow(4px 9px 12px rgba(21,26,46,.32))}
.postit.select.glisse .papier{
  filter:drop-shadow(1.6px 0 0 #1f4fa8) drop-shadow(-1.6px 0 0 #1f4fa8)
         drop-shadow(0 1.6px 0 #1f4fa8) drop-shadow(0 -1.6px 0 #1f4fa8)
         drop-shadow(4px 9px 12px rgba(21,26,46,.32));
}
.postit .zone{position:absolute;left:2px;top:2px;right:2px;bottom:2px}
.postit .chiffre{
  position:absolute;left:0;top:0;right:0;bottom:0;
  display:flex;align-items:center;justify-content:center;
  padding:0 10px 10px 0;
  font-size:50px;font-weight:700;color:#4a4118;letter-spacing:-.02em;pointer-events:none;
}
.postit.glisse{cursor:grabbing}
.badge{
  position:absolute;width:26px;height:26px;border-radius:50%;
  border:1px solid #b9bec9;background:#fff;color:var(--encre);
  font-size:15px;font-weight:800;line-height:1;
  display:none;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 2px 5px rgba(21,26,46,.18);z-index:3;
}
.postit.principal .badge{display:flex}
.badge.plus{right:-10px;top:-10px}
.badge.moins{left:-10px;top:-10px}

.lasso{position:absolute;border:1.4px dashed var(--bleu-fonce);background:rgba(31,79,168,.07);border-radius:3px;pointer-events:none;z-index:4}
.outils{position:absolute;left:26px;bottom:20px;display:flex;gap:10px;z-index:5}
.outils button{width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center}
.outils button svg{width:24px;height:24px}
</style>
</head>
<body>

<div class="page">

  <div class="entete">
    <p class="eyebrow">Nombres et opérations · la soustraction</p>
    <div class="nav">
      <button id="btn-plein" class="plein" title="Plein écran" aria-label="Plein écran">
        <svg class="entrer" viewBox="0 0 24 24" fill="none" stroke="#151a2e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 3H5.5A2.5 2.5 0 0 0 3 5.5V9"/><path d="M15 3h3.5A2.5 2.5 0 0 1 21 5.5V9"/>
          <path d="M9 21H5.5A2.5 2.5 0 0 1 3 18.5V15"/><path d="M15 21h3.5a2.5 2.5 0 0 0 2.5-2.5V15"/>
        </svg>
        <svg class="sortir" viewBox="0 0 24 24" fill="none" stroke="#151a2e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 9H9V3.5"/><path d="M20.5 9H15V3.5"/><path d="M3.5 15H9v5.5"/><path d="M20.5 15H15v5.5"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="rule"></div>

  <div class="scene" id="scene">
    <div class="boite" id="boite">
      <div class="plateau" id="stage">
        <div class="feuille" id="feuille">
          <div class="outils">
            <button id="btn-reset" title="Remettre les quatre post-it en place" aria-label="Réinitialiser">
              <svg viewBox="0 0 24 24" fill="none" stroke="#151a2e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.6h-4.6"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

    historique.push({p:postits.map(o => ({...o})), s:selection.slice()});
    if(historique.length > 60) historique.shift();
  }
  function annuler(){
    const e = historique.pop();
    if(!e) return;
    postits = e.p; selection = e.s.filter(id => postits.some(o => o.id === id));
    principal = selection.length ? selection[selection.length-1] : null;
    rendre();
  }

  /* ---------- rendu ---------- */
  function papier(){
    return '<img class="papier" src="' + PAPIER + '" alt="" draggable="false">';
  }
  function rendre(){
    feuille.querySelectorAll(".postit").forEach(e => e.remove());
    postits.forEach(function(p){
      const d = document.createElement("div");
      d.className = "postit";
      d.dataset.id = p.id;
      d.style.left = p.x + "px";
      d.style.top  = p.y + "px";
      d.style.transform = "rotate(" + p.rot + "deg)";
      d.innerHTML = papier() +
        '<span class="chiffre">' + p.c + '</span>' +
        '<span class="badge plus" data-act="dupliquer" title="Dupliquer la sélection">+</span>' +
        '<span class="badge moins" data-act="retirer" title="Retirer la sélection">×</span>';
      feuille.appendChild(d);
    });
    majSelection();
  }
  function majSelection(){
    feuille.querySelectorAll(".postit").forEach(function(e){
      const id = e.dataset.id;
      e.classList.toggle("select", selection.indexOf(id) >= 0);
      e.classList.toggle("principal", id === principal);
    });
  }

  /* ---------- opérations ---------- */
  function choisis(){ return postits.filter(p => selection.indexOf(p.id) >= 0); }

  function dupliquer(){
    const lot = choisis();
    if(!lot.length) return;
    memoriser();
    const copies = lot.map(function(p){
      return {id:"p" + (++suivant), c:p.c,
              x:Math.min(LARGE - COTE + 6, p.x + 26),
              y:Math.min(HAUT - COTE + 6, p.y + 26),
              rot:+(Math.random()*5 - 2.5).toFixed(1)};
    });
    postits = postits.concat(copies);
    selection = copies.map(c => c.id);
    principal = selection[selection.length-1];
    rendre();
  }
  function retirer(){
    if(!selection.length) return;
    memoriser();
    postits = postits.filter(p => selection.indexOf(p.id) < 0);
    selection = []; principal = null;
    rendre();
  }
  function reinitialiser(){
    memoriser();
    postits = DEPART.map((d,i) => ({id:"p"+(i+1), ...d}));
    suivant = 4; selection = []; principal = null;
    rendre();
  }

  /* ---------- mise à l'échelle ---------- */
  let echelle = 1;
  function enPleinEcran(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function ajuster(){
    const dw = scene.clientWidth, dh = scene.clientHeight;
    if(dw <= 0 || dh <= 0) return;
    echelle = Math.min(enPleinEcran() ? 2 : 1, dw / LARGE, dh / HAUT);
    stage.style.transform = "scale(" + echelle + ")";
    boite.style.width  = Math.round(LARGE * echelle) + "px";
    boite.style.height = Math.round(HAUT * echelle) + "px";
  }
  window.addEventListener("resize", ajuster);

  /* ---------- déplacement et sélection ---------- */
  let prise = null, x0 = 0, y0 = 0, bases = [], bouge = false, lasso = null, lassoEl = null;

  function coord(e){
    const r = feuille.getBoundingClientRect(), k = r.width / LARGE;
    return {x:(e.clientX - r.left)/k, y:(e.clientY - r.top)/k};
  }

  feuille.addEventListener("pointerdown", function(e){
    if(e.target.closest(".outils")) return;
    const badge = e.target.closest(".badge");
    const carre = e.target.closest(".postit");

    if(badge && carre){
      if(badge.dataset.act === "dupliquer") dupliquer(); else retirer();
      e.preventDefault();
      return;
    }

    if(carre){
      const id = carre.dataset.id;
      const p = postits.find(q => q.id === id);
      if(!p) return;
      const multi = e.shiftKey || e.ctrlKey || e.metaKey;
      if(multi){
        const i = selection.indexOf(id);
        if(i >= 0) selection.splice(i, 1); else selection.push(id);
      }else if(selection.indexOf(id) < 0){
        selection = [id];
      }
      principal = selection.indexOf(id) >= 0 ? id : (selection[selection.length-1] || null);
      majSelection();
      if(selection.indexOf(id) < 0) return;          // on vient de le désélectionner

      prise = p; x0 = e.clientX; y0 = e.clientY; bouge = false;
      bases = choisis().map(q => ({p:q, x:q.x, y:q.y,
                                   el:feuille.querySelector('.postit[data-id="' + q.id + '"]')}));
      // les post-it saisis passent au premier plan
      choisis().forEach(function(q){
        postits.splice(postits.indexOf(q), 1); postits.push(q);
      });
      bases.forEach(function(b){ if(feuille.lastElementChild !== b.el) feuille.appendChild(b.el); });
      memoriser();
      carre.classList.add("glisse");
      carre.setPointerCapture(e.pointerId);
      carre.addEventListener("pointermove", glisse);
      carre.addEventListener("pointerup", fin);
      carre.addEventListener("pointercancel", fin);
      e.preventDefault();
      return;
    }

    // fond : lasso de sélection
    const p0 = coord(e);
    lasso = {x0:p0.x, y0:p0.y, x1:p0.x, y1:p0.y, ajout:(e.shiftKey || e.ctrlKey || e.metaKey)};
    if(!lasso.ajout){ selection = []; principal = null; majSelection(); }
    lassoEl = document.createElement("div");
    lassoEl.className = "lasso";
    feuille.appendChild(lassoEl);
    feuille.setPointerCapture(e.pointerId);
    feuille.addEventListener("pointermove", glisseLasso);
    feuille.addEventListener("pointerup", finLasso);
    feuille.addEventListener("pointercancel", finLasso);
    e.preventDefault();
  });

  function glisse(e){
    if(!prise) return;
    const dx = (e.clientX - x0)/echelle, dy = (e.clientY - y0)/echelle;
    if(Math.abs(dx) > 3 || Math.abs(dy) > 3) bouge = true;
    bases.forEach(function(b){
      b.p.x = Math.max(-12, Math.min(LARGE - COTE + 12, b.x + dx));
      b.p.y = Math.max(-12, Math.min(HAUT - COTE + 12, b.y + dy));
      b.el.style.left = b.p.x + "px";
      b.el.style.top  = b.p.y + "px";
    });
  }
  function fin(e){
    if(!prise) return;
    const el = e.currentTarget;
    el.removeEventListener("pointermove", glisse);
    el.removeEventListener("pointerup", fin);
    el.removeEventListener("pointercancel", fin);
    el.classList.remove("glisse");
    if(!bouge) historique.pop();           // simple clic : rien à annuler
    prise = null; bases = [];
  }

  function glisseLasso(e){
    if(!lasso) return;
    const p = coord(e);
    lasso.x1 = p.x; lasso.y1 = p.y;
    const x = Math.min(lasso.x0, lasso.x1), y = Math.min(lasso.y0, lasso.y1);
    lassoEl.style.left = x + "px"; lassoEl.style.top = y + "px";
    lassoEl.style.width  = Math.abs(lasso.x1 - lasso.x0) + "px";
    lassoEl.style.height = Math.abs(lasso.y1 - lasso.y0) + "px";
  }
  function finLasso(e){
    if(!lasso) return;
    feuille.removeEventListener("pointermove", glisseLasso);
    feuille.removeEventListener("pointerup", finLasso);
    feuille.removeEventListener("pointercancel", finLasso);
    const x = Math.min(lasso.x0, lasso.x1), y = Math.min(lasso.y0, lasso.y1);
    const w = Math.abs(lasso.x1 - lasso.x0), h = Math.abs(lasso.y1 - lasso.y0);
    if(w > 6 && h > 6){
      postits.forEach(function(p){
        const dedans = p.x < x + w && p.x + COTE > x && p.y < y + h && p.y + COTE > y;
        if(dedans && selection.indexOf(p.id) < 0) selection.push(p.id);
      });
      principal = selection.length ? selection[selection.length-1] : null;
    }
    lassoEl.remove(); lassoEl = null; lasso = null;
    majSelection();
  }

  feuille.addEventListener("dblclick", function(e){
    if(e.target.closest(".postit")) dupliquer();
  });

  document.addEventListener("keydown", function(e){
    const cmd = e.ctrlKey || e.metaKey;
    if(cmd && (e.key === "z" || e.key === "Z")){ e.preventDefault(); annuler(); }
    else if(cmd && (e.key === "d" || e.key === "D")){ e.preventDefault(); dupliquer(); }
    else if(cmd && (e.key === "a" || e.key === "A")){
      e.preventDefault();
      selection = postits.map(p => p.id);
      principal = selection[selection.length-1] || null;
      majSelection();
    }
    else if((e.key === "Backspace" || e.key === "Delete") && selection.length){ e.preventDefault(); retirer(); }
    else if(e.key === "Escape"){ selection = []; principal = null; majSelection(); }
  });

  document.getElementById("btn-reset").addEventListener("click", reinitialiser);

  const btnPlein = document.getElementById("btn-plein");
  btnPlein.addEventListener("click", function(){
    const el = document.documentElement;
    if(enPleinEcran()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  });
  function majPleinEcran(){
    document.body.classList.toggle("pleinecran", enPleinEcran());
    btnPlein.title = enPleinEcran() ? "Quitter le plein écran" : "Plein écran";
    setTimeout(ajuster, 60);
  }
  document.addEventListener("fullscreenchange", majPleinEcran);
  document.addEventListener("webkitfullscreenchange", majPleinEcran);

  postits = DEPART.map((d,i) => ({id:"p"+(i+1), ...d}));
  suivant = 4;
  rendre();
  ajuster();
})();
</script>
</body>
</html>
