<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversion d'unités</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#F7F6F2;--surface:#fff;--border:#E2E0D8;--text:#1E1D1A;--muted:#6B6A64;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:.6rem 1rem;display:flex;align-items:center;gap:10px;box-shadow:0 1px 8px rgba(0,0,0,.04);flex-shrink:0;}
.htitle{font-size:15px;font-weight:800;color:#2D6BE4;}
main{flex:1;padding:.75rem;display:flex;flex-direction:column;min-height:0;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.body{flex:1;padding:1rem;display:flex;flex-direction:column;min-height:0;overflow:auto;}

/* ── LAYOUT ── */
#layout{display:flex;align-items:flex-start;gap:14px;}
#col-val{width:220px;flex-shrink:0;display:flex;flex-direction:column;}
#btn-val{padding:6px 14px;border-radius:20px;border:1.5px solid #7BBDE0;background:#F0F7FD;color:#1E3A50;font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;cursor:pointer;align-self:flex-start;}
#val-spacer{flex-shrink:0;}
#val-list{display:flex;flex-direction:column;opacity:0;transition:opacity .4s;}
#val-list.shown{opacity:1;}
.vrow{display:flex;align-items:center;gap:5px;height:56px;flex-shrink:0;}
.vrow.locked{opacity:.3;pointer-events:none;}
.vnom{font-size:13px;font-weight:800;min-width:44px;}
.vunit{font-size:14px;font-weight:700;color:#4A6B80;min-width:28px;}
.vpastilles{display:flex;align-items:center;gap:3px;flex-wrap:nowrap;}

/* Pastilles */
.pastille{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;font-size:17px;font-weight:800;border:1.5px solid #7BBDE0;background:#F0F7FD;color:#1E3A50;cursor:grab;user-select:none;touch-action:none;flex-shrink:0;transition:opacity .2s;}
.pastille:active{cursor:grabbing;}
.pastille.used{opacity:.25;pointer-events:none;}
.pastille.ghost-clone{position:fixed;pointer-events:none;opacity:.85;z-index:9999;}

/* Tableau */
#col-tab{flex-shrink:0;display:flex;flex-direction:column;align-items:center;}
#tab-outer{position:relative;align-self:flex-start;}
#btn-conv{display:none;opacity:0;padding:5px 12px;border-radius:20px;border:1.5px solid #7BBDE0;background:#F0F7FD;color:#1E3A50;font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:opacity .4s;white-space:nowrap;position:absolute;top:0;left:calc(100% + 135px);}
#tab{position:relative;font-family:'Nunito',sans-serif;}
.trow-titre{border-radius:10px 10px 0 0;padding:8px 14px;text-align:center;background:#EAF3FB;color:#1E3A50;border:1px solid #7BBDE0;border-bottom:none;}
.trow-titre .titre-main{font-size:13px;font-weight:800;display:block;}
.trow-titre .titre-instruction{font-size:11px;font-weight:600;color:#4A6B80;display:block;margin-top:2px;opacity:1;transition:opacity .4s;}
.trow-titre .titre-instruction.hidden{opacity:0;height:0;margin:0;overflow:hidden;}
.urow{border:1px solid #7BBDE0;border-top:none;display:grid;background:#EAF3FB;}
.uc{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px;gap:2px;height:64px;}
.uc+.uc{border-left:1px solid #7BBDE0;}
.uc.extra{background:transparent;}
.ubadge{display:inline-flex;align-items:center;justify-content:center;width:48px;height:30px;border-radius:6px;font-size:12px;font-weight:800;border:1.5px solid #7BBDE0;background:#F0F7FD;color:#1E3A50;}
.unom{font-size:8px;font-weight:700;color:#4A6B80;}
.crow{border:1px solid #7BBDE0;border-top:none;display:grid;}
.crow.last{border-radius:0 0 10px 10px;overflow:hidden;}
/* Slot vide (phase 1) */
.cs{display:flex;align-items:center;justify-content:center;height:56px;background:#fff;position:relative;}
.cs+.cs{border-left:1px solid #7BBDE0;}
.cs.slot-active{background:#EAF3FB;}
.cs.slot-hover{background:#D4EAFB;outline:2px solid #7BBDE0;}
.cs.slot-ok{background:#C0DD97;}
.cs.slot-ko{background:#F7C1C1;}
/* Chiffre fixé */
.cfix{font-size:20px;font-weight:800;color:var(--text);}
/* Chiffre déposé (draggable retour) */
.cval{font-size:20px;font-weight:800;color:#1E3A50;cursor:grab;user-select:none;}
/* Zéros de conversion */
.czero{font-size:20px;font-weight:800;color:#E07B39;}

/* ── OUTIL ── */
#outil{position:absolute;display:none;z-index:20;cursor:grab;user-select:none;}
#outil-cadre{border:2.5px solid #E07B39;border-radius:7px;background:rgba(224,123,57,0.08);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#E07B39;pointer-events:none;}
#outil-queue{position:absolute;width:2.5px;background:#E07B39;border-radius:0 0 2px 2px;pointer-events:none;}

/* Colonne résultats */
#col-res{flex-shrink:0;display:flex;flex-direction:column;opacity:0;transition:opacity .4s;}
#col-res.shown{opacity:1;}
#res-spacer{flex-shrink:0;}
.rrow{display:flex;align-items:center;gap:7px;height:56px;flex-shrink:0;}
.rrow.locked{opacity:.3;pointer-events:none;}
.rarrow{font-size:11px;color:#4A6B80;}
.runit{font-size:14px;font-weight:700;color:#4A6B80;min-width:28px;}
.rfield{display:flex;align-items:center;min-height:36px;min-width:80px;border:1.5px dashed #ccc;border-radius:6px;justify-content:center;font-size:11px;color:#aaa;background:#fff;transition:border-color .2s,background .4s;}
.rfield.active{border-color:#7BBDE0;border-style:solid;}
.rdig{display:flex;align-items:center;justify-content:center;min-width:22px;height:36px;font-size:16px;font-weight:800;padding:0 2px;}
.rcomma{display:flex;align-items:center;justify-content:center;width:10px;height:36px;font-size:18px;font-weight:800;color:var(--text);padding-bottom:4px;}
.outil-unit-label{font-size:14px;font-weight:800;color:#E07B39;min-width:32px;text-align:center;}
.btn-next{padding:4px 10px;border-radius:14px;border:1.5px solid #7BBDE0;background:#F0F7FD;color:#1E3A50;font-family:'Nunito',sans-serif;font-size:10px;font-weight:700;cursor:pointer;display:none;white-space:nowrap;}
.btn-next:hover{background:#7BBDE0;color:#fff;}

/* Transitions douces phase 0 -> phase 1 */
#urow{transition:none;}
#urow .unom{opacity:0;transition:opacity .6s ease .2s;}
#urow.revealed .unom{opacity:1;}
#tab{transition:width .5s ease;}
.uc.extra{opacity:0;transition:opacity .5s ease;}
.uc.extra.revealed{opacity:1;}
.crow .cs[data-col="0"],.crow .cs[data-col="8"]{opacity:0;transition:opacity .5s ease;}
.crow .cs[data-col="0"].revealed,.crow .cs[data-col="8"].revealed{opacity:1;}

/* Phase 0 : ligne intermédiaire des badges mélangés */
#pool-row{border:1px solid #7BBDE0;border-top:none;display:none;background:#EAF3FB;transition:opacity .3s;padding:8px 4px;}
#pool-row.hiding{opacity:0;}
.pu{display:inline-flex;align-items:center;justify-content:center;
  width:48px;height:36px;border-radius:8px;font-size:13px;font-weight:800;
  border:1.5px solid #7BBDE0;background:#F0F7FD;color:#1E3A50;
  cursor:grab;user-select:none;}
.pu:active{cursor:grabbing;}
/* Cellule du pool-row */
.pool-cell{display:flex;align-items:center;justify-content:center;height:52px;}
.pool-cell+.pool-cell{border-left:1px solid #7BBDE0;}
.pool-cell.extra-pool{background:transparent;}
/* Slot unité dans urow (phase 0) */
.uc.slot-u{cursor:default;}
.uc.slot-u.hover-u{background:#D4EAFB;}
.uc.slot-u.ok-u{background:#C0DD97;}
.uc.slot-u.ko-u{background:#F7C1C1;}
.msg{text-align:center;font-size:12px;font-weight:700;min-height:14px;margin-top:12px;width:100%;}
.msg.ok{color:#3B6D11;}.msg.ko{color:#A32D2D;}
#bottom-bar{display:flex;flex-direction:column;align-items:center;margin-top:8px;}
#btn-reset{padding:5px 14px;font-size:11px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;border:1.5px solid var(--border);border-radius:20px;background:transparent;color:var(--muted);margin-top:5px;}
</style>
</head>
<body>
<header><div class="htitle">Conversion d'unités</div></header>
<main><div class="card"><div class="body">
  <div id="layout">
    <div id="col-val">
      <button id="btn-val" style="display:none;opacity:0;">Valeurs</button>
      <div id="val-spacer"></div>
      <div id="val-list"></div>
    </div>
    <div id="col-tab">
      <div id="tab-outer">
        <div id="tab">
          <div class="trow-titre"><span class="titre-main">Unités de longueur</span><span class="titre-instruction" id="phase0-hint">Place les unités dans le bon ordre dans la ligne ci-dessous</span></div>
          <div id="pool-row" style="display:none;"></div>
          <div class="urow" id="urow"></div>
          <div id="outil"><div id="outil-cadre"></div><div id="outil-queue"></div></div>
        </div>
        <button id="btn-conv">Conversion</button>
      </div>
      <div id="bottom-bar">
        <div class="msg" id="msg"></div>
        <button id="btn-reset">↺ Recommencer</button>
      </div>
    </div>
    <div id="col-res">
      <div id="res-spacer"></div>
      <div id="res-list"></div>
    </div>
  </div>
</div></div></main>
<script>
const U=['km','hm','dam','m','dm','cm','mm'];
const NOM={km:'kilomètre',hm:'hectomètre',dam:'décamètre',m:'mètre',dm:'décimètre',cm:'centimètre',mm:'millimètre'};
const EX=1, NL=6, CW=56, RH=56;
const NC=U.length+2*EX;

/* ── GÉNÉRATION ── */
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rndNZ(a,b){var v=0;while(!v)v=rnd(a,b);return v;}

function genEXS(){
  const g=ui=>EX+ui;
  var exs=[];
  (function(){ // L1: entier 2 chiffres
    var ui=rnd(2,4);var d1=rndNZ(1,9),d2=rnd(0,9);
    exs.push({s:''+d1+d2,u:U[ui],d:[{c:g(ui)-1,v:d1},{c:g(ui),v:d2}]});
  })();
  (function(){ // L2: entier 3 chiffres
    var ui=rnd(2,5);var d1=rndNZ(1,9),d2=rnd(0,9),d3=rnd(0,9);
    exs.push({s:''+d1+d2+d3,u:U[ui],d:[{c:g(ui)-2>=1?g(ui)-2:0,v:d1},{c:g(ui)-1>=1?g(ui)-1:0,v:d2},{c:g(ui),v:d3}]});
  })();
  (function(){ // L3: sort du tableau à gauche (hm)
    var ui=1;var d1=rndNZ(1,9),d2=rnd(0,9),d3=rnd(0,9);
    exs.push({s:''+d1+d2+d3,u:U[ui],d:[{c:0,v:d1},{c:1,v:d2},{c:2,v:d3}]});
  })();
  (function(){ // L4: décimal X,Y
    var ui=rnd(1,5);var d1=rndNZ(1,9),d2=rndNZ(1,9);
    exs.push({s:d1+','+d2,u:U[ui],d:[{c:g(ui),v:d1},{c:g(ui)+1,v:d2}]});
  })();
  (function(){ // L5: décimal X,YZ
    var ui=rnd(1,4);var d1=rndNZ(1,9),d2=rnd(0,9),d3=rndNZ(1,9);
    exs.push({s:d1+','+d2+d3,u:U[ui],d:[{c:g(ui),v:d1},{c:g(ui)+1,v:d2},{c:g(ui)+2,v:d3}]});
  })();
  (function(){ // L6: décimal XYZ,T
    var ui=rnd(3,5);var d1=rndNZ(1,9),d2=rnd(0,9),d3=rnd(0,9),d4=rndNZ(1,9);
    var c1=g(ui)-2>=1?g(ui)-2:0,c2=g(ui)-1>=1?g(ui)-1:0;
    exs.push({s:''+d1+d2+d3+','+d4,u:U[ui],d:[{c:c1,v:d1},{c:c2,v:d2},{c:g(ui),v:d3},{c:g(ui)+1,v:d4}]});
  })();
  return exs;
}

function pickTgt(srcUi){
  const p=U.map((_,j)=>j).filter(j=>j!==srcUi);
  return p[Math.floor(Math.random()*p.length)];
}

var EXS=genEXS();
let convIdx=0,outilCol=EX,isDrag=false,tgts=[];
let phase0Done=false;
let dragUnit=null,dragUnitOrigin=null;
let checkLineTimer=null;
let checkUnitsTimer=null;
// Phase : 1=placement pastilles, 2=conversion
let phase=1;
let lineIdx=0; // ligne active en phase 1
// Pastille en cours de drag
let dragPastille=null,dragOrigin=null,ghostEl=null;

/* ── CONVERSION ── */
function computeConv(li,tgtUi){
  const ex=EXS[li];const srcUi=U.indexOf(ex.u);
  if(tgtUi===srcUi)return null;
  const val=parseFloat(ex.s.replace(',','.'));
  const diff=tgtUi-srcUi;
  const res=val*Math.pow(10,diff);
  const str=parseFloat(res.toPrecision(8)).toString().replace('.',',');
  const srcDecCount=ex.s.includes(',')?ex.s.split(',')[1].length:0;
  const addedRight=Math.max(0,diff-srcDecCount);
  const commaPos=str.indexOf(',');const strClean=str.replace(',','');
  const total=strClean.length;const digits=[];
  strClean.split('').forEach((ch,i)=>{
    const charsBeforeComma=commaPos>=0?commaPos:total;
    const rankFromTgt=charsBeforeComma-1-i;
    const col=EX+tgtUi-rankFromTgt;
    const isZero=(ch==='0')&&(addedRight>0)&&(i>=total-addedRight);
    digits.push({col,v:ch,isZero,afterComma:commaPos>=0&&i>=commaPos});
  });
  return{str,digits,commaPos};
}

/* ── BUILD ── */
function build(){
  EXS=genEXS();
  if(checkUnitsTimer){clearTimeout(checkUnitsTimer);checkUnitsTimer=null;}
  if(checkLineTimer){clearTimeout(checkLineTimer);checkLineTimer=null;}
  const wasPhase0Done=phase0Done;
  convIdx=0;outilCol=EX;isDrag=false;tgts=[];phase=1;lineIdx=0;
  if(!wasPhase0Done)phase0Done=false; // garde phase0Done si déjà true
  dragPastille=null;dragOrigin=null;dragUnit=null;dragUnitOrigin=null;
  EXS.forEach(ex=>tgts.push(pickTgt(U.indexOf(ex.u))));

  document.getElementById('msg').textContent='';document.getElementById('msg').className='msg';
  document.getElementById('btn-conv').style.cssText='display:none;opacity:0;';
  // btn-val caché au départ - apparaît après phase 0
  document.getElementById('btn-val').style.display='none';
  document.getElementById('col-res').classList.remove('shown');
  document.getElementById('outil').style.display='none';
  document.getElementById('val-list').innerHTML='';
  document.getElementById('val-list').classList.remove('shown');
  const pr=document.getElementById('pool-row');pr.innerHTML='';pr.style.display='none';pr.classList.remove('hiding');
  document.getElementById('res-list').innerHTML='';

  if(wasPhase0Done){
    // Phase 1 : tableau 9 colonnes, bouton Valeurs visible
    buildUrow(true, true);
    buildRows(true);
    document.getElementById('urow').classList.add('revealed');
    const bv=document.getElementById('btn-val');
    bv.style.display='block';bv.style.opacity='1';bv.style.pointerEvents='auto';
  } else {
    // Phase 0 : 7 colonnes, badges mélangés
    buildUrow(false, false);
    buildRows(false);
    document.getElementById('urow').classList.remove('revealed');
    buildPoolUnites();
  }

  setTimeout(()=>{
    const crow0=document.querySelector('.crow');
    const btnVal=document.getElementById('btn-val');
    if(crow0&&btnVal){
      const spacer=Math.max(0,crow0.getBoundingClientRect().top-btnVal.getBoundingClientRect().bottom);
      document.getElementById('val-spacer').style.height=spacer+'px';
    }
  },100);
}

function buildUrow(withBadges, withExtra){
  const ur=document.getElementById('urow');
  ur.innerHTML='';
  // Phase 0 : seulement les 7 colonnes centrales (pas les extra)
  // Phase 1+ : 9 colonnes avec extra
  const cols = withExtra ? NC : U.length;
  const startCol = withExtra ? 0 : EX;
  ur.style.gridTemplateColumns=`repeat(${cols},${CW}px)`;
  for(let ci=0;ci<cols;ci++){
    const c = withExtra ? ci : ci+EX; // col réelle
    const cell=document.createElement('div');cell.className='uc';cell.dataset.col=c;
    if(c<EX||c>=EX+U.length){cell.classList.add('extra');}
    else{
      if(withBadges){
        const u=U[c-EX];
        const b=document.createElement('div');b.className='ubadge';b.textContent=u;
        const n=document.createElement('div');n.className='unom';n.textContent=NOM[u];
        cell.appendChild(b);cell.appendChild(n);
      } else {
        cell.classList.add('slot-u');
        cell.dataset.expectU=U[c-EX];
        setupUnitSlot(cell);
      }
    }
    ur.appendChild(cell);
  }
}


function buildRows(withExtra){
  const tab=document.getElementById('tab');
  tab.querySelectorAll('.crow').forEach(r=>r.remove());
  const cols=withExtra?NC:U.length;
  tab.style.width=(cols*CW+2)+'px';
  EXS.forEach((ex,i)=>{
    const row=document.createElement('div');
    row.className='crow'+(i===NL-1?' last':'');
    row.dataset.li=i;row.dataset.frozen=(i>0?'1':'');
    row.style.gridTemplateColumns=`repeat(${cols},${CW}px)`;
    for(let ci=0;ci<cols;ci++){
      const col=withExtra?ci:ci+EX;
      const s=document.createElement('div');s.className='cs';s.dataset.col=col;s.dataset.li=i;
      setupSlot(s);
      row.appendChild(s);
    }
    tab.appendChild(row);
  });
}

/* ── PHASE 0 : placement des unités ── */
function buildPoolUnites(){
  const poolRow=document.getElementById('pool-row');
  poolRow.innerHTML='';
  // Même grille que urow (7 colonnes centrales seulement)
  poolRow.style.display='flex';
  poolRow.style.justifyContent='center';
  poolRow.style.gap='8px';
  poolRow.style.flexWrap='wrap';
  // Mélanger U
  const shuffled=[...U].sort(()=>Math.random()-.5);
  for(let i=0;i<U.length;i++){
    const u=shuffled[i];
    const pu=document.createElement('div');
    pu.className='pu';pu.textContent=u;pu.dataset.u=u;
    enableUnitDrag(pu);
    poolRow.appendChild(pu);
  }
}

function enableUnitDrag(pu){
  pu.draggable=true;
  pu.addEventListener('dragstart',e=>{
    dragUnit=pu;dragUnitOrigin=pu.parentElement;
    e.dataTransfer.effectAllowed='move';
    setTimeout(()=>pu.style.opacity='0.3',0);
  });
  pu.addEventListener('dragend',()=>{
    if(pu.parentElement)pu.style.opacity='';
    dragUnit=null;dragUnitOrigin=null;
  });
  // Touch
  pu.addEventListener('touchstart',e=>{
    dragUnit=pu;dragUnitOrigin=pu.parentElement;
    const t=e.touches[0];
    ghostEl=pu.cloneNode(true);ghostEl.className='pu ghost-clone';
    ghostEl.style.cssText='position:fixed;pointer-events:none;opacity:.85;z-index:9999;width:48px;height:48px;';
    ghostEl.style.left=(t.clientX-24)+'px';ghostEl.style.top=(t.clientY-24)+'px';
    document.body.appendChild(ghostEl);pu.style.opacity='0.3';
  },{passive:true});
  pu.addEventListener('touchmove',e=>{
    e.preventDefault();const t=e.touches[0];
    if(ghostEl){ghostEl.style.left=(t.clientX-24)+'px';ghostEl.style.top=(t.clientY-24)+'px';}
    document.querySelectorAll('.uc.slot-u.hover-u').forEach(s=>s.classList.remove('hover-u'));
    const el=document.elementFromPoint(t.clientX,t.clientY);
    const sl=el&&el.closest('.uc.slot-u');
    if(sl)sl.classList.add('hover-u');
  },{passive:false});
  pu.addEventListener('touchend',e=>{
    pu.style.opacity='';
    if(ghostEl){ghostEl.remove();ghostEl=null;}
    document.querySelectorAll('.uc.slot-u.hover-u').forEach(s=>s.classList.remove('hover-u'));
    const t=e.changedTouches[0];
    const el=document.elementFromPoint(t.clientX,t.clientY);
    const sl=el&&el.closest('.uc.slot-u');
    if(sl)dropUnitOnSlot(sl);
    dragUnit=null;dragUnitOrigin=null;
  });
}

function setupUnitSlot(cell){
  cell.addEventListener('dragover',e=>{e.preventDefault();cell.classList.add('hover-u');});
  cell.addEventListener('dragleave',()=>cell.classList.remove('hover-u'));
  cell.addEventListener('drop',e=>{
    e.preventDefault();cell.classList.remove('hover-u');
    dropUnitOnSlot(cell);
  });
}

function dropUnitOnSlot(slot){
  if(!dragUnit)return;
  const u=dragUnit.dataset.u;
  const existing=slot.querySelector('.pu');

  if(existing){
    // Échange : remettre l'existing dans l'origine
    const origin=dragUnitOrigin;
    slot.removeChild(existing);
    if(origin.classList.contains('slot-u')){
      origin.innerHTML='';
      origin.classList.remove('ok-u','ko-u');
      enableUnitDrag(existing);
      origin.appendChild(existing);
    } else {
      // Retourner dans pool-row : trouver une cellule vide
      enableUnitDrag(existing);document.getElementById('pool-row').appendChild(existing);
    }
  }

  // Retirer dragUnit de son origine
  if(dragUnitOrigin.classList.contains('slot-u')){
    dragUnitOrigin.innerHTML='';
    dragUnitOrigin.classList.remove('ok-u','ko-u');
  } else {
    // Retirer du pool-row
    if(dragUnit.parentElement)dragUnit.parentElement.removeChild(dragUnit);
  }

  // Déposer dans le slot
  enableUnitDrag(dragUnit);
  slot.appendChild(dragUnit);

  // Feedback couleur
  const correct=(slot.dataset.expectU===u);
  slot.classList.remove('ok-u','ko-u');
  slot.classList.add(correct?'ok-u':'ko-u');

  dragUnit=null;dragUnitOrigin=null;
  checkAllUnits();
}

function checkAllUnits(){
  const slots=[...document.querySelectorAll('.uc.slot-u')];
  const allFilled=slots.every(s=>s.querySelector('.pu,.ubadge-placed'));
  if(!allFilled)return;
  const allOk=slots.every(s=>{
    const pu=s.querySelector('.pu');
    return pu&&pu.dataset.u===s.dataset.expectU;
  });
  if(allOk){
    checkUnitsTimer=setTimeout(()=>{
      checkUnitsTimer=null;
      // Masquer pool-row avec animation
      const pr=document.getElementById('pool-row');
      pr.classList.add('hiding');
      setTimeout(()=>{pr.style.display='none';pr.classList.remove('hiding');},300);
      // Reconstruire urow avec badges ET colonnes extra
      buildUrow(true, true);
      buildRows(true);
      phase0Done=true;
      // Animer l'apparition des noms et colonnes extra en fondu
      requestAnimationFrame(()=>{
        document.getElementById('urow').classList.add('revealed');
      const hint=document.getElementById('phase0-hint');if(hint)hint.classList.add('hidden');
        document.querySelectorAll('.uc.extra').forEach(function(el){el.classList.add('revealed');});
        document.querySelectorAll('.crow .cs[data-col="0"],.crow .cs[data-col="8"]').forEach(function(el){el.classList.add('revealed');});
      });
      // Montrer btn-val après la transition
      checkUnitsTimer=setTimeout(()=>{
        checkUnitsTimer=null;
        if(!phase0Done)return; // annulé si recommencer
        const bv=document.getElementById('btn-val');
        bv.style.display='block';bv.style.opacity='1';bv.style.pointerEvents='auto';
      },700);
    },600);
  }
}

/* ── PHASE 1 : DRAG PASTILLES ── */
function setupSlot(s){
  s.addEventListener('dragover',e=>{
    if(!isSlotTarget(s))return;
    e.preventDefault();s.classList.add('slot-hover');
  });
  s.addEventListener('dragleave',()=>s.classList.remove('slot-hover'));
  s.addEventListener('drop',e=>{
    e.preventDefault();s.classList.remove('slot-hover');
    if(!dragPastille||!isSlotTarget(s))return;
    dropOnSlot(s);
  });
}

function isSlotTarget(s){
  const li=+s.dataset.li;
  if(li!==lineIdx)return false;
  const row=document.querySelector(`.crow[data-li="${li}"]`);
  if(row&&row.dataset.frozen)return false;
  const col=+s.dataset.col;
  // Accepter toutes les colonnes valides + col 0 (extra gauche pour valeurs qui débordent)
  return col>=0 && col<EX+U.length;
}

function makePastilles(ex,liIdx){
  // Créer les pastilles dans l'ordre des chiffres du nombre
  const wrap=document.createElement('div');wrap.className='vpastilles';wrap.dataset.li=liIdx;
  const chiffres=ex.s.replace(',','').split('').map(Number);
  chiffres.forEach((v,idx)=>{
    const p=document.createElement('div');
    p.className='pastille';p.textContent=v;
    p.dataset.v=v;p.dataset.li=liIdx;p.dataset.idx=idx;
    if(liIdx>0)p.classList.add('used'); // lignes suivantes grisées
    enablePastilleDrag(p);
    wrap.appendChild(p);
    // Pas de virgule entre les pastilles
  });
  // Drop retour sur la zone pastilles
  wrap.addEventListener('dragover',e=>e.preventDefault());
  wrap.addEventListener('drop',e=>{
    e.preventDefault();
    if(dragPastille&&dragOrigin&&dragOrigin.classList.contains('cs')){
      returnPastille();
    }
  });
  return wrap;
}

function enablePastilleDrag(p){
  p.draggable=true;
  p.addEventListener('dragstart',e=>{
    if(p.classList.contains('used'))return;
    dragPastille=p;dragPastille._el=p;dragOrigin=p.parentElement;
    p._dropped=false;
    e.dataTransfer.effectAllowed='move';
    setTimeout(()=>{if(dragPastille&&!p._dropped)p.style.opacity='0.3';},0);
  });
  p.addEventListener('dragend',()=>{
    if(!p._dropped&&p.parentElement)p.style.opacity='';
    dragPastille=null;dragOrigin=null;
  });
  // Touch
  p.addEventListener('touchstart',e=>{
    if(p.classList.contains('used'))return;
    e.stopPropagation();
    dragPastille=p;dragPastille._el=p;dragOrigin=p.parentElement;
    const t=e.touches[0];
    ghostEl=p.cloneNode(true);ghostEl.className='pastille ghost-clone';
    ghostEl.style.width=p.offsetWidth+'px';ghostEl.style.height=p.offsetHeight+'px';
    ghostEl.style.left=(t.clientX-p.offsetWidth/2)+'px';
    ghostEl.style.top=(t.clientY-p.offsetHeight/2)+'px';
    document.body.appendChild(ghostEl);p.style.opacity='0.3';
  },{passive:true});
  p.addEventListener('touchmove',e=>{
    e.preventDefault();const t=e.touches[0];
    if(ghostEl){ghostEl.style.left=(t.clientX-ghostEl.offsetWidth/2)+'px';ghostEl.style.top=(t.clientY-ghostEl.offsetHeight/2)+'px';}
    // Highlight slot sous le doigt
    document.querySelectorAll('.cs.slot-hover').forEach(s=>s.classList.remove('slot-hover'));
    const el=document.elementFromPoint(t.clientX,t.clientY);
    const sl=el&&el.closest('.cs');
    if(sl&&isSlotTarget(sl))sl.classList.add('slot-hover');
  },{passive:false});
  p.addEventListener('touchend',e=>{
    p.style.opacity='';
    if(ghostEl){ghostEl.remove();ghostEl=null;}
    document.querySelectorAll('.cs.slot-hover').forEach(s=>s.classList.remove('slot-hover'));
    const t=e.changedTouches[0];
    const el=document.elementFromPoint(t.clientX,t.clientY);
    const sl=el&&el.closest('.cs');
    const zone=el&&el.closest('.vpastilles');
    if(sl&&isSlotTarget(sl))dropOnSlot(sl);
    else if(zone&&dragOrigin&&dragOrigin.classList.contains('cs'))returnPastille();
    dragPastille=null;dragOrigin=null;
  });
}

function dropOnSlot(slot){
  if(!dragPastille)return;
  const li=lineIdx;
  const physicalEl=dragPastille._el||dragPastille;
  const fromSlot=dragOrigin&&dragOrigin.classList.contains('cs');
  const existing=slot.querySelector('.pastille,.cval');

  if(existing){
    if(fromSlot){
      // Échange entre deux slots : mettre existing dans l'origine
      slot.removeChild(existing);
      dragOrigin.innerHTML='';
      dragOrigin.classList.remove('slot-ko','slot-ok');
      enableSlotCvalDrag(existing,dragOrigin);
      dragOrigin.appendChild(existing);
    } else {
      // Depuis panel vers slot occupé : renvoyer existing au panel
      slot.removeChild(existing);
      const zone=document.querySelector('.vpastilles[data-li="'+li+'"]');
      if(zone){enablePastilleDrag(existing);zone.appendChild(existing);}
      // Retirer physicalEl du panel
      if(physicalEl&&physicalEl.parentElement)physicalEl.parentElement.removeChild(physicalEl);
    }
  } else {
    // Slot vide
    if(fromSlot){
      dragOrigin.innerHTML='';
      dragOrigin.classList.remove('slot-ko','slot-ok');
    } else {
      if(physicalEl&&physicalEl.parentElement)physicalEl.parentElement.removeChild(physicalEl);
    }
  }

  enableSlotCvalDrag(physicalEl,slot);
  slot.appendChild(physicalEl);
  slot.classList.remove('slot-ko','slot-ok');
  checkLine(li);
  dragPastille=null;dragOrigin=null;
}

function returnPastille(){
  if(!dragPastille||!dragOrigin)return;
  const li=+dragPastille.dataset.li;
  if(dragOrigin.classList.contains('cs')){
    dragOrigin.innerHTML='';
    checkLine(li);
  }
  returnPastilleToZone(dragPastille,li);
  dragPastille=null;dragOrigin=null;
}

function returnPastilleToZone(p,li){
  const zone=document.querySelector(`.vpastilles[data-li="${li}"]`);
  if(!zone)return;
  // Recréer une pastille dans la zone
  const np=document.createElement('div');np.className='pastille';np.textContent=p.dataset.v||p.textContent;
  np.dataset.v=p.dataset.v||p.textContent;np.dataset.li=li;
  enablePastilleDrag(np);
  // Insérer à la bonne position (avant la virgule si nécessaire)
  zone.appendChild(np);
}

function enableSlotCvalDrag(disp,slot){
  disp.draggable=true;
  disp.style.cursor='grab';
  disp.addEventListener('dragstart',e=>{
    dragPastille=disp;dragPastille._el=disp;
    dragOrigin=slot;
    e.dataTransfer.effectAllowed='move';
    setTimeout(()=>disp.style.opacity='0.3',0);
  });
  disp.addEventListener('dragend',()=>{disp.style.opacity='';dragPastille=null;dragOrigin=null;});
  disp.addEventListener('touchstart',e=>{
    e.stopPropagation();
    dragPastille=document.createElement('div');
    dragPastille.dataset.v=disp.dataset.v;dragPastille.dataset.li=slot.dataset.li;
    dragOrigin=slot;
    const t=e.touches[0];
    ghostEl=document.createElement('div');ghostEl.className='pastille ghost-clone';
    ghostEl.textContent=disp.dataset.v;
    ghostEl.style.width='36px';ghostEl.style.height='36px';
    ghostEl.style.left=(t.clientX-18)+'px';ghostEl.style.top=(t.clientY-18)+'px';
    document.body.appendChild(ghostEl);disp.style.opacity='0.3';
  },{passive:true});
  disp.addEventListener('touchmove',e=>{
    e.preventDefault();const t=e.touches[0];
    if(ghostEl){ghostEl.style.left=(t.clientX-18)+'px';ghostEl.style.top=(t.clientY-18)+'px';}
    document.querySelectorAll('.cs.slot-hover').forEach(s=>s.classList.remove('slot-hover'));
    const el=document.elementFromPoint(t.clientX,t.clientY);
    const sl=el&&el.closest('.cs');
    if(sl&&isSlotTarget(sl))sl.classList.add('slot-hover');
  },{passive:false});
  disp.addEventListener('touchend',e=>{
    disp.style.opacity='';
    if(ghostEl){ghostEl.remove();ghostEl=null;}
    document.querySelectorAll('.cs.slot-hover').forEach(s=>s.classList.remove('slot-hover'));
    const t=e.changedTouches[0];
    const el=document.elementFromPoint(t.clientX,t.clientY);
    const sl=el&&el.closest('.cs');
    const zone=el&&el.closest('.vpastilles');
    if(sl&&isSlotTarget(sl))dropOnSlot(sl);
    else if(zone){slot.innerHTML='';returnPastilleToZone(dragPastille,+dragPastille.dataset.li);checkLine(lineIdx);}
    else{slot.innerHTML='';checkLine(lineIdx);}
    dragPastille=null;dragOrigin=null;
  });
}

function checkLine(li){
  const ex=EXS[li];
  const row=document.querySelector(`.crow[data-li="${li}"]`);
  if(!row)return;

  // Colorier chaque slot rempli (vert si bon chiffre+bonne case, rouge sinon)
  // D'abord effacer toutes les couleurs
  row.querySelectorAll('.cs').forEach(s=>s.classList.remove('slot-ok','slot-ko'));

  // Colorier les slots remplis
  let allCorrect=true, countFilled=0;
  row.querySelectorAll('.cs').forEach(s=>{
    const cval=s.querySelector('.pastille,.cval');
    if(!cval)return;
    countFilled++;
    const col=+s.dataset.col;
    const expectedDigit=ex.d.find(d=>d.c===col);
    const placedVal=parseInt(cval.dataset.v||cval.textContent);
    if(expectedDigit&&placedVal===expectedDigit.v){
      s.classList.add('slot-ok');
    } else {
      s.classList.add('slot-ko');
      allCorrect=false;
    }
  });

  // Vérifier si tous les slots requis sont remplis et corrects
  const requiredFilled=ex.d.every(d=>{
    const s=row.querySelector(`.cs[data-col="${d.c}"]`);
    return s&&s.querySelector('.pastille,.cval');
  });

  // Compter les pastilles hors ex.d (mauvaises cases)
  let outsideCount=0;
  row.querySelectorAll('.cs').forEach(s=>{
    if(!s.querySelector('.pastille,.cval'))return;
    const col=+s.dataset.col;
    if(!ex.d.some(d=>d.c===col))outsideCount++;
  });

  // Annuler tout timer précédent
  if(checkLineTimer)clearTimeout(checkLineTimer);
  if(requiredFilled&&allCorrect&&countFilled===ex.d.length&&outsideCount===0){
    // Tout correct et aucune pastille hors place : figer après délai
    checkLineTimer=setTimeout(()=>{
      ex.d.forEach(d=>{
        const s=row.querySelector(`.cs[data-col="${d.c}"]`);
        s.innerHTML='';
        const f=document.createElement('span');f.className='cfix';f.textContent=d.v;f.dataset.v=d.v;
        s.appendChild(f);s.classList.remove('slot-ok','slot-ko');
      });
      const next=li+1;
      if(next<NL){
        lineIdx=next;
        const nextRow=document.querySelector(`.crow[data-li="${next}"]`);
        if(nextRow)nextRow.dataset.frozen='';
        const zone=document.querySelector(`.vpastilles[data-li="${next}"]`);
        if(zone)zone.querySelectorAll('.pastille').forEach(p=>p.classList.remove('used'));
        document.querySelector(`.vrow[data-li="${next}"]`)?.classList.remove('locked');
      } else {
        showBtnConv();
      }
      checkLineTimer=null;
    },600);
  }
}

function showBtnConv(){
  const bc=document.getElementById('btn-conv');
  bc.style.display='block';
  requestAnimationFrame(()=>requestAnimationFrame(()=>bc.style.opacity='1'));
}

/* ── BTN VALEURS ── */
document.getElementById('btn-val').addEventListener('click',()=>{
  document.getElementById('btn-val').style.opacity='0.4';
  document.getElementById('btn-val').style.pointerEvents='none';
  showValList();
});

function showValList(){
  const vl=document.getElementById('val-list');vl.innerHTML='';
  EXS.forEach((ex,i)=>{
    const row=document.createElement('div');
    row.className='vrow'+(i>0?' locked':'');row.dataset.li=i;
    const sn=document.createElement('span');sn.className='vnom';sn.textContent=ex.s;
    const su=document.createElement('span');su.className='vunit';su.textContent=ex.u;
    const pastilles=makePastilles(ex,i);
    row.appendChild(sn);row.appendChild(su);row.appendChild(pastilles);
    vl.appendChild(row);
  });
  requestAnimationFrame(()=>requestAnimationFrame(()=>vl.classList.add('shown')));
  setTimeout(()=>{
    const crow0=document.querySelector('.crow');
    const btnVal=document.getElementById('btn-val');
    if(crow0&&btnVal){
      const spacer=Math.max(0,crow0.getBoundingClientRect().top-btnVal.getBoundingClientRect().bottom);
      document.getElementById('val-spacer').style.height=spacer+'px';
    }
  },50);
};

/* ── BTN CONVERSION ── */
document.getElementById('btn-conv').addEventListener('click',()=>{
  if(phase===2)return;phase=2;
  const bc=document.getElementById('btn-conv');
  bc.style.opacity='0.4';bc.style.pointerEvents='none';
  buildResList();
  document.getElementById('col-res').classList.add('shown');
  requestAnimationFrame(()=>{
    const crow0=document.querySelector('.crow');
    const colRes=document.getElementById('col-res');
    if(crow0&&colRes){
      const needed=crow0.getBoundingClientRect().top-colRes.getBoundingClientRect().top;
      document.getElementById('res-spacer').style.height=Math.max(0,needed)+'px';
    }
    document.getElementById('outil').style.display='block';
    posOutil(EX+U.indexOf(EXS[convIdx].u),convIdx);
    setupDrag();
  });
});

/* ── RÉSULTATS ── */
function buildResList(){
  const rl=document.getElementById('res-list');rl.innerHTML='';
  EXS.forEach((ex,i)=>{
    const row=document.createElement('div');
    row.className='rrow'+(i>0?' locked':'');row.dataset.li=i;
    const arr=document.createElement('span');arr.className='rarrow';arr.textContent='→';
    const usp=document.createElement('span');usp.className='runit';usp.textContent=U[tgts[i]];
    const field=document.createElement('div');field.className='rfield';field.id='rf'+i;field.textContent='—';
    const btn=document.createElement('button');btn.className='btn-next';btn.textContent='Valider';btn.dataset.li=i;
    btn.addEventListener('click',()=>validateLine(i));
    const oulabel=document.createElement('span');oulabel.className='outil-unit-label';oulabel.id='oul'+i;
    row.append(arr,usp,field,oulabel,btn);rl.appendChild(row);
  });
}

/* ── OUTIL ── */
function posOutil(col,li){
  const ur=document.getElementById('urow');
  const tab=document.getElementById('tab');
  const cells=[...ur.querySelectorAll('.uc')];
  const cell=cells[col];if(!cell)return;
  const tabRect=tab.getBoundingClientRect();
  const cRect=cell.getBoundingClientRect();
  const cW=cRect.width,cH=cRect.height;
  const ou=document.getElementById('outil');
  ou.style.left=(cRect.left-tabRect.left)+'px';
  ou.style.top=(cRect.top-tabRect.top)+'px';
  const cadre=document.getElementById('outil-cadre');
  cadre.style.width=cW+'px';cadre.style.height=cH+'px';cadre.textContent='';
  const queue=document.getElementById('outil-queue');
  const border=2.5;
  queue.style.width=border+'px';
  queue.style.left=(cW-border)+'px';
  queue.style.top=(cH-2)+'px';
  queue.style.height=(2+(li+1)*RH)+'px';
  outilCol=col;
}

function setupDrag(){
  const ou=document.getElementById('outil');
  const ur=document.getElementById('urow');
  const cells=[...ur.querySelectorAll('.uc')];
  const nou=ou.cloneNode(true);ou.parentNode.replaceChild(nou,ou);
  const ot=document.getElementById('outil');
  isDrag=false;
  const nearestCol=cx=>{
    let best=outilCol,bestD=Infinity;
    cells.forEach((c,i)=>{if(c.classList.contains('extra'))return;
      const r=c.getBoundingClientRect();const mid=(r.left+r.right)/2;const d=Math.abs(cx-mid);
      if(d<bestD){bestD=d;best=i;}});return best;};
  const onMove=cx=>{const col=nearestCol(cx);if(col!==outilCol){posOutil(col,convIdx);updateLine(convIdx,col);}};
  ot.addEventListener('mousedown',e=>{isDrag=true;e.preventDefault();ot.style.cursor='grabbing';});
  document.addEventListener('mousemove',e=>{if(isDrag)onMove(e.clientX);});
  document.addEventListener('mouseup',()=>{if(isDrag){isDrag=false;ot.style.cursor='grab';}});
  ot.addEventListener('touchstart',e=>{isDrag=true;e.preventDefault();},{passive:false});
  ot.addEventListener('touchmove',e=>{e.preventDefault();if(isDrag)onMove(e.touches[0].clientX);},{passive:false});
  ot.addEventListener('touchend',()=>{isDrag=false;});
}

function updateLine(li,tgtCol){
  const srcUi=U.indexOf(EXS[li].u);const srcCol=EX+srcUi;
  document.querySelectorAll(`.cs[data-li="${li}"] .czero`).forEach(z=>z.remove());
  if(tgtCol===srcCol){
    const f=document.getElementById('rf'+li);
    f.className='rfield';f.innerHTML='';f.textContent='—';
    document.querySelector(`.btn-next[data-li="${li}"]`).style.display='none';
    const oul=document.getElementById('oul'+li);if(oul)oul.textContent='';return;
  }
  const tgtUi=tgtCol-EX;const conv=computeConv(li,tgtUi);if(!conv)return;
  if(tgtUi<srcUi){
    for(let col=tgtCol+1;col<srcCol;col++){
      const slot=document.querySelector(`.cs[data-li="${li}"][data-col="${col}"]`);
      if(!slot||slot.querySelector('.cfix'))continue;
      const sp=document.createElement('span');sp.className='czero';sp.textContent='0';slot.appendChild(sp);
    }
    if(conv.str.startsWith('0,')){
      const slotTgt=document.querySelector(`.cs[data-li="${li}"][data-col="${tgtCol}"]`);
      if(slotTgt&&!slotTgt.querySelector('.cfix')&&!slotTgt.querySelector('.czero')){
        const sp=document.createElement('span');sp.className='czero';sp.textContent='0';slotTgt.appendChild(sp);
      }
    }
  } else {
    conv.digits.forEach(d=>{
      if(!d.isZero)return;
      const slot=document.querySelector(`.cs[data-li="${li}"][data-col="${d.col}"]`);
      if(!slot||slot.querySelector('.cfix'))return;
      const sp=document.createElement('span');sp.className='czero';sp.textContent='0';slot.appendChild(sp);
    });
  }
  const f=document.getElementById('rf'+li);
  f.className='rfield active';f.innerHTML='';
  conv.str.split('').forEach(ch=>{
    if(ch===','){const cm=document.createElement('div');cm.className='rcomma';cm.textContent=',';f.appendChild(cm);}
    else{const dg=document.createElement('div');dg.className='rdig';dg.textContent=ch;f.appendChild(dg);}
  });
  document.querySelector(`.btn-next[data-li="${li}"]`).style.display='block';
  const oul=document.getElementById('oul'+li);
  if(oul)oul.textContent=(tgtCol>=EX&&tgtCol<EX+U.length)?U[tgtCol-EX]:'';
}

function validateLine(li){
  const expectedCol=EX+tgts[li];
  const field=document.getElementById('rf'+li);
  if(outilCol!==expectedCol){
    if(field){field.style.borderColor='#E05555';field.style.background='#FEF0F0';}
    setTimeout(()=>{if(field){field.style.borderColor='#7BBDE0';field.style.background='#fff';}},1000);
    return;
  }
  if(field){field.style.borderColor='#5BAD5B';field.style.background='#F0FEF0';}
  setTimeout(()=>{
    document.querySelectorAll(`.cs[data-li="${li}"] .czero`).forEach(z=>z.remove());
    document.querySelector(`.btn-next[data-li="${li}"]`).style.display='none';
    const next=li+1;
    if(next<NL){
      convIdx=next;
      document.querySelector(`.rrow[data-li="${next}"]`)?.classList.remove('locked');
      posOutil(EX+U.indexOf(EXS[next].u),next);
      setupDrag();
    } else {
      document.getElementById('outil').style.display='none';
      document.getElementById('msg').textContent='Toutes les conversions sont correctes !';
      document.getElementById('msg').className='msg ok';
    }
  },600);
}

document.getElementById('btn-reset').addEventListener('click',build);
build();
