<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Test zoom v2</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;touch-action:none;background:#f5f4f0;font-family:sans-serif;}
  #zone{margin:20px;height:200px;background:#e8f4e8;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#2d5a2d;border:2px solid #3B6D11;border-radius:12px;touch-action:none;user-select:none;}
  #log{margin:0 20px;font-size:12px;color:#333;height:220px;overflow-y:auto;background:#fff;border:1px solid #ddd;border-radius:8px;padding:8px;}
  h2{padding:12px 20px 6px;font-size:14px;color:#444;}
</style>
</head>
<body>
<div id="zone">Pinch ici avec 2 doigts</div>
<h2>Log :</h2>
<div id="log">En attente...</div>
<script>
const log=document.getElementById('log');
function L(msg){
  const d=document.createElement('div');
  d.textContent=new Date().toLocaleTimeString()+' — '+msg;
  log.prepend(d);
}

// ── Méthode A : bloquer tous les events multi-touch ──
document.addEventListener('touchstart', e=>{
  if(e.touches.length>1){e.preventDefault();L('touchstart bloqué');}
},{passive:false});
document.addEventListener('touchmove', e=>{
  e.preventDefault(); // bloquer TOUT touchmove, pas seulement multi
  if(e.touches.length>1)L('touchmove bloqué');
},{passive:false});

// ── Méthode B : gesture events ──
document.addEventListener('gesturestart',  e=>{e.preventDefault();L('gesturestart bloqué');},{passive:false});
document.addEventListener('gesturechange', e=>{e.preventDefault();L('gesturechange bloqué');},{passive:false});
document.addEventListener('gestureend',    e=>{e.preventDefault();L('gestureend bloqué');},{passive:false});

// ── Méthode C : reset scale via visualViewport si zoom quand même ──
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', ()=>{
    const s=window.visualViewport.scale;
    L('⚠️ scale='+s.toFixed(3));
    if(s!==1){
      // Forcer reset du viewport
      const m=document.querySelector('meta[name=viewport]');
      m.content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no';
      L('→ reset viewport forcé');
    }
  });
  L('visualViewport disponible, scale='+window.visualViewport.scale.toFixed(3));
} else {
  L('visualViewport NON disponible');
}

// ── Méthode D : pointer events sur la zone ──
const zone=document.getElementById('zone');
const ptrs={};
zone.addEventListener('pointerdown',e=>{
  e.preventDefault();zone.setPointerCapture(e.pointerId);
  ptrs[e.pointerId]=1;
  L('pointerdown total='+Object.keys(ptrs).length+' type='+e.pointerType);
},{passive:false});
zone.addEventListener('pointermove',e=>{
  e.preventDefault();
},{passive:false});
zone.addEventListener('pointerup',e=>{delete ptrs[e.pointerId];});
zone.addEventListener('pointercancel',e=>{delete ptrs[e.pointerId];});

L('Prêt');
</script>
</body>
</html>
