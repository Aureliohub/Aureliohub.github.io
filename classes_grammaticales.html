*{box-sizing:border-box}
button{font-family:inherit}
html,body{margin:0;height:100%;overflow-x:hidden}
body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;min-height:100vh}
.wrap{width:min(1000px,100%);padding:clamp(12px,2.5vw,28px);flex:1;display:flex;flex-direction:column}
h1{font-weight:600;font-size:clamp(1.4rem,3.2vw,2.1rem);margin:.2em 0 .8em}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}

/* Accueil */
.panel{background:var(--card);border-radius:18px;padding:clamp(16px,3vw,28px);box-shadow:0 4px 18px rgba(0,0,0,.06)}
.panel h2{font-size:1.15rem;margin:0 0 .7em}
details.cls-box{margin-bottom:1.4em}
body.capture #homeCard{display:block!important}
body.capture #home .panel{display:none}
body.capture .hcard{padding:48px 36px 52px}
body.capture .hcard .word{font-size:5.6rem;margin:.1em 0 .25em}
body.capture .hcard .phrase{font-size:2rem}
body.capture .hcard .choices{gap:16px;margin-top:40px}
body.capture .hcard .choice{font-size:1.6rem;padding:.7em .4em}
.hcard{margin-bottom:16px}
.hcard .phrase,.hcard .choice{opacity:1;animation:none}
details.cls-box summary{font-size:1.15rem;font-weight:700;cursor:pointer;list-style:none;margin-bottom:.7em;user-select:none}
details.cls-box summary::-webkit-details-marker{display:none}
details.cls-box summary::before{content:"▸";display:inline-block;margin-right:.45em;transition:transform .2s;color:var(--mut)}
details.cls-box[open] summary::before{transform:rotate(90deg)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.legend div{background:var(--p);border-radius:12px;padding:.7em .9em;font-size:.97rem;line-height:1.4}
.legend b{color:var(--c);font-size:1.05rem}
.legend i{color:var(--mut)}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.4em}
.seg button{border:2px solid var(--line);background:#f4f5f7;border-radius:12px;padding:.5em 1.1em;font-size:1.05rem;cursor:pointer;font-weight:600;color:var(--ink)}
.seg button.on{border-color:var(--accent);background:#e1e8fb;color:#2f4fa8}
.big{background:#c9d6f7;color:#24407f;border:0;border-radius:14px;padding:.75em 1.6em;font-size:1.2rem;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #a7b8e6;transition:transform .1s}
.big:active{transform:translateY(2px);box-shadow:0 1px 0 #a7b8e6}
.big:disabled{opacity:.35;cursor:default}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.seen{color:var(--mut);font-size:.9rem;margin:.9em 0 0}
.seen button{background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:inherit;padding:0}
:fullscreen .wrap{width:min(1200px,100%)}
@media (max-width:600px){.top .tools{display:none}.top{gap:8px;font-size:.9rem}.top .pill{padding:.2em .6em}.choice{padding:.55em .3em}}
.tools{display:flex;gap:4px;margin-left:auto;flex:none;position:relative}
.tbtn.act{color:#3550a8;background:#e1e8fb}
.selpanel{position:absolute;top:calc(100% + 8px);right:0;z-index:30;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:14px;width:250px;text-align:left}
.selpanel b{display:block;font-size:1rem;margin-bottom:10px;color:var(--ink)}
.selchips{display:grid;gap:6px;margin-bottom:10px}
.selchips button{border:2px solid transparent;border-radius:10px;padding:.4em .7em;font-size:1rem;font-weight:600;cursor:pointer;text-align:left;background:#f1f2f4;color:#9aa0a8}
.selchips button.on{background:var(--p);color:var(--c);border-color:var(--c)}
.selpanel .lnk{font-size:.9rem}
.tbtn{width:38px;height:38px;border-radius:10px;border:0;background:transparent;color:#9aa0a8;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .2s,background .2s}
.tbtn:hover{color:var(--ink);background:#eceef1}
.hrow{display:flex;align-items:center;gap:12px;margin:.2em 0 .8em}
.hrow h1{margin:0;color:#1f2328}
.trow{display:flex;justify-content:flex-end}

/* ---------- Version classe ---------- */
.hbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.hbar .t{color:#1f2328;font-weight:700;font-size:clamp(1.05rem,2vw,1.35rem)}
.hbar .sp{flex:1}
.tag{background:#e1e8fb;color:#2f4fa8;border-radius:99px;padding:.2em .8em;font-weight:600;font-size:.95rem}
.lnk{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font-size:1rem;padding:0}
.lnk:hover{color:var(--ink)}
.lobby{display:grid;grid-template-columns:minmax(0,21vw) minmax(0,1fr);gap:4vw;align-items:center;padding:2vh 1vw}
.qrbox{position:relative;display:block;width:100%;background:#fff;border:0;border-radius:1.3em;padding:1em;box-shadow:0 8px 26px rgba(0,0,0,.08);cursor:pointer;overflow:visible}
.qrbox>svg{display:block;width:100%;height:auto;transition:opacity .15s}
.qr-ico,.qr-x{display:flex;align-items:center;justify-content:center;border-radius:50%;background:#2b2b2b;color:#fff;border:0}
.qr-ico{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);opacity:0;transition:opacity .15s;pointer-events:none}
.qr-ico svg,.qr-x svg{display:block;width:50%;height:50%}
.qr-tip{position:absolute;left:50%;top:calc(100% + .9em);transform:translateX(-50%);background:#2b2b2b;color:#fff;font-weight:600;font-size:.95rem;white-space:nowrap;padding:.45em .8em;border-radius:.4em;opacity:0;transition:opacity .15s;pointer-events:none;z-index:2}
.qr-tip::before{content:"";position:absolute;left:50%;bottom:100%;transform:translateX(-50%);border:.45em solid transparent;border-bottom-color:#2b2b2b}
@media (hover:hover){.qrbox:hover>svg{opacity:.22}.qrbox:hover .qr-ico,.qrbox:hover .qr-tip{opacity:1}}
.qrbox:focus-visible>svg{opacity:.22}.qrbox:focus-visible .qr-ico,.qrbox:focus-visible .qr-tip{opacity:1}
.lobby h2{font-size:clamp(1.3rem,2.6vw,1.9rem);margin:0 0 .4em}
.lobby .sub{color:var(--mut);font-size:1.1rem;margin:0 0 1em;line-height:1.5}
.joined{font-size:1.4rem;font-weight:700;margin:.4em 0 1em}
.warn{color:var(--ko);font-weight:600}
.ovl{position:fixed;inset:0;background:rgba(29,35,64,.78);display:flex;align-items:center;justify-content:center;z-index:20;padding:3vh}
.qrbig{position:relative;background:#fff;border-radius:1.6em;padding:3vh;cursor:default}
.qrbig>svg{display:block;width:min(82vh,84vw);height:auto}
.qr-x{position:absolute;top:-.9em;right:-.9em;width:2.6em;height:2.6em;box-shadow:0 0 0 .25em #fff;cursor:pointer;font-size:1rem}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.tile{background:var(--card);border-radius:16px;padding:14px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.tile b{display:block;font-size:clamp(1.6rem,3.4vw,2.4rem);line-height:1.1}
.tile b small{font-size:.5em;color:var(--mut);font-weight:600}
.tile span{color:var(--mut);font-size:.95rem}
.gbar{display:flex;height:14px;background:#e3e6ea;border-radius:99px;overflow:hidden;margin-bottom:16px}
.gbar i{display:block;height:100%}
.gbar .g-ok{background:#7cc79b}.gbar .g-ko{background:#ee9b9b}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.wchip{border:0;border-radius:14px;padding:.6em .7em;cursor:pointer;text-align:left;background:#eef0f3;color:var(--ink);transition:transform .12s}
.wchip:hover{transform:translateY(-2px)}
.wchip b{display:block;font-size:1.15rem}
.wchip small{color:var(--mut)}
.wchip strong{float:right;font-size:1.05rem}
.wchip.c-ok{background:#dcf1e4}.wchip.c-mid{background:#fdf0cf}.wchip.c-ko{background:#fbdcdc}
.hacts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.navb2{font-size:1rem;padding:.45em .9em}
.plen{background:var(--card);border-radius:22px;padding:clamp(16px,3vw,30px);box-shadow:0 8px 26px rgba(0,0,0,.07);text-align:center}
.pnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.pnav b{color:var(--mut);font-weight:600}
.dist{display:grid;gap:4px;margin:14px auto 4px;max-width:720px;text-align:left}
.drow{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;border-radius:12px;padding:2px 6px;border:3px solid transparent}
.drow .lab{background:var(--p);color:var(--c);border-radius:10px;padding:.2em .6em;font-weight:700;text-align:center}
.drow .bar2{height:20px;background:#eef0f3;border-radius:8px;overflow:hidden}
.drow .bar2 i{display:block;height:100%;background:#b9c3d3;border-radius:8px;transition:width .5s}
.drow .n{font-weight:700;font-size:1.1rem}
.drow.good{border-color:var(--ok);background:#eaf7ef}
.drow.good .bar2 i{background:var(--ok)}
.drow.bad .bar2 i{background:#ee9b9b}
.plen .fb{max-width:820px;margin:16px auto 0}
.pwait{max-width:520px;margin:12vh auto 0;text-align:center}
.pwait h2{font-size:1.5rem;margin:0 0 .5em}
.pwait p{color:var(--mut);font-size:1.1rem;line-height:1.5}
.netmsg{background:#fdf0cf;border-radius:10px;padding:.4em .8em;margin-bottom:10px;text-align:center;font-size:.95rem}
.dots::after{content:"";animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
body.phone #again,body.phone #menu{display:none}
#pquit{display:none}
body.phone #pquit{display:inline-block}
.errsum{text-align:center;color:var(--mut);margin:-.4em 0 1em}
.errs.fixed li{background:#eef8f2;color:#4a6b57}
@media (max-width:800px){.lobby{grid-template-columns:1fr}.qrbox{max-width:14em;margin:0 auto}.tiles{grid-template-columns:1fr 1fr}.drow{grid-template-columns:110px 1fr 50px}}
.big.alt{background:#eef0f3;color:var(--ink);box-shadow:0 3px 0 #cfd3da}

/* Jeu */
.top{display:flex;align-items:center;gap:14px;margin-bottom:14px;font-weight:600;font-size:clamp(.95rem,1.8vw,1.15rem)}
.bar{flex:1;height:12px;background:#cfd2d8;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#8fa8e8;border-radius:99px;transition:width .4s}
.pill{background:#fff;border-radius:99px;padding:.25em .8em;white-space:nowrap}
.streak{color:#b4532a}
.quit{background:none;border:0;color:var(--mut);cursor:pointer;font-size:1rem;text-decoration:underline}
.card{background:var(--card);border-radius:22px;padding:clamp(14px,3vw,26px) clamp(14px,3vw,30px);text-align:center;box-shadow:0 8px 26px rgba(0,0,0,.07);position:relative;overflow:hidden}
.q{color:var(--mut);font-size:clamp(.95rem,1.8vw,1.15rem);margin:0}
.word{font-size:clamp(2.1rem,6vw,3.6rem);font-weight:700;margin:0 0 .15em;min-height:1.2em;line-height:1.15}
.word span{display:inline-block;opacity:0;transform:translateY(.6em) scale(.6);animation:pop .45s cubic-bezier(.2,1.6,.4,1) forwards}
.word span.sp{width:.3em}
@keyframes pop{to{opacity:1;transform:none}}
.phrase{font-size:clamp(1.2rem,3vw,1.7rem);margin:0 auto;max-width:28em;line-height:1.45;opacity:0;animation:fade .5s .35s forwards}
@keyframes fade{to{opacity:1}}
mark{background:#2f3542;color:#fff;padding:0 .25em;border-radius:6px;font-weight:600}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.2vw,12px);margin-top:clamp(14px,2.5vw,22px)}
.choices[data-n="1"]{grid-template-columns:1fr}
.choices[data-n="2"],.choices[data-n="4"]{grid-template-columns:repeat(2,1fr)}
.choice{border:3px solid transparent;background:var(--p);color:var(--c);border-radius:16px;padding:clamp(.35em,1vw,.5em) .4em;font-size:clamp(1rem,2vw,1.25rem);font-weight:600;cursor:pointer;transition:transform .12s,border-color .15s;opacity:0;animation:fade .4s forwards}
.choice .k{font-size:.6em;opacity:.5;font-weight:500;margin-left:.4em;vertical-align:middle}
.choice:disabled{cursor:default}
@media (hover:hover){.choice:hover:not(:disabled){transform:translateY(-3px);border-color:var(--c)}}
@media (hover:none){.choice .k{display:none}}
.choice.good{background:var(--ok);color:#fff;border-color:var(--ok);animation:none;opacity:1;transform:scale(1.04)}
.choice.bad{background:var(--ko);color:#fff;border-color:var(--ko);animation:shake .45s;opacity:1}
.choice.dim{opacity:.4;animation:none}
.choice.still{animation:none;opacity:1}
.choice.dim.still{opacity:.4}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.card.okflash{animation:okf .7s}
@keyframes okf{0%{box-shadow:0 0 0 0 rgba(46,158,94,.55)}100%{box-shadow:0 0 0 22px rgba(46,158,94,0)}}

.fb{margin-top:16px;border-radius:18px;padding:clamp(14px,2.6vw,24px);text-align:left;font-size:clamp(1rem,2vw,1.18rem);line-height:1.5;animation:slide .4s ease-out}
@keyframes slide{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.fb.ok{background:#dff3e7}
.fb.ko{background:#fff;border:2px solid #efc0c0}
.fb .h{font-weight:800;font-size:1.12em;margin-bottom:.4em}
.fb.ok .h{color:#237a48} .fb.ko .h{color:var(--ko)}
.fb .row{margin:.45em 0}
.fb .lab{font-weight:700}
.fb .def{background:var(--p);border-radius:12px;padding:.55em .8em;margin:.5em 0}
.fb details summary{cursor:pointer;color:var(--mut);font-size:.92em;margin-top:.6em;user-select:none}
.fb details summary:hover{color:var(--ink)}
.fb .def i{color:var(--mut)}
.tip{background:#fff6d8;border-radius:12px;padding:.55em .8em;margin-top:.6em}
.navb{position:absolute;top:14px;z-index:2;font-size:1rem;padding:.45em .9em;border-radius:12px}
#prevBtn{left:14px}
#nextBtn{right:14px}
@media (max-width:600px){.card{padding-top:62px}.hcard{padding-top:18px}}
.cls{font-weight:800}

/* Fin */
.score{font-size:clamp(3rem,10vw,5.5rem);font-weight:800;margin:.1em 0;color:#3f5fb8;text-align:center}
.msg{text-align:center;font-size:1.25rem;margin:0 0 1em}
.errs{list-style:none;padding:0;margin:0 0 1.4em}
.errs li{background:#fff;border-left:6px solid var(--p);border-radius:10px;padding:.6em .9em;margin:.5em 0;font-size:1.05rem}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

.confetti{position:absolute;width:10px;height:14px;top:40%;left:50%;border-radius:2px;pointer-events:none;animation:conf 1s ease-out forwards}
@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@media (max-width:600px){.choices{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div class="wrap">

<!-- ACCUEIL -->
<section id="home" class="screen on">
  <div class="hrow" id="homeRow"><h1>Quelle est la <mark>classe</mark> grammaticale de ce mot ?</h1></div>
  <div class="card hcard" id="homeCard" style="display:none">
    <div class="word" id="hWord"></div>
    <p class="phrase" id="hPhrase"></p>
    <div class="choices" id="hChoices"></div>
  </div>
  <div class="panel">
    <details class="cls-box" id="clsBox" open><summary>Classes grammaticales</summary><div class="legend" id="legend"></div></details>
    <h2>Nombre de mots</h2>
    <div class="seg" id="seg"></div>
    <button class="big" id="start">Commencer</button>
    <p class="seen" id="seenInfo"></p>
  </div>
</section>

<!-- JEU -->
<section id="game" class="screen">
  <div class="top">
    <span class="pill" id="count">1 / 15</span>
    <div class="bar"><i id="prog"></i></div>
    <span class="pill"><span id="pts">0</span> juste<span id="ptsS">s</span></span>
    <span class="pill streak" id="streak" title="Série de bonnes réponses">Série 0</span>
    <button class="quit" id="quit">Arrêter</button>
  </div>
  <div class="card" id="card">
    <button class="big alt navb" id="prevBtn">← Précédent</button>
    <button class="big navb" id="nextBtn">Suivant →</button>
    <div class="word" id="word"></div>
    <p class="phrase" id="phrase"></p>
    <div class="choices" id="choices"></div>
  </div>
  <div id="fbzone"></div>
</section>

<!-- VERSION CLASSE : écran de la classe et attente sur téléphone -->
<section id="host" class="screen"></section>
<section id="pwait" class="screen"><div class="pwait" id="pwaitBox"></div></section>

<!-- FIN -->
<section id="end" class="screen">
  <div class="trow" id="endRow"></div>
  <h1 style="text-align:center;margin-bottom:.2em">Résultat</h1>
  <div class="score" id="final"></div>
  <p class="msg" id="msg"></p>
  <p class="msg" id="pmsg" style="display:none;color:var(--mut);font-size:1.05rem">Les résultats du groupe s'affichent au tableau.</p>
  <div id="errzone"></div>
  <div class="btns">
    <button class="big alt" id="back">← Revenir aux questions</button>
    <button class="big alt" id="redo" style="display:none">Revoir mes erreurs</button>
    <button class="big" id="again">Nouvelle partie</button>
    <button class="big alt" id="menu">Menu</button>
    <button class="big alt" id="pquit">Quitter</button>
  </div>
</section>

        var b2 = read();
        var b3 = read();

      var bytes = [];

        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

const $ = id => document.getElementById(id);
const NB = " ";
const typo = s => s.replace(/ ([?!:;])/g, NB+"$1").replace(/« /g,"«"+NB).replace(/ »/g,NB+"»");
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const marked = s => typo(esc(s)).replace(/\*([^*]+)\*/g,"<mark>$1</mark>");
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const art = k => C[k].a+" "+C[k].n;
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);

// Tirage équilibré (±1 mot par classe), sans reprendre les mots déjà proposés,
// avec quelques paires : le même mot dans deux emplois différents, à la suite.
function wordGroups(){
  const g={}; W.forEach((w,x)=>{ const k=w[0].toLowerCase(); (g[k]=g[k]||[]).push(x); });
  return Object.values(g).filter(a=>new Set(a.map(x=>W[x][2])).size>1);
}
function drawSeries(n){
  const ACT = ORDER.filter(k=>SEL.has(k)), NA = ACT.length;
  const fresh = a => a.filter(x=>!seen.has(x)).length;
  const groups = shuffle(wordGroups().map(g=>g.filter(x=>SEL.has(W[x][2]))).filter(g=>new Set(g.map(x=>W[x][2])).size>1)).sort((a,b)=>(fresh(b)>=2)-(fresh(a)>=2));
  const nPairs = Math.min(Math.round(n/5), groups.length), pairs=[], used=new Set();
  for(const grp of groups){
    if(pairs.length>=nPairs) break;
    const c = shuffle(grp.slice()).sort((a,b)=>seen.has(a)-seen.has(b));
    const a=c[0], b=c.find(x=>W[x][2]!==W[a][2]);
    pairs.push(shuffle([a,b])); used.add(W[a][0].toLowerCase());
  }
  const ord = shuffle(ACT.slice()), target={};
  ord.forEach((k,j)=>target[k]=Math.floor(n/NA)+(j<n%NA?1:0));
  pairs.flat().forEach(x=>target[W[x][2]]--);
  const by={};
  ACT.forEach(k=>{
    const all = W.map((w,x)=>x).filter(x=>W[x][2]===k && !used.has(W[x][0].toLowerCase()));
    let fr = all.filter(x=>!seen.has(x));
    if(fr.length < Math.max(target[k],0)){ W.forEach((w,x)=>{ if(w[2]===k) seen.delete(x); }); fr = all.slice(); }
    by[k] = shuffle(fr).concat(shuffle(all.filter(x=>!fr.includes(x))));
  });
  saveSeen();
  const singles=[], need=n-pairs.length*2;
  let relax=false;
  while(singles.length<need){
    let moved=false;
    for(const k of ord){ if(singles.length>=need) break; if((relax||target[k]>0) && by[k].length){ singles.push(by[k].shift()); target[k]--; moved=true; } }
    if(!moved){ if(relax) break; relax=true; }
  }
  const blocks = shuffle(singles.map(x=>[x]).concat(pairs));
  return blocks.flat().map(x=>W[x]);
}
function start(list, first){
  REDO = !!list; if(!list){ BASE = null; CLS = ORDER.filter(k=>SEL.has(k)); }
  let pool = list ? list.slice() : shuffle(W.filter(w=>SEL.has(w[2])));
  if(!list && nb) pool = drawSeries(first ? nb-1 : nb);
  if(first) pool = [first].concat(pool.filter(w=>w!==first));
  if(list || !nb) for(let k=1;k<pool.length;k++) if(pool[k][0]===pool[k-1][0]){ const j=pool.findIndex((w,x)=>x>k && w[0]!==pool[k][0] && w[0]!==pool[k-1][0]); if(j>0)[pool[k],pool[j]]=[pool[j],pool[k]]; }
  deck = pool; i = 0; ans = [];
  show("game"); ask();
}

function ask(){
  const [mot, phr] = deck[i], done = ans[i]!==undefined;
  if(MODE==="solo"){ seen.add(W.indexOf(deck[i])); saveSeen(); }
  window.scrollTo(0,0);
  $("count").textContent = `${i+1} / ${deck.length}`;
  $("prog").style.width = (ans.filter(a=>a!==undefined).length/deck.length*100)+"%";
  $("fbzone").innerHTML = "";
  $("word").innerHTML = [...mot].map((ch,n)=> ch===" " ? `<span class="sp" style="animation-delay:${n*45}ms"> </span>` : `<span style="animation-delay:${n*45}ms">${esc(ch)}</span>`).join("");
  const ph = $("phrase"); ph.style.animation="none"; ph.offsetHeight; ph.style.animation="";
  ph.innerHTML = marked(phr);
  $("choices").dataset.n = CLS.length;
  $("choices").innerHTML = CLS.map((k,n)=>`<button class="choice" style="--c:${C[k].c};--p:${C[k].p};animation-delay:${450+n*70}ms" data-k="${k}">${cap(C[k].n)}</button>`).join("");
  if(done) showAnswer(ans[i], false);
  updNav();
}
$("choices").onclick = e => { const b=e.target.closest(".choice"); if(b && ans[i]===undefined){ ans[i]=b.dataset.k; showAnswer(b.dataset.k, true); updNav(); pAnswered(i, b.dataset.k); } };

function updNav(){

  $("prevBtn").disabled = i===0;
  $("nextBtn").disabled = !done;
  $("nextBtn").textContent = i+1<deck.length ? "Suivant →" : "Résultat →";

function showAnswer(k, fresh){

  const defBox = `<div class="def" style="--p:${C[cl].p}"><b style="color:${C[cl].c}">${cap(C[cl].n)}s${NB}:</b> ${typo(esc(C[cl].def))}<br><i>ex.${NB}: ${typo(esc(C[cl].ex))}</i></div>`;

  if(ok){
    if(fresh){ const card=$("card"); card.classList.remove("okflash"); card.offsetWidth; card.classList.add("okflash"); confetti(); }
    h = `<div class="fb ok"><div class="h">Bravo ! C'est bien ${art(cl)}.</div>${note?`<div class="row">${typo(esc(note))}</div>`:""}</div>`;
  }else{
    const pair = PAIR[[k,cl].sort().join("|")];
    h = `<div class="fb ko">
      <div class="h">Pas tout à fait. «${NB}${esc(mot)}${NB}» est ici <span class="cls" style="color:${C[cl].c}">${art(cl)}</span>.</div>
      <div class="row"><span class="lab">Pourquoi${NB}?</span> ${typo(esc(note || C[cl].why))}</div>
      ${pair?`<div class="row"><span class="lab">${cap(C[k].n)} ou ${C[cl].n}${NB}?</span> ${typo(esc(pair))}</div>`:""}

      <details><summary>Rappel${NB}: les ${C[cl].n}s</summary>${defBox}</details>
    </div>`;

let doneDeck = [], BASE = null, REDO = false, CLS = ORDER.slice();
/* Résultat : toujours celui de la série d'origine ; les erreurs corrigées ensuite sont listées à part */
function finish(){
  if(!REDO || !BASE) BASE = { deck, ans, fixed:new Set(), best:bestStreak() };
  else deck.forEach((w,k)=>{ if(ans[k]===w[2]) BASE.fixed.add(w); });
  const D=BASE.deck, A=BASE.ans, idx=D.map((w,k)=>k).filter(k=>A[k]!==undefined);
  const n=idx.length, p=idx.filter(k=>A[k]===D[k][2]).length, pc=n?Math.round(p/n*100):0;
  const errs=idx.filter(k=>A[k]!==D[k][2]).map(k=>D[k]);
  const fixed=errs.filter(w=>BASE.fixed.has(w)), rest=errs.filter(w=>!BASE.fixed.has(w));
  $("final").textContent = `${p} / ${n}`;
  $("msg").textContent = (pc>=90?"Excellent !":pc>=70?"Très bien !":pc>=50?"C'est en bonne voie.":"Continue à t'entraîner, tu vas progresser !") + (BASE.best>2?`  Meilleure série : ${BASE.best}.`:"");
  const li = (w,cls) => `<li class="${cls||""}" style="--p:${C[w[2]].p}">${marked(w[1])} → <b style="color:${C[w[2]].c}">${C[w[2]].n}</b></li>`;
  $("errzone").innerHTML = (errs.length ? `<p class="errsum">${plural(errs.length,"erreur","erreurs")}${fixed.length?` dont ${fixed.length} corrigée${fixed.length>1?"s":""} ensuite`:""}</p>` : "")
    + (rest.length ? `<h2 style="font-size:1.15rem">À revoir</h2><ul class="errs">${rest.map(w=>li(w)).join("")}</ul>` : "")
    + (fixed.length ? `<h2 style="font-size:1.15rem">Erreurs corrigées</h2><ul class="errs fixed">${fixed.map(w=>li(w)).join("")}</ul>` : "");
  doneDeck = rest;
  $("redo").style.display = rest.length ? "" : "none";
  $("back").style.display = n ? "" : "none";
  show("end");
}

/* ============================================================
   VERSION CLASSE — écran de la classe (hôte) et téléphones
   Relais MQTT public, messages chiffrés (AES-GCM) avec le code de la partie.
   ============================================================ */
const RELAYS = ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt'];
const qs = new URLSearchParams(location.search);
const TEST_RELAY = qs.get('relais');
let MODE = 'solo';
const rnd = n => Math.floor(Math.random()*n);
const rid = n => { const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let k=0;k<n;k++) s+=A[rnd(A.length)]; return s; };
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const te = new TextEncoder(), td = new TextDecoder();
async function mkRoom(code){
  const h = async s => new Uint8Array(await crypto.subtle.digest('SHA-256', te.encode(s)));
  const key = await crypto.subtle.importKey('raw', await h('cg-cle|'+code), 'AES-GCM', false, ['encrypt','decrypt']);
  const topic = 'cg1/' + [...(await h('cg-salle|'+code))].slice(0,10).map(b=>b.toString(16).padStart(2,'0')).join('');
  return { key, topic };
}
async function seal(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, te.encode(JSON.stringify(obj))));
  let s=''; for(const b of iv) s+=String.fromCharCode(b); for(const b of ct) s+=String.fromCharCode(b);
  return btoa(s);
}
async function unseal(key, b64){
  try{
    const bin=atob(b64), u=new Uint8Array(bin.length); for(let k=0;k<bin.length;k++) u[k]=bin.charCodeAt(k);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:u.slice(0,12)}, key, u.slice(12));
    return JSON.parse(td.decode(pt));
  }catch(e){ return null; }
}
const openRelay = idx => mqtt.connect(TEST_RELAY || RELAYS[idx], { clientId:'cg_'+rid(10), clean:true, reconnectPeriod:2500, connectTimeout:7000, keepalive:30 });
function qrSvg(text){
  const q = qrcode(0,'M'); q.addData(text); q.make();
  const n=q.getModuleCount(), m=2; let d='';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) d+=`M${c+m} ${r+m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n+2*m} ${n+2*m}" role="img" aria-label="Code QR pour rejoindre" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#2a2e37"/></svg>`;
}
const plural = (n,a,b) => n+' '+(n>1?b:a);

/* ---------- Écran de la classe ---------- */
const H = { code:'', ri:0, room:null, c:null, ready:false, net:false, err:'', qr:false, n:10, g:null, pv:null };
async function hostInit(){
  MODE = 'host'; document.body.classList.add('host');
  H.code = rid(6); H.n = [10,15,20].includes(nb) ? nb : 10;
  H.g = { ph:'lobby', sid:0, deck:[], players:[] };
  show('host');
  $('host').onclick = hClick;
  if(!window.crypto || !crypto.subtle){ H.err = 'Cette page doit être ouverte en https (par exemple depuis GitHub Pages).'; return hRender(); }
  if(typeof mqtt === 'undefined'){ H.err = 'Le module de connexion n’a pas pu être chargé.'; return hRender(); }
  H.room = await mkRoom(H.code);
  hRender(); tryRelay(0,0);
  setInterval(hPublish, 4000);
}
function tryRelay(idx, tries){
  H.err=''; H.ready=false;
  if(H.c){ try{ H.c.end(true); }catch(e){} }
  const c = H.c = openRelay(idx);
  const giveUp = setTimeout(()=>{
    if(H.ready || H.c!==c) return;
    try{ c.end(true); }catch(e){}
    if(tries+1 < RELAYS.length && !TEST_RELAY) tryRelay((idx+1)%RELAYS.length, tries+1);
    else { H.err='Impossible de joindre le serveur relais. Vérifie la connexion internet (un wifi très filtré peut bloquer le relais).'; hRender(); }
  }, 8000);
  c.on('connect', ()=>{ if(H.c!==c) return; clearTimeout(giveUp); H.ri=idx; H.ready=true; H.net=true; c.subscribe(H.room.topic+'/h'); hPublish(); hRender(); });
  c.on('close', ()=>{ if(H.c===c && H.ready && H.net){ H.net=false; hRender(); } });
  c.on('message', async (t,payload)=>{ const m = await unseal(H.room.key, payload.toString()); if(m && H.c===c){ if(!H.net){ H.net=true; } hMsg(m); } });
}
/* Aucun prénom : les téléphones ne sont identifiés que par un code aléatoire */
function pub(){
  const g=H.g, d={};
  g.players.forEach(p=>{ d[p.id] = g.deck.map((_,k)=>p.a[k]?'1':'0').join(''); });
  return { ph:g.ph, sid:g.sid, deck:g.deck, sel:g.sel||ORDER, d };
}
async function hPublish(){ if(H.c && H.c.connected) H.c.publish(H.room.topic+'/s', await seal(H.room.key, pub())); }
function commit(){ hPublish(); hRender(); }
function hPlayer(pid){
  const g=H.g; let p=g.players.find(x=>x.id===pid);
  if(!p){ p={ id:String(pid).slice(0,16), a:[] }; g.players.push(p); }
  return p;
}
function hMsg(m){
  const g=H.g;
  if(m.t==='hello') return hPublish();
  if(m.t==='join' && m.pid){ const had=g.players.some(p=>p.id===m.pid); hPlayer(m.pid); return had ? hPublish() : commit(); }
  if(m.t==='ans' && m.pid && g.ph==='run' && m.sid===g.sid){
    const k=+m.i; if(!Number.isInteger(k) || k<0 || k>=g.deck.length || !ORDER.includes(m.v)) return hPublish();
    const p=hPlayer(m.pid); if(p.a[k]) return hPublish();
    p.a[k]=m.v; commit();
  }
}
function hStart(){
  const g=H.g;
  g.deck = drawSeries(H.n).map(w=>W.indexOf(w)); g.deck.forEach(x=>seen.add(x)); saveSeen();
  g.sel = ORDER.filter(k=>SEL.has(k));
  g.sid++; g.ph='run'; g.players.forEach(p=>p.a=[]); H.pv=null; H.qr=false; commit();
}
function wStats(k){
  const g=H.g, cl=W[g.deck[k]][2], dist={}; ORDER.forEach(c=>dist[c]=0);
  let a=0, o=0; g.players.forEach(p=>{ const v=p.a[k]; if(v){ a++; dist[v]++; if(v===cl) o++; } });
  return { a, o, dist };
}
function gStats(){
  const g=H.g, N=g.players.length, L=g.deck.length; let a=0, o=0, fin=0;
  g.players.forEach(p=>{ let n=0; g.deck.forEach((x,k)=>{ if(p.a[k]){ n++; a++; if(p.a[k]===W[x][2]) o++; } }); if(L && n===L) fin++; });
  return { N, L, T:N*L, a, o, fin };
}
const errIdx = () => H.g.deck.map((_,k)=>k).filter(k=>{ const s=wStats(k); return s.a>s.o; });
function hClick(e){
  const b=e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a, v=b.dataset.v, g=H.g;

  else if(a==='n'){ H.n=+v; hRender(); }

  else if(a==='stop'){ g.ph='end'; commit(); }
  else if(a==='new'){ g.ph='lobby'; g.deck=[]; g.players.forEach(p=>p.a=[]); H.pv=null; commit(); }
  else if(a==='solo'){ location.href = location.pathname; }

  else if(a==='errs'){ const l=errIdx(); if(l.length){ H.pv={ list:l, j:0, rev:false }; hRender(); } }
  else if(a==='pprev'){ if(H.pv.j>0){ H.pv.j--; H.pv.rev=false; hRender(); } }
  else if(a==='pnext'){ if(H.pv.j<H.pv.list.length-1){ H.pv.j++; H.pv.rev=false; hRender(); } }
  else if(a==='rev'){ H.pv.rev=!H.pv.rev; hRender(); }
  else if(a==='pclose'){ H.pv=null; hRender(); }
}
function joinUrl(){ return location.origin + location.pathname + '?p=' + H.code + '&r=' + H.ri + (TEST_RELAY ? '&relais='+encodeURIComponent(TEST_RELAY) : ''); }

/* ---------- Téléphone ---------- */
const P = { code:'', pid:'', room:null, c:null, net:false, st:null, sid:0, deck:null, ans:null, late:false };
async function playerInit(){
  MODE='phone'; document.body.classList.add('phone');
  P.code = (qs.get('p')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  show('pwait');
  if(P.code.length!==6 || !window.crypto || !crypto.subtle || typeof mqtt==='undefined'){ pWait('Code QR non valable', 'Scanne à nouveau le code QR affiché au tableau.'); return; }
  P.pid = store.get('cg-pid-'+P.code) || rid(10); store.set('cg-pid-'+P.code, P.pid);
  P.room = await mkRoom(P.code);
  pWait('Connexion…', '');
  const c = P.c = openRelay(+qs.get('r')===1 ? 1 : 0);
  c.on('connect', ()=>{ P.net=true; c.subscribe(P.room.topic+'/s'); pSend({t:'hello'}); pSend({t:'join', pid:P.pid}); pSync(); });
  c.on('close', ()=>{ P.net=false; pSync(); });
  c.on('message', async (t,payload)=>{ const m = await unseal(P.room.key, payload.toString()); if(m){ P.st=m; pSync(); } });
  setTimeout(()=>{ P.late=true; pSync(); }, 12000);
  P.tick = setInterval(pTick, 1500);
  $("quit").textContent = "Quitter";
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) pSend({t:'hello'}); });
}
async function pSend(m){ if(P.c && P.c.connected) P.c.publish(P.room.topic+'/h', await seal(P.room.key, m)); }
function pWait(t, s){ $('pwaitBox').innerHTML = `<h2>${t}</h2>${s?`<p>${s}</p>`:''}`; }
function pSync(){
  if(P.quit) return;
  const st=P.st;
  if(!st){
    if(!P.net) pWait('<span class="dots">Connexion</span>', P.late ? 'La connexion prend du temps. Vérifie que ton téléphone est connecté à internet.' : '');
    else pWait('<span class="dots">Connexion</span>', P.late ? 'L’écran de la classe ne répond pas. Le code QR a peut-être changé : scanne-le à nouveau.' : '');
    return;
  }
  if(st.ph!=='lobby' && st.sid && st.sid!==P.sid && st.deck && st.deck.length){
    P.sid=st.sid; P.deck=st.deck.map(x=>W[x]); CLS = ORDER.filter(k=>(st.sel||ORDER).includes(k));
    const saved = store.get('cg-a-'+P.code+'-'+P.sid) || [];
    P.ans = P.deck.map((_,k)=>ORDER.includes(saved[k]) ? saved[k] : undefined);
    deck=P.deck; ans=P.ans; i=Math.max(0, ans.findIndex(a=>a===undefined)); if(ans.every(a=>a!==undefined)) i=deck.length-1;
    $('pmsg').style.display='';
    show('game'); ask(); return;
  }
  if(st.ph==='lobby' || !st.sid){ P.sid=0; pWait('Tu es connecté', 'Attends que la série commence au tableau.'); show('pwait'); return; }
}
function pTick(){
  const st=P.st;
  if(!st) return pSend({t:'hello'});
  const me = st.d ? st.d[P.pid] : null;
  if(me==null) return pSend({t:'join', pid:P.pid});
  if(st.ph==='run' && st.sid===P.sid && P.ans) P.ans.forEach((v,k)=>{ if(v && me[k]!=='1') pSend({t:'ans', pid:P.pid, sid:P.sid, i:k, v}); });
}
/* Quitter : le téléphone se déconnecte sans rien envoyer ; l'écran de la classe garde ses réponses */
function pQuit(){
  clearInterval(P.tick); P.quit = true;
  try{ P.c && P.c.end(true); }catch(e){}
  pWait("Merci !", "Tu peux fermer cette page.");
  show("pwait");
  try{ window.close(); }catch(e){}
}
function pAnswered(k, v){
  if(MODE!=='phone' || deck!==P.deck) return;
  store.set('cg-a-'+P.code+'-'+P.sid, P.ans);
  pSend({t:'ans', pid:P.pid, sid:P.sid, i:k, v});
}

/* ---------- Clavier ---------- */
document.addEventListener("keydown", e=>{
  if(!$("game").classList.contains("on")) return;
  if(ans[i]===undefined && /^[1-6]$/.test(e.key)){ const b=document.querySelectorAll(".choice")[+e.key-1]; if(b) b.click(); }
  else if(e.key==="ArrowLeft"){ prev(); }
  else if(e.key==="ArrowRight" || (ans[i]!==undefined && (e.key==="Enter"||e.key===" "))){ e.preventDefault(); next(); }
});

$("qrBtn").onclick = () => { if(MODE==="host"){ H.qr=!H.qr; hRender(); } else hostInit(); };
document.addEventListener("keydown", e=>{ if(MODE==="host" && e.key==="Escape" && H.qr){ H.qr=false; hRender(); } });
if(qs.has("p")) playerInit();
else if(qs.has("classe")) { buildHome(); hostInit(); }
else buildHome();
if(MODE==="solo" && $("home").classList.contains("on")) placeTools("home");
</script>
