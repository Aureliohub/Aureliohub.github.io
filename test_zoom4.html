<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test zoom 4 — multi-pages</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;height:100dvh;overflow:hidden;}
  body{font-family:sans-serif;background:#F7F6F2;display:flex;flex-direction:column;}
  header{background:#fff;border-bottom:1px solid #ddd;padding:.5rem 1rem;display:flex;align-items:center;gap:8px;flex-shrink:0;}
  nav{display:flex;gap:6px;margin-left:auto;}
  .nav-btn{padding:4px 12px;border-radius:20px;border:1px solid #ddd;background:transparent;font-size:12px;font-weight:700;cursor:pointer;}
  .nav-btn.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a;}
  .page{display:none;flex:1;flex-direction:column;min-height:0;overflow:hidden;}
  .page.active{display:flex;}
  /* Page animation */
  #page-anim{flex-direction:column;}
  #controls-anim{background:#fff;border-bottom:1px solid #ddd;padding:.4rem .8rem;display:flex;gap:8px;flex-shrink:0;}
  /* Page tracés */
  #page-traces{flex-direction:column;}
  #controls-traces{background:#fff;border-bottom:1px solid #ddd;padding:.4rem .8rem;display:flex;gap:8px;flex-shrink:0;touch-action:none;}
  #page-traces *{touch-action:none;}
  /* Shared canvas */
  .canvas-wrap{flex:1;position:relative;min-height:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  #log{position:absolute;bottom:8px;left:8px;background:rgba(255,255,255,.9);border-radius:8px;padding:6px;font-size:11px;max-height:100px;overflow-y:auto;max-width:90%;}
  button{padding:5px 12px;border-radius:20px;border:1px solid #ddd;background:transparent;font-size:12px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>
<header>
  Test multi-pages
  <nav>
    <button class="nav-btn active" onclick="showPage('anim')">Animation</button>
    <button class="nav-btn" onclick="showPage('traces')">Tracés</button>
    <button class="nav-btn" onclick="showPage('ex')">Exercices</button>
  </nav>
</header>

<div id="page-anim" class="page active">
  <div id="controls-anim">
    <button>Hauteurs</button><button>Médiatrices</button><button>Reset</button>
  </div>
  <div class="canvas-wrap">
    <canvas id="c1"></canvas>
    <div id="log1">Page Animation — pinch pour zoomer (autorisé ici)</div>
  </div>
</div>

<div id="page-traces" class="page">
  <div id="controls-traces">
    <button>Hauteurs</button><button>Médiatrices</button><button>Valider</button>
  </div>
  <div class="canvas-wrap">
    <canvas id="c2"></canvas>
    <div id="log2">Page Tracés — zoom doit être bloqué</div>
  </div>
</div>

<div id="page-ex" class="page" style="overflow-y:auto;padding:1rem;">
  <p style="font-size:14px;font-weight:700;">Page Exercices — contenu scrollable</p>
  <p style="margin-top:1rem;font-size:13px;">Lorem ipsum dolor sit amet...</p>
</div>

<script>
function showPage(p){
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  document.querySelectorAll('.nav-btn')[['anim','traces','ex'].indexOf(p)].classList.add('active');
}

function initCanvas(cv, logEl, allowZoom){
  const ctx=cv.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  function resize(){
    const r=cv.parentElement.getBoundingClientRect();
    cv.width=r.width*dpr;cv.height=r.height*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,r.width,r.height);
    ctx.beginPath();ctx.moveTo(r.width/2,50);ctx.lineTo(80,r.height-60);ctx.lineTo(r.width-80,r.height-60);ctx.closePath();
    ctx.fillStyle='rgba(200,200,200,.2)';ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#333';ctx.font='13px sans-serif';ctx.textAlign='center';
    ctx.fillText(allowZoom?'Zoom autorisé':'ZOOM DOIT ÊTRE BLOQUÉ',r.width/2,r.height/2);
  }
  resize();window.addEventListener('resize',resize);

  function L(m){const d=document.createElement('div');d.textContent=new Date().toLocaleTimeString()+' '+m;logEl.prepend(d);}

  function onDown(e){if(e.cancelable)e.preventDefault();}
  function onMove(e){if(e.cancelable)e.preventDefault();}
  function onUp(){}
  cv.addEventListener('mousedown',onDown);
  cv.addEventListener('mousemove',onMove);
  cv.addEventListener('mouseup',onUp);
  cv.addEventListener('touchstart',onDown,{passive:false});
  cv.addEventListener('touchmove',onMove,{passive:false});
  cv.addEventListener('touchend',onUp,{passive:false});

  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',()=>{
      L('⚠️ scale='+window.visualViewport.scale.toFixed(3));
    });
  }
}

initCanvas(document.getElementById('c1'),document.getElementById('log1'),true);
initCanvas(document.getElementById('c2'),document.getElementById('log2'),false);
</script>
</body>
</html>
